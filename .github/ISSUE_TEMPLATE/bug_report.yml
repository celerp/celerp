name: Bug Report
description: Report a bug to help us improve Celerp
title: "Bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: >
        This template is for **bugs**. Have a **feature idea** or a **question**? Please use
        [Discussions](https://github.com/celerp/celerp/discussions) - ideas go in the
        **Ideas** category.
  - type: input
    id: version
    attributes:
      label: Celerp version
      description: Shown under Settings, or in the title bar. Pre-filled when you open this from inside the app.
      placeholder: e.g. 1.2.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Pre-filled when you open this from inside the app.
      placeholder: e.g. macOS 14.4, Windows 11, Ubuntu 22.04
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Celerp does this touch? (Applied as an `area:` label for triage.)
      options:
        - Inventory
        - Invoicing / documents
        - Purchasing
        - Manufacturing
        - Accounting
        - Contacts / CRM
        - Reporting
        - Connectors / integrations / API
        - Setup / admin / permissions
        - Other / not sure
    validations:
      required: false
  - type: input
    id: page
    attributes:
      label: Page / URL where it happened
      description: The Celerp page you were on (e.g. `/inventory`). Pre-filled when you open this from inside the app.
      placeholder: "e.g. /inventory"
    validations:
      required: false
  - type: textarea
    id: current
    attributes:
      label: Currently, the system is...
      description: What is the system doing (that it shouldn't)? In your own words - and if you can, what you did to see it.
      placeholder: "When I ..., the system ..."
    validations:
      required: true
  - type: textarea
    id: should
    attributes:
      label: It should...
      description: What did you expect to happen instead?
      placeholder: "It should ..."
    validations:
      required: true
  - type: textarea
    id: so_that
    attributes:
      label: So that...
      description: Why does this matter - what are you trying to get done?
      placeholder: "...so that I can ..."
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs (if applicable)
      description: >
        Desktop app log locations -
        macOS: `~/Library/Application Support/celerp/celerp-data/logs/` ·
        Windows: `%APPDATA%\celerp\celerp-data\logs\` ·
        Linux: `~/.config/celerp/celerp-data/logs/`.
        Attach `api.log` and/or `ui.log` if relevant. For pip installs, paste any relevant terminal output.
      render: shell
    validations:
      required: false
  - type: textarea
    id: anything_else
    attributes:
      label: Anything else?
      description: Screenshots, context, or anything else that helps.
    validations:
      required: false
  - type: markdown
    attributes:
      value: >
        Thanks for reporting! If you find Celerp useful, consider giving us a
        ⭐ on [GitHub](https://github.com/celerp/celerp).
