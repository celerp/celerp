version: 2
updates:
  # Python ranges in pyproject.toml are policy; constraints.txt is a derived,
  # whole-graph resolution refreshed atomically by dependency-refresh.yml.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
