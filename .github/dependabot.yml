version: 2
updates:
  # constraints.txt holds the exact dependency set CI tests and releases pin.
  # One grouped weekly PR moves it forward through the full CI run.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
