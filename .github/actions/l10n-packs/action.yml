name: Fetch country packs
description: >
  Download every country pack at the version celerp/localization/packs.lock.json names and
  check it against the lock (scripts/l10n_packs.py fetch).
inputs:
  token:
    description: Read token for the country pack repositories
    required: true
runs:
  using: composite
  steps:
    - name: Fetch and check the packs
      shell: bash
      env:
        CELERP_L10N_TOKEN: ${{ inputs.token }}
      run: python3 scripts/l10n_packs.py fetch
