name: Validate Connect activation timeout fix

on:
  push:
    branches: [fix/connect-activation-timeout]
    paths:
      - ".github/workflows/apply-connect-timeout-fix.yml"
      - "scripts/_patch_connect_activation_timeout.py"

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: celerp
          POSTGRES_PASSWORD: celerp
          POSTGRES_DB: celerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/connect-activation-timeout
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Apply patch
        run: |
          python scripts/_patch_connect_activation_timeout.py
          python -m compileall -q ui celerp tests/test_connect_activation_timeout.py
      - name: Install deps
        run: pip install uv && uv pip install --system -e ".[dev]"
      - name: Run Connect regressions
        env:
          ALLOW_INSECURE_JWT: "true"
          DATABASE_URL: postgresql+asyncpg://celerp:celerp@localhost:5432/celerp_test
        run: >-
          pytest -q --tb=short --no-cov
          tests/test_connect_activation_timeout.py
          tests/test_routers/test_cloud_relay.py
      - name: Commit validated implementation
        run: |
          set -euo pipefail
          rm -f scripts/_patch_connect_activation_timeout.py .github/workflows/apply-connect-timeout-fix.yml
          git config user.name "Noah Severs"
          git config user.email "118095044+ngsevers@users.noreply.github.com"
          git add -A
          git commit -m "Keep Connect activation inside its timeout budget"
          git push origin HEAD:fix/connect-activation-timeout
