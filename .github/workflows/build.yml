name: Build Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PBS_TAG: "20260414"
  PBS_PYTHON: "3.12.13"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_cmd: pnpm run build:linux
            standalone_dir: linux-x64
            pbs_triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            build_cmd: pnpm run build:win
            standalone_dir: win-x64
            pbs_triple: x86_64-pc-windows-msvc
          - os: macos-latest
            build_cmd: pnpm run build:mac
            standalone_dir: mac-arm64
            pbs_triple: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node deps
        working-directory: electron
        run: pnpm install --frozen-lockfile

      - name: Set Electron version from git tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="$VERSION" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('electron/package.json')
          data = json.loads(path.read_text())
          data['version'] = os.environ['VERSION']
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          echo "Electron package version set to $VERSION"

      - name: Download Python standalone
        shell: bash
        run: |
          URL="https://github.com/astral-sh/python-build-standalone/releases/download/$PBS_TAG/cpython-${PBS_PYTHON}+${PBS_TAG}-${{ matrix.pbs_triple }}-install_only_stripped.tar.gz"
          echo "Downloading: $URL"
          mkdir -p "electron/python-standalone/${{ matrix.standalone_dir }}"
          curl -fsSL "$URL" | tar xz -C "electron/python-standalone/${{ matrix.standalone_dir }}"

      - name: Install Python deps into standalone
        shell: bash
        run: |
          DIR="electron/python-standalone/${{ matrix.standalone_dir }}/python"
          if [ -f "$DIR/python.exe" ]; then
            PY="$DIR/python.exe"
          else
            PY="$DIR/bin/python3"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install .

      - name: Build (macOS - with signing)
        if: matrix.os == 'macos-latest'
        working-directory: electron
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: ${{ matrix.build_cmd }}

      - name: Verify Mac app is signed (fail build if not)
        if: matrix.os == 'macos-latest'
        run: |
          APP_PATH="electron/dist/mac-arm64/Celerp.app"
          echo "Verifying signature on $APP_PATH..."
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          TEAM=$(codesign -dv "$APP_PATH" 2>&1 | grep TeamIdentifier | cut -d= -f2)
          if [ -z "$TEAM" ] || [ "$TEAM" = "not set" ]; then
            echo "ERROR: App is not signed with a Developer ID certificate."
            exit 1
          fi
          echo "Signed OK. TeamIdentifier=$TEAM"

      - name: Notarize Mac DMG
        if: matrix.os == 'macos-latest'
        timeout-minutes: 30
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG_PATH=$(ls electron/dist/*.dmg | head -1)
          echo "Submitting for notarization: $DMG_PATH"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 25m \
            --verbose
          echo "Stapling notarization ticket..."
          xcrun stapler staple "$DMG_PATH"
          echo "Notarization and stapling complete."

      - name: Build (Windows / Linux - no signing)
        if: matrix.os != 'macos-latest'
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.build_cmd }}

      - name: Normalize artifact names
        shell: bash
        run: |
          cd electron/dist
          # Static names so website download links never need updating.
          for f in *.exe; do [ -f "$f" ] && mv "$f" Celerp-Setup.exe; done
          for f in *.dmg; do [ -f "$f" ] && mv "$f" Celerp-mac.dmg; done
          for f in *.AppImage; do [ -f "$f" ] && mv "$f" Celerp.AppImage; done
          ls -la Celerp-* 2>/dev/null || echo "No matching artifacts"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            electron/dist/Celerp-Setup.exe
            electron/dist/Celerp-mac.dmg
            electron/dist/Celerp.AppImage
          if-no-files-found: warn

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/dist/Celerp-Setup.exe
            electron/dist/Celerp-mac.dmg
            electron/dist/Celerp.AppImage
          draft: false
