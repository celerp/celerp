name: Build Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PBS_TAG: "20260414"
  PBS_PYTHON: "3.12.13"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_cmd: pnpm run build:linux
            standalone_dir: linux-x64
            pbs_triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            build_cmd: pnpm run build:win
            standalone_dir: win-x64
            pbs_triple: x86_64-pc-windows-msvc
          - os: macos-latest
            build_cmd: pnpm run build:mac
            standalone_dir: mac-arm64
            pbs_triple: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node deps
        working-directory: electron
        run: pnpm install --frozen-lockfile

      - name: Import Apple Developer certificate (macOS only)
        if: matrix.os == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "temp-password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "temp-password" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "temp-password" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"
          echo "Certificate imported successfully"

      - name: Set Electron version from git tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="$VERSION" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('electron/package.json')
          data = json.loads(path.read_text())
          data['version'] = os.environ['VERSION']
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          echo "Electron package version set to $VERSION"

      - name: Download Python standalone
        shell: bash
        run: |
          URL="https://github.com/astral-sh/python-build-standalone/releases/download/$PBS_TAG/cpython-${PBS_PYTHON}+${PBS_TAG}-${{ matrix.pbs_triple }}-install_only_stripped.tar.gz"
          echo "Downloading: $URL"
          mkdir -p "electron/python-standalone/${{ matrix.standalone_dir }}"
          curl -fsSL "$URL" | tar xz -C "electron/python-standalone/${{ matrix.standalone_dir }}"

      - name: Install Python deps into standalone
        shell: bash
        run: |
          DIR="electron/python-standalone/${{ matrix.standalone_dir }}/python"
          if [ -f "$DIR/python.exe" ]; then
            PY="$DIR/python.exe"
          else
            PY="$DIR/bin/python3"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install .

      - name: Build
        working-directory: electron
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: ${{ matrix.build_cmd }}

      - name: Normalize artifact names
        shell: bash
        run: |
          cd electron/dist
          # Static names so website download links never need updating.
          for f in *.exe; do [ -f "$f" ] && mv "$f" Celerp-Setup.exe; done
          for f in *.dmg; do [ -f "$f" ] && mv "$f" Celerp-mac.dmg; done
          for f in *.AppImage; do [ -f "$f" ] && mv "$f" Celerp.AppImage; done
          ls -la Celerp-* 2>/dev/null || echo "No matching artifacts"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            electron/dist/Celerp-Setup.exe
            electron/dist/Celerp-mac.dmg
            electron/dist/Celerp.AppImage
          if-no-files-found: warn

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/dist/Celerp-Setup.exe
            electron/dist/Celerp-mac.dmg
            electron/dist/Celerp.AppImage
          draft: false
