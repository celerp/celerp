name: Build Binaries

on:
  push:
    tags: ["v*"]
    branches: ["develop", "bugfix"]
  pull_request:
    branches: ["main"]   # unsigned macOS build + boot smoke, plus Windows when it is touched (pre-tag gate)
  workflow_dispatch:
    inputs:
      platforms:
        description: "Platforms to build on this manual run"
        type: choice
        default: all
        options: [all, windows, linux, mac]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PBS_TAG: "20260414"
  PBS_PYTHON: "3.12.13"
  # Bundled pg_dump/pg_restore/psql, built from source (macOS). Pin version + SHA256
  # for every tarball. pg_dump 17.x dumps the embedded server (17) and any
  # external server <= 17.
  PG_VERSION: "17.10"
  PG_SHA256: "078a03516dcdbdb705fecaf415ea3d13a956c589e46f09fed68a06fb00598c90"
  OPENSSL_VERSION: "3.5.6"
  OPENSSL_SHA256: "deae7c80cba99c4b4f940ecadb3c3338b13cb77418409238e57d7f31f2a3b736"
  # Windows pg_dump/pg_restore/psql: extracted from the official PostgreSQL (EDB)
  # Windows binaries. The embedded server has no pg_dump, so backup needs these.
  PG_WIN_VERSION: "17.10-1"
  PG_WIN_SHA256: "f9aafca58e7026a1ef2caeee711acf761671e57904d430adc85f468374f5a821"
  # The tools and their DLL closure (resolved via objdump): libpq, OpenSSL,
  # gettext+iconv (LGPL), lz4, zstd, mingw winpthreads. Part of the cache key.
  PG_WIN_FILES: "pg_dump.exe pg_restore.exe psql.exe libpq.dll libcrypto-3-x64.dll libssl-3-x64.dll libintl-9.dll libiconv-2.dll libwinpthread-1.dll liblz4.dll libzstd.dll"

jobs:
  # ── Prepare release (tag builds only) ────────────────────────────────────
  # Runs once before all three platform builds. A tag whose release is already
  # published, on GitHub or on PyPI, is refused: a shipped version is never
  # rebuilt, the next patch version ships instead.
  prepare-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a tag that is already released
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/celerp/celerp/releases/tags/$GITHUB_REF_NAME")
          case "$STATUS" in
            404) echo "No published release for $GITHUB_REF_NAME" ;;
            200) echo "ERROR: $GITHUB_REF_NAME is already published" >&2; exit 1 ;;
            *) echo "ERROR: release lookup returned HTTP $STATUS" >&2; exit 1 ;;
          esac
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/celerp/${GITHUB_REF_NAME#v}/json")
          case "$STATUS" in
            404) echo "celerp ${GITHUB_REF_NAME#v} is not on PyPI" ;;
            200) echo "ERROR: celerp ${GITHUB_REF_NAME#v} is already on PyPI" >&2; exit 1 ;;
            *) echo "ERROR: PyPI lookup returned HTTP $STATUS" >&2; exit 1 ;;
          esac

  # Compute the build matrix: the bugfix branch and pull requests build macOS only.
  # Bugfix pushes use the normal signed-dev path; pull requests remain unsigned
  # because signing credentials must not be exposed to PR workflows. A pull request
  # that changes how the Windows app is packaged or started also builds Windows,
  # with its DLL check and both boot smokes.
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2  # the merge commit and the base it merges into
      - id: changed
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          { echo "files<<CHANGED_EOF"; git diff --name-only HEAD^1 HEAD; echo "CHANGED_EOF"; } >> "$GITHUB_OUTPUT"
      - id: gen
        shell: bash
        env:
          PLATFORMS: ${{ github.event.inputs.platforms }}
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          mac='{"os":"macos-latest","build_cmd":"pnpm run build:mac","platform_flag":"--mac","standalone_dir":"mac-arm64","pbs_triple":"aarch64-apple-darwin"}'
          win='{"os":"windows-latest","build_cmd":"pnpm run build:win","platform_flag":"--win","standalone_dir":"win-x64","pbs_triple":"x86_64-pc-windows-msvc"}'
          lin='{"os":"ubuntu-latest","build_cmd":"pnpm run build:linux","platform_flag":"--linux","standalone_dir":"linux-x64","pbs_triple":"x86_64-unknown-linux-gnu"}'
          sel="$PLATFORMS"
          if [ -n "$sel" ] && [ "$sel" != "all" ]; then
            case "$sel" in
              windows) inc="$win" ;;
              linux)   inc="$lin" ;;
              mac)     inc="$mac" ;;
              *)       inc="$lin,$win,$mac" ;;
            esac
            echo "matrix={\"include\":[$inc]}" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ] \
            && printf '%s\n' "$CHANGED_FILES" | grep -qE '^(electron/|celerp/win_restricted_launch\.py$|\.github/workflows/build\.yml$|scripts/(download-python\.sh|check_packaged_modules\.py)$)'; then
            echo "matrix={\"include\":[$win,$mac]}" >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF_NAME" = "bugfix" ] || [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "matrix={\"include\":[$mac]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$lin,$win,$mac]}" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [prepare-release, setup-matrix]
    # prepare-release is skipped on non-tag builds; treat skipped as success.
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped') && needs.setup-matrix.result == 'success'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history + tags so setuptools-scm can derive the version

      # Pin the package version from the tag so setuptools-scm stamps the clean tag
      # even though later steps modify tracked files (e.g. electron/package.json),
      # which would otherwise leave the tree dirty and produce a .devN+g<sha> version.
      - name: Pin package version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CELERP=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Install Node deps
        working-directory: electron
        run: pnpm install --frozen-lockfile

      # A release tag must be vX.Y.Z: the Windows installer compares dotted numbers
      # only, so a suffixed release would look identical to the plain one.
      - name: Set Electron version from git tag or development commit
        shell: bash
        run: python3 scripts/electron_version.py

      # Download + SHA256-verify (against the release's SHA256SUMS) before extract.
      - name: Download Python standalone (arm64)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -eo pipefail
          F="cpython-${PBS_PYTHON}+${PBS_TAG}-aarch64-apple-darwin-install_only_stripped.tar.gz"
          BASE="https://github.com/astral-sh/python-build-standalone/releases/download/$PBS_TAG"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 15 -o "$F" "$BASE/$F"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 15 -o SHA256SUMS "$BASE/SHA256SUMS"
          grep " $F\$" SHA256SUMS | { command -v sha256sum >/dev/null && sha256sum -c - || shasum -a 256 -c -; }
          mkdir -p "electron/python-standalone/mac-arm64"
          tar xz -f "$F" -C "electron/python-standalone/mac-arm64"
          rm -f "$F"

      - name: Download Python standalone (x64)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -eo pipefail
          F="cpython-${PBS_PYTHON}+${PBS_TAG}-x86_64-apple-darwin-install_only_stripped.tar.gz"
          BASE="https://github.com/astral-sh/python-build-standalone/releases/download/$PBS_TAG"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 15 -o "$F" "$BASE/$F"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 15 -o SHA256SUMS "$BASE/SHA256SUMS"
          grep " $F\$" SHA256SUMS | { command -v sha256sum >/dev/null && sha256sum -c - || shasum -a 256 -c -; }
          mkdir -p "electron/python-standalone/mac-x64"
          tar xz -f "$F" -C "electron/python-standalone/mac-x64"
          rm -f "$F"

      - name: Download Python standalone
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          set -eo pipefail
          F="cpython-${PBS_PYTHON}+${PBS_TAG}-${{ matrix.pbs_triple }}-install_only_stripped.tar.gz"
          BASE="https://github.com/astral-sh/python-build-standalone/releases/download/$PBS_TAG"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 15 -o "$F" "$BASE/$F"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 15 -o SHA256SUMS "$BASE/SHA256SUMS"
          grep " $F\$" SHA256SUMS | { command -v sha256sum >/dev/null && sha256sum -c - || shasum -a 256 -c -; }
          mkdir -p "electron/python-standalone/${{ matrix.standalone_dir }}"
          tar xz -f "$F" -C "electron/python-standalone/${{ matrix.standalone_dir }}"
          rm -f "$F"

      - name: Install Python deps into standalone (arm64)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          PY="electron/python-standalone/mac-arm64/python/bin/python3"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install . -c constraints.txt

      - name: Install Python deps into standalone (x64)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          # x64 Python runs via Rosetta on arm64 runner - safe for pure-Python
          # and wheels with pre-built binaries (numpy, pillow, psycopg2-binary, etc.)
          # numba/llvmlite removed from deps to avoid source build requirement
          PY="electron/python-standalone/mac-x64/python/bin/python3"
          "$PY" -m pip install --upgrade pip --prefer-binary
          "$PY" -m pip install . --prefer-binary -c constraints.txt

      - name: Install Python deps into standalone
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          DIR="electron/python-standalone/${{ matrix.standalone_dir }}/python"
          if [ -f "$DIR/python.exe" ]; then
            PY="$DIR/python.exe"
          else
            PY="$DIR/bin/python3"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install . -c constraints.txt
          # The Windows app runs the PostgreSQL server bundled with Electron
          # (@embedded-postgres/windows-x64) and the pg-win backup tools, so the
          # celerp-postgres wheel that `pip install celerp` users get is left out.
          # celerp's metadata still lists it; `pip check` would report it missing.
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            "$PY" -m pip uninstall -y celerp-postgres
          fi

      # ── Bundled pg_dump/pg_restore/psql (macOS) ──────────────────────────────
      # Built from source for both arches in this one arm64 job (x86_64 slice
      # cross-compiled with Rosetta). Cached on version + script hash so normal
      # builds skip the multi-minute compile.
      - name: Cache pg-tools (macOS)
        if: matrix.os == 'macos-latest'
        id: pg-tools-cache
        uses: actions/cache@v6
        with:
          path: electron/pg-tools
          key: pg-tools-${{ runner.os }}-pg${{ env.PG_VERSION }}-ossl${{ env.OPENSSL_VERSION }}-${{ hashFiles('electron/scripts/build-pg-tools.sh') }}

      - name: Build bundled pg_dump/pg_restore/psql (macOS, both arches)
        if: matrix.os == 'macos-latest' && steps.pg-tools-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bash electron/scripts/build-pg-tools.sh arm64  "$PWD/electron/pg-tools/mac-arm64"
          bash electron/scripts/build-pg-tools.sh x86_64 "$PWD/electron/pg-tools/mac-x64"

      # ── Bundled pg_dump/pg_restore/psql (Windows) ────────────────────────────
      # The @embedded-postgres Windows package ships no pg_dump, so extract it +
      # its transitive DLL closure from the official PostgreSQL (EDB) binaries.
      - name: Cache pg-tools (Windows)
        if: matrix.os == 'windows-latest'
        id: pg-tools-win-cache
        uses: actions/cache@v6
        with:
          path: electron/pg-tools/win
          key: pg-tools-win-${{ env.PG_WIN_VERSION }}-${{ env.PG_WIN_SHA256 }}-${{ env.PG_WIN_FILES }}

      - name: Fetch bundled pg_dump/pg_restore/psql (Windows)
        if: matrix.os == 'windows-latest' && steps.pg-tools-win-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -eo pipefail
          URL="https://get.enterprisedb.com/postgresql/postgresql-${PG_WIN_VERSION}-windows-x64-binaries.zip"
          curl -fsSL --retry 10 --retry-all-errors --retry-delay 15 -o pg-win.zip "$URL"
          echo "${PG_WIN_SHA256} *pg-win.zip" | sha256sum -c -
          DEST="electron/pg-tools/win/bin"
          mkdir -p "$DEST"
          7z e pg-win.zip -o"$DEST" -y $(printf 'pgsql/bin/%s ' $PG_WIN_FILES) >/dev/null
          rm -f pg-win.zip
          ls "$DEST"
          for t in pg_dump pg_restore psql; do
            PATH="/c/Windows/System32" "$DEST/$t.exe" --version   # runs with the bundled DLLs only
          done

      # ── Bundled pg_dump/pg_restore/psql (Linux) ──────────────────────────────
      # No portable prebuilt exists (theseus-rs needs system OpenSSL-3; musl needs
      # the musl loader), so build from source in a manylinux_2_28 container
      # (glibc 2.28) for portability matching the rest of the AppImage.
      - name: Cache pg-tools (Linux)
        if: matrix.os == 'ubuntu-latest'
        id: pg-tools-linux-cache
        uses: actions/cache@v6
        with:
          path: electron/pg-tools/linux
          key: pg-tools-linux-${{ env.PG_VERSION }}-ossl${{ env.OPENSSL_VERSION }}-${{ hashFiles('electron/scripts/build-pg-tools-linux.sh') }}

      - name: Build bundled pg_dump/pg_restore/psql (Linux, manylinux)
        if: matrix.os == 'ubuntu-latest' && steps.pg-tools-linux-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          docker run --rm -v "$PWD:/io" -w /io \
            -e PG_VERSION -e PG_SHA256 -e OPENSSL_VERSION -e OPENSSL_SHA256 \
            quay.io/pypa/manylinux_2_28_x86_64 \
            bash electron/scripts/build-pg-tools-linux.sh /io/electron/pg-tools/linux
          # The container runs as root, so the output is root-owned; chown it back
          # to the runner user, else electron-builder's hardlink copy hits EPERM
          # (protected_hardlinks blocks linking to files the user doesn't own).
          sudo chown -R "$(id -u):$(id -g)" electron/pg-tools/linux

      # Note: the StackBuilder GUI DLLs (wxWidgets + libcurl) the Windows
      # embedded-postgres package vendors are pruned in electron/after-pack.js
      # (reliable on the real packaged tree) and verified by the post-build step.

      - name: Collect + verify third-party licenses
        shell: bash
        run: |
          set -eo pipefail
          OS="${{ matrix.os }}"
          PBS_BASE="electron/python-standalone"
          PYVER="python3.$(echo "$PBS_PYTHON" | cut -d. -f2)"
          ARGS=()
          add_tree() {                       # $1 = standalone dir (e.g. mac-arm64)
            ARGS+=(--pbs-root "$PBS_BASE/$1")
            if [ "$OS" = "windows-latest" ]; then
              ARGS+=(--site-packages "$PBS_BASE/$1/python/Lib/site-packages")
            else
              ARGS+=(--site-packages "$PBS_BASE/$1/python/lib/$PYVER/site-packages")
            fi
          }
          # The embedded PostgreSQL server is bundled on every platform (the
          # @embedded-postgres/<platform> package installs via the wrapper's
          # optional deps), so each passes its own curated native-lib license set.
          EP="electron/licenses-extra"
          # Bundled Python interpreter's native-lib licenses (stripped from the
          # install_only archive); same set on every platform.
          ARGS+=(--extra-python "$EP/python-standalone")
          # psycopg2-binary vendors libpq + native deps without their licenses.
          ARGS+=(--extra-psycopg2 "$EP/psycopg2")
          if [ "$OS" = "macos-latest" ]; then
            add_tree mac-arm64               # universal app bundles BOTH Python trees,
            add_tree mac-x64                 # so collect/check both (audit-quality)
            # PG/OpenSSL license texts are arch-independent; one tree suffices.
            ARGS+=(--pg-licenses electron/pg-tools/mac-arm64/licenses)
            ARGS+=(--extra-embedded-postgres "$EP/embedded-postgres-darwin")
            PY="$PBS_BASE/mac-arm64/python/bin/python3"
          elif [ "$OS" = "windows-latest" ]; then
            add_tree "${{ matrix.standalone_dir }}"
            ARGS+=(--extra-embedded-postgres "$EP/embedded-postgres-win")
            PY="$PBS_BASE/${{ matrix.standalone_dir }}/python/python.exe"
          else
            add_tree "${{ matrix.standalone_dir }}"
            ARGS+=(--pg-licenses electron/pg-tools/linux/licenses)   # built-from-source pg_dump
            ARGS+=(--extra-embedded-postgres "$EP/embedded-postgres-linux")
            PY="$PBS_BASE/${{ matrix.standalone_dir }}/python/bin/python3"
          fi
          "$PY" electron/scripts/collect_licenses.py --out licenses \
            --node-modules electron/node_modules "${ARGS[@]}"
          "$PY" electron/scripts/collect_licenses.py --check --out licenses \
            --node-modules electron/node_modules "${ARGS[@]}"

      # Own the signing keychain ourselves instead of letting electron-builder
      # create a throwaway one. The keychain password and the .p12 password are
      # two different secrets; the newer hosted macOS image rejects the combined
      # shortcut electron-builder was using, so signing failed at unlock time.
      # Runs for every signed build (release tags and non-PR development builds).
      # Pull requests remain unsigned because signing secrets are unavailable there.
      - name: Prepare macOS signing keychain
        if: matrix.os == 'macos-latest' && github.event_name != 'pull_request'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/celerp-signing.keychain-db"
          CERT_PATH="$RUNNER_TEMP/celerp-signing-cert.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          echo -n "$APPLE_CERTIFICATE" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import with the .p12 password, then authorize the Apple codesigning
          # tools to use the private key without an interactive prompt.
          security import "$CERT_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          echo "CSC_KEYCHAIN=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
          rm -f "$CERT_PATH"

      - name: Verify macOS signing identity
        if: matrix.os == 'macos-latest' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          # Fail in seconds if the certificate did not import, not after a build.
          security find-identity -v -p codesigning "$CSC_KEYCHAIN"
          security find-identity -v -p codesigning "$CSC_KEYCHAIN" \
            | grep -q "Developer ID Application"

      - name: Build macOS (production - signed + notarized)
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 130
        working-directory: electron
        env:
          CSC_KEYCHAIN: ${{ env.CSC_KEYCHAIN }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run build:mac -- --publish always

      - name: Build macOS (development - signed only, no notarization)
        if: matrix.os == 'macos-latest' && !startsWith(github.ref, 'refs/tags/v') && github.event_name != 'pull_request'
        timeout-minutes: 60
        working-directory: electron
        env:
          CSC_KEYCHAIN: ${{ env.CSC_KEYCHAIN }}
        run: pnpm exec electron-builder ${{ matrix.platform_flag }} --publish never

      # Merging the two slices into a universal app is most of the mac build time.
      # Application code is copied into both slices as identical text files, so
      # it cannot break the merge; only packaging inputs or a binary file can. A
      # pull request that changes only text under the application paths builds
      # the arm64 slice, the one the boot smoke launches. Any other path, any
      # binary file, or a diff that cannot be read keeps the universal build.
      - name: Choose the pull request mac targets
        id: mac-targets
        if: matrix.os == 'macos-latest' && github.event_name == 'pull_request'
        shell: bash
        run: |
          targets=""
          if stat="$(git diff --no-renames --numstat "${{ github.event.pull_request.base.sha }}" HEAD)" && [ -n "$stat" ] \
            && ! cut -f3- <<<"$stat" | grep -qvE '^(celerp|ui|default_modules|tests|docs)/' \
            && ! grep -q $'^-\t-\t' <<<"$stat"; then
            targets="dmg:arm64 zip:arm64"
          fi
          echo "targets=$targets" >> "$GITHUB_OUTPUT"
          echo "mac targets: ${targets:-universal}"

      - name: Build macOS (pull request - UNSIGNED)
        # Pull-request builds do not receive signing credentials. They still build
        # the final distributable and pass the DMG integrity/mount gate below.
        if: matrix.os == 'macos-latest' && github.event_name == 'pull_request'
        timeout-minutes: 60
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder ${{ matrix.platform_flag }} ${{ steps.mac-targets.outputs.targets }} --publish never

      - name: Verify macOS distributable
        if: matrix.os == 'macos-latest'
        shell: bash
        env:
          REQUIRE_SIGNATURE: ${{ github.event_name != 'pull_request' }}
        run: |
          set -euo pipefail
          DMG="$PWD/electron/dist/Celerp-mac.dmg"
          MOUNT_POINT="$RUNNER_TEMP/celerp-dmg"

          test -f "$DMG"
          hdiutil verify "$DMG"

          if [ "$REQUIRE_SIGNATURE" = "true" ]; then
            APP="$(ls -d "$PWD"/electron/dist/mac*/Celerp.app | head -1)"
            test -d "$APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
          fi

          rm -rf "$MOUNT_POINT"
          mkdir -p "$MOUNT_POINT"
          hdiutil attach -readonly -nobrowse -mountpoint "$MOUNT_POINT" "$DMG"
          cleanup() { hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          test -d "$MOUNT_POINT/Celerp.app"
          if [ "$REQUIRE_SIGNATURE" = "true" ]; then
            codesign --verify --deep --strict --verbose=2 "$MOUNT_POINT/Celerp.app"
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # electron-builder 25 silently skips notarization when credentials are
            # absent. A release must prove that Apple's ticket was actually stapled
            # to the exact app contained in the final DMG before it can publish.
            xcrun stapler validate "$MOUNT_POINT/Celerp.app"
          fi

          hdiutil detach "$MOUNT_POINT"
          trap - EXIT
          echo "macOS distributable verified: checksum, mount, contents, signing, and release notarization policy OK"

      - name: Clean up macOS signing keychain
        if: always() && matrix.os == 'macos-latest'
        shell: bash
        run: |
          if [ -n "${CSC_KEYCHAIN:-}" ] && [ -f "$CSC_KEYCHAIN" ]; then
            security delete-keychain "$CSC_KEYCHAIN" || true
          fi

      # The bundled PostgreSQL binaries link the Visual C++ runtime, which a clean
      # Windows PC does not have. Stage the two DLLs from the runner's Visual Studio
      # install; afterPack copies them next to the binaries and stops the build
      # without them.
      - name: Stage the Visual C++ runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          if (-not $vs) { Write-Host "::error::vswhere found no Visual Studio install"; exit 1 }
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+)+$' -and (Test-Path "$($_.FullName)\x64\Microsoft.VC143.CRT") } |
            Sort-Object { [version]$_.Name } -Descending | Select-Object -First 1
          if (-not $crt) { Write-Host "::error::no x64 Microsoft.VC143.CRT folder under $vs\VC\Redist\MSVC"; exit 1 }
          $src = "$($crt.FullName)\x64\Microsoft.VC143.CRT"
          $dest = Join-Path $env:RUNNER_TEMP "vc-runtime"
          New-Item -ItemType Directory -Force $dest | Out-Null
          foreach ($dll in "vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll") { Copy-Item (Join-Path $src $dll) $dest }
          Write-Host "staged the Visual C++ runtime from $src"
          "CELERP_VC_RUNTIME_DIR=$dest" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build (Windows / Linux - release tag)
        if: matrix.os != 'macos-latest' && startsWith(github.ref, 'refs/tags/v')
        working-directory: electron
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Retry: electron-builder downloads its toolchain (NSIS, winCodeSign,
        # AppImage tools) from electron-builder-binaries on GitHub, which 504s
        # intermittently. Already-downloaded tools are cached between attempts.
        run: |
          set +e
          for attempt in 1 2 3; do
            ${{ matrix.build_cmd }} -- --publish always && exit 0
            echo "::warning::electron-builder attempt $attempt failed (often a transient toolchain download); retrying in 15s"
            sleep 15
          done
          echo "electron-builder failed after 3 attempts" >&2; exit 1

      - name: Build (Windows / Linux - dev build)
        if: matrix.os != 'macos-latest' && !startsWith(github.ref, 'refs/tags/v')
        working-directory: electron
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        # Retry transient electron-builder toolchain downloads (see release step).
        run: |
          set +e
          for attempt in 1 2 3; do
            pnpm exec electron-builder ${{ matrix.platform_flag }} --publish never && exit 0
            echo "::warning::electron-builder attempt $attempt failed (often a transient toolchain download); retrying in 15s"
            sleep 15
          done
          echo "electron-builder failed after 3 attempts" >&2; exit 1

      # Prove the licenses/ folder and the PostgreSQL tools actually made it into
      # the packaged artifact: the pre-build checks only prove they existed before
      # electron-builder ran, not that extraResources put them in the resources.
      - name: Verify licenses and PostgreSQL tools in the packaged artifact
        shell: bash
        run: |
          set -eo pipefail
          OS="${{ matrix.os }}"
          case "$OS" in
            macos-latest)
              RES="$(ls -d electron/dist/mac*/Celerp.app/Contents/Resources 2>/dev/null | head -1)" ;;
            windows-latest)
              RES="electron/dist/win-unpacked/resources" ;;
            *)
              RES="electron/dist/linux-unpacked/resources" ;;
          esac
          echo "Inspecting: $RES/licenses"
          test -n "$RES" && test -d "$RES/licenses"
          test -f "$RES/licenses/THIRD-PARTY-NOTICES.txt"
          test -d "$RES/licenses/python"
          test -f "$RES/licenses/python/LICENSE.openssl-3.txt"   # bundled-lib set landed
          test -f "$RES/licenses/psycopg2/LGPL-3.0.txt"          # psycopg2 vendored-lib set landed
          test -d "$RES/licenses/electron"
          test -d "$RES/licenses/chromium"
          # embedded PostgreSQL server is bundled on every platform -> its
          # curated native-lib attribution must be present.
          test -d "$RES/licenses/embedded-postgres"
          test -f "$RES/licenses/embedded-postgres/zlib-LICENSE.txt"
          if [ "$OS" = "macos-latest" ] || [ "$OS" = "ubuntu-latest" ]; then
            test -d "$RES/licenses/postgresql"   # from the built-from-source pg_dump tools
            test -d "$RES/licenses/openssl"
          fi
          # Backup and restore run these tools from the package: each must be
          # executable, built for its architecture, and start with only the
          # libraries the package ships plus the system's.
          TOOLS="pg_dump pg_restore psql"
          case "$OS" in
            macos-latest)
              for tree in "pg-arm64 arm64" "pg-x64 x86_64"; do
                set -- $tree
                for t in $TOOLS; do
                  f="$RES/$1/bin/$t"
                  test -x "$f"
                  test "$(lipo -archs "$f")" = "$2"
                  otool -L "$f" | tail -n +2 | awk '{print $1}' | while read -r dep; do
                    case "$dep" in
                      /usr/lib/*|/System/Library/*) ;;
                      @rpath/*) test -f "$RES/$1/lib/${dep#@rpath/}" ;;
                      *) echo "ERROR: $f needs $dep" >&2; exit 1 ;;
                    esac
                  done
                  env -u DYLD_LIBRARY_PATH arch "-$2" "$f" --version
                done
              done ;;
            windows-latest)
              for t in $TOOLS; do
                f="$RES/pg-win/bin/$t.exe"
                test -x "$f"
                pe="$(od -An -t u4 -j 60 -N 4 "$f" | tr -d ' ')"
                test "$(od -An -t x2 -j $((pe + 4)) -N 2 "$f" | tr -d ' ')" = "8664"
                # The loader finds DLLs beside the exe or in System32, nowhere else.
                PATH="/c/Windows/System32" "$f" --version
              done ;;
            *)
              for t in $TOOLS; do
                f="$RES/pg-linux/bin/$t"
                test -x "$f"
                case "$(file -b "$f")" in "ELF 64-bit LSB"*x86-64*) ;; *) exit 1 ;; esac
                if env -u LD_LIBRARY_PATH ldd "$f" | grep "not found"; then exit 1; fi
                env -u LD_LIBRARY_PATH "$f" --version
              done ;;
          esac
          echo "OK: third-party licenses and PostgreSQL tools present in packaged artifact"

      # The Windows package leaves out the macOS PostgreSQL builds, the
      # celerp-postgres wheel and everything electron/win-prune.json lists
      # (the StackBuilder DLLs among them), keeps what the app runs on, and
      # still carries a licence for every Python package that ships.
      - name: Check the Windows bundle
        if: runner.os == 'Windows'
        shell: bash
        # The smokes compare each install with win-unpacked file by file.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -eo pipefail
          RES="electron/dist/win-unpacked/resources"
          PY="$RES/python-x64/python/python.exe"
          "$PY" electron/scripts/check_win_bundle.py check electron/dist/win-unpacked
          "$PY" electron/scripts/collect_licenses.py --check --out "$RES/licenses" \
            --site-packages "$RES/python-x64/python/Lib/site-packages" \
            --extra-python electron/licenses-extra/python-standalone \
            --extra-psycopg2 electron/licenses-extra/psycopg2

      # Every DLL a bundled Windows binary imports must ship beside it or be part
      # of Windows itself; anything else fails on a clean PC with 0xC0000135.
      - name: Check the Windows DLL closure
        if: runner.os == 'Windows'
        shell: bash
        run: |
          RES="electron/dist/win-unpacked/resources"
          node electron/scripts/check-win-dll-closure.js \
            "$RES/app.asar.unpacked/node_modules/@embedded-postgres/windows-x64/native/bin" \
            "$RES/pg-win/bin"

      # The packaged default modules must be exactly the ones the lock names, with
      # the same content. The packaged Python runs the packaged loader's check.
      - name: Check bundled modules in the packaged artifact
        shell: bash
        # The smokes compare each install with win-unpacked file by file.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -eo pipefail
          case "${{ matrix.os }}" in
            macos-latest)
              RES="$(ls -d electron/dist/mac*/Celerp.app/Contents/Resources | head -1)"
              PY="$RES/python-arm64/python/bin/python3" ;;
            windows-latest)
              RES="electron/dist/win-unpacked/resources"
              PY="$RES/python-x64/python/python.exe" ;;
            *)
              RES="electron/dist/linux-unpacked/resources"
              PY="$RES/python-x64/python/bin/python3" ;;
          esac
          PYTHONPATH="$RES/app" "$PY" scripts/check_packaged_modules.py \
            "$RES/app/default_modules" --lock default_modules/first_party.lock.json

      # Boot smoke: actually LAUNCH the packaged app and require a real, DB-backed
      # boot before this build can ship. /health/ready does a live SELECT 1, so a
      # 200 {"db":"ok"} proves electron -> Python API -> embedded Postgres -> a query.
      # Every module in the lock is enabled, and a bundled module that is missing
      # or fails to load stops startup, so readiness also proves they all load.
      # We poll (never sleep) and fail fast if the process dies (crash on launch).
      - name: Boot smoke (launch the packaged app, require db:ok)
        timeout-minutes: 15
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -uo pipefail
          cd electron
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
            # Install the actual .deb so ITS postinst runs and sets chrome-sandbox's
            # mode, then boot the installed /opt/Celerp/celerp below. Booting
            # dist/linux-unpacked with a hand-applied chmod (what we used to do) never
            # exercised the postinst, so it could not catch the postinst leaving
            # chrome-sandbox at 0755 on Ubuntu 24.04 - where the namespace sandbox is
            # blocked and the SUID helper must be 4755, or the app aborts on launch.
            # Installing for real means that misconfiguration fails the build here
            # instead of shipping.
            sudo apt-get install -y -qq "$PWD/dist/Celerp.deb"
          fi
          case "$RUNNER_OS" in
            macOS)   APP_BIN="$(ls -d dist/mac*/Celerp.app | head -1)/Contents/MacOS/Celerp" ;;
            Linux)   APP_BIN="/opt/Celerp/celerp" ;;
          esac
          echo "smoke: launching $APP_BIN"
          API_PORT=$(python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1]);s.close()')
          export CELERP_API_PORT="$API_PORT"
          export HOME="$RUNNER_TEMP/smoke-home"; mkdir -p "$HOME"   # hermetic, throwaway data dir
          ENABLED_MODULES="$(python3 -c 'import json; print(",".join(sorted(json.load(open("../default_modules/first_party.lock.json")))))')"
          export ENABLED_MODULES; echo "smoke: enabling $ENABLED_MODULES"
          LOG="$RUNNER_TEMP/smoke.log"
          LAUNCH=("$APP_BIN")
          [ "$RUNNER_OS" = "Linux" ] && LAUNCH=(xvfb-run -a "$APP_BIN")
          "${LAUNCH[@]}" >"$LOG" 2>&1 &
          APP_PID=$!
          DEADLINE=$(( $(date +%s) + 120 ))     # generous cap; we poll, never sleep-then-check
          ok=""
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            kill -0 "$APP_PID" 2>/dev/null || { echo "::error::app exited before becoming ready (crash on launch)"; break; }
            if curl -fs --max-time 5 "http://127.0.0.1:$API_PORT/health/ready" 2>/dev/null | grep -q '"db"[[:space:]]*:[[:space:]]*"ok"'; then
              ok=1; break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            echo "::error::boot smoke FAILED on $RUNNER_OS - /health/ready never returned db:ok"
            echo "----- app log (tail) -----"; tail -n 200 "$LOG" || true
            # The app keeps its data under the user's real home, which macOS reads without $HOME.
            find "$(python3 -c 'import os,pwd; print(pwd.getpwuid(os.getuid()).pw_dir)')" -maxdepth 6 -path '*celerp-data/logs/*' -type f -exec tail -n 100 {} + || true
            kill -9 "$APP_PID" 2>/dev/null || true
            exit 1
          fi
          echo "boot smoke OK on $RUNNER_OS"
          # A force-quit app must not leave its servers running: kill the app itself
          # (SIGKILL, no shutdown code runs) and require the API and the database to stop,
          # the database cleanly (it removes postmaster.pid on a clean stop).
          API=$(lsof -tiTCP:"$API_PORT" -sTCP:LISTEN | head -1)
          ELECTRON=$(ps -o ppid= -p "$API" | tr -d ' ')
          PG_DATA=$(ps axww -o command= | sed -n 's|.*/postgres -D \(.*/celerp-data/postgres\) -p .*|\1|p' | head -1)
          PG_PIDFILE="$PG_DATA/postmaster.pid"
          PG=$(head -1 "$PG_PIDFILE")
          echo "force-quit: app $ELECTRON, API $API, database $PG ($PG_PIDFILE)"
          [ -n "$API" ] && [ -n "$ELECTRON" ] && [ -n "$PG" ] || { echo "::error::force-quit: could not find the app's processes"; exit 1; }
          kill -9 "$ELECTRON"
          DEADLINE=$(( $(date +%s) + 30 ))
          while { kill -0 "$API" || kill -0 "$PG" || [ -e "$PG_PIDFILE" ]; } 2>/dev/null && [ "$(date +%s)" -lt "$DEADLINE" ]; do sleep 1; done
          kill "$APP_PID" 2>/dev/null || true; wait "$APP_PID" 2>/dev/null || true
          if { kill -0 "$API" || kill -0 "$PG" || [ -e "$PG_PIDFILE" ]; } 2>/dev/null; then
            echo "::error::force-quit on $RUNNER_OS left the API or the database running"
            ps -o pid,ppid,command -p "$API,$PG" || true
            exit 1
          fi
          echo "force-quit OK on $RUNNER_OS: the API and the database stopped"

      # Boot the installed app the way most Windows users run it: from a standard
      # (non-admin) account. A SAFER/runas restricted token would crash Electron; a
      # real standard account gives a clean medium token where both Electron and
      # Postgres run. With the app open, the installer runs again, as a user does
      # with the app still running: it must close the app, install and boot again.
      # The account's name, and so its profile, data and install folders, has spaces
      # and non-ASCII letters.
      - name: Boot smoke (Windows, require db:ok)
        timeout-minutes: 20
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: electron
        run: ./scripts/win-boot-smoke.ps1 -Account standard -UserName "Célerp Tëst ü" -OverRunning

      # The latest release, installed and opened by an account whose name has a space.
      # It keeps records; this build then installs over it and must serve the same
      # records. (Releases up to 2.5.6 cannot set up their database under a non-ASCII
      # account name, so the upgrade runs under an ASCII one.)
      - name: Boot smoke (Windows, upgrade from the latest release)
        timeout-minutes: 25
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: electron
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $previous = Join-Path $env:RUNNER_TEMP "previous"
          $tag = gh release view --repo $env:GITHUB_REPOSITORY --json tagName --jq .tagName
          if ($LASTEXITCODE -ne 0 -or -not $tag) { Write-Host "::error::no latest release to upgrade from"; exit 1 }
          gh release download $tag --repo $env:GITHUB_REPOSITORY --pattern Celerp-Setup.exe --dir $previous
          if ($LASTEXITCODE -ne 0) { Write-Host "::error::could not download Celerp-Setup.exe from $tag"; exit 1 }
          Write-Host "upgrading from $tag"
          ./scripts/win-boot-smoke.ps1 -Account standard -UserName "Celerp Upgrade" -Previous (Join-Path $previous "Celerp-Setup.exe")

      # Accounts named in Thai and in Chinese, on a PC that makes no short (8.3) names:
      # Postgres cannot read their profile paths, and there is no short form to fall
      # back on. The database must be set up in the account's private folder.
      - name: Boot smoke (Windows, Thai account name, no short names)
        timeout-minutes: 20
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: electron
        run: ./scripts/win-boot-smoke.ps1 -Account standard -UserName "ทดสอบ เซเลิร์ป" -NoShortNames

      - name: Boot smoke (Windows, Chinese account name, no short names)
        timeout-minutes: 20
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: electron
        run: ./scripts/win-boot-smoke.ps1 -Account standard -UserName "测试 用户" -NoShortNames

      # The installer reads the installed version from the uninstall entry. Over an
      # existing install: none -> installs; the same version run silently ->
      # reinstalls; installed newer -> stops with exit 2 and changes nothing (the
      # installed exe, a file in the install folder and the uninstall entry are
      # compared byte for byte); installed older -> updates; the in-app updater
      # (--updated) -> is never stopped or prompted.
      # Before any of that: a disk without room for the app must stop the installer
      # with a non-zero exit and register nothing; an installer stopped part way
      # registers nothing, and the next run installs the complete app over what it
      # left (the stopped run's temporary files are reported). The first full install
      # is timed into the job summary, reported and never compared against a limit.
      - name: Installer version check (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Resolve-Path "electron/dist/Celerp-Setup.exe").Path
          function Install([string[]]$installerArgs) {
            $p = Start-Process -FilePath $setup -ArgumentList $installerArgs -Wait -PassThru
            return $p.ExitCode
          }
          # The runner's account has no per-user uninstall key until something installs.
          function Entry {
            $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall"
            if (-not (Test-Path $key)) { return }
            Get-ChildItem $key |
              Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like "Celerp*" } |
              Select-Object -First 1
          }
          function Installed { (Get-ItemProperty (Entry).PSPath).DisplayVersion }
          function InstallDir {
            $u = (Get-ItemProperty (Entry).PSPath).UninstallString
            if ($u -notmatch '^"([^"]+)"') { throw "unexpected UninstallString: $u" }
            Split-Path $Matches[1]
          }
          function Fail([string]$why) { Write-Host "::error::$why"; exit 1 }
          # Everything a refused run must leave alone.
          function State {
            $dir = InstallDir
            [ordered]@{
              exe      = (Get-FileHash (Join-Path $dir "Celerp.exe") -Algorithm SHA256).Hash
              sentinel = (Get-FileHash (Join-Path $dir "celerp-ci-sentinel.txt") -Algorithm SHA256).Hash
              entry    = (Get-ItemProperty (Entry).PSPath | Select-Object * -ExcludeProperty PS* | ConvertTo-Json -Compress)
            } | ConvertTo-Json -Compress
          }

          # A full disk: a 300 MB volume cannot hold the app.
          $letter = [char[]](70..90) | Where-Object { -not (Test-Path "${_}:\") } | Select-Object -Last 1
          $vhd = Join-Path $env:RUNNER_TEMP "lowdisk.vhdx"
          $dp = Join-Path $env:RUNNER_TEMP "lowdisk.txt"
          Set-Content -Encoding Ascii $dp "create vdisk file=`"$vhd`" maximum=300 type=expandable`r`nselect vdisk file=`"$vhd`"`r`nattach vdisk`r`ncreate partition primary`r`nformat fs=ntfs quick label=lowdisk`r`nassign letter=$letter"
          diskpart /s $dp | Out-Null
          if (-not (Test-Path "${letter}:\")) { Fail "could not attach the low-disk volume" }
          $p = Start-Process -FilePath $setup -ArgumentList "/S /currentuser /D=${letter}:\Celerp" -PassThru
          if (-not $p.WaitForExit(600000)) { Stop-Process -Id $p.Id -Force; Fail "installer on a full disk was still running after 600 s" }
          if ($p.ExitCode -eq 0) { Fail "installer on a full disk exited 0" }
          if (Entry) { Fail "installer on a full disk registered an install" }
          Write-Host "full disk: stopped with exit $($p.ExitCode), nothing registered"
          Set-Content -Encoding Ascii $dp "select vdisk file=`"$vhd`"`r`ndetach vdisk"
          diskpart /s $dp | Out-Null

          # Stopped part way: the installer is ended once it has copied part of the app.
          $target = Join-Path $env:LOCALAPPDATA "Programs\celerp"
          $tempBefore = @(Get-ChildItem $env:TEMP -Directory -Filter "ns*.tmp" -EA SilentlyContinue | ForEach-Object Name)
          $p = Start-Process -FilePath $setup -ArgumentList "/S /currentuser" -PassThru
          $copied = 0
          while (-not $p.HasExited) {
            $copied = @(Get-ChildItem $target -Recurse -File -EA SilentlyContinue).Count
            if ($copied -ge 1000) { Stop-Process -Id $p.Id -Force; $p.WaitForExit(); break }
            Start-Sleep -Milliseconds 200
          }
          if ($copied -lt 1000) { Fail "the installer finished (exit $($p.ExitCode)) before it could be stopped part way" }
          if (Entry) { Fail "an installer stopped part way registered an install" }
          $stale = @(Get-ChildItem $env:TEMP -Directory -Filter "ns*.tmp" -EA SilentlyContinue | Where-Object { $tempBefore -notcontains $_.Name })
          $staleMB = [math]::Round((($stale | ForEach-Object { Get-ChildItem $_.FullName -Recurse -File -EA SilentlyContinue } | Measure-Object Length -Sum).Sum) / 1MB)
          Write-Host "stopped part way: $copied files copied, nothing registered; it left $($stale.Count) temporary folders ($staleMB MB)"

          # none: a full install, over what the stopped run left.
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $code = Install @("/S", "/currentuser")
          $watch.Stop()
          if ($code -ne 0) { Fail "fresh install exited $code" }
          if (-not (Entry)) { Fail "no Celerp uninstall entry after install" }
          $built = Installed
          python electron/scripts/check_win_bundle.py installed electron/dist/win-unpacked (InstallDir)
          if ($LASTEXITCODE -ne 0) { Fail "the install over a stopped run differs from the build" }
          $line = "- Windows runner account, per-user silent install: {0:N1} s" -f $watch.Elapsed.TotalSeconds
          Write-Host "timing: $line"
          Add-Content -Encoding utf8 $env:GITHUB_STEP_SUMMARY $line
          Write-Host "none: installed $built"

          # same: the same version run silently reinstalls.
          $code = Install @("/S", "/currentuser")
          if ($code -ne 0 -or (Installed) -ne $built) { Fail "same version: exit $code, entry $(Installed) (want exit 0, $built)" }
          Write-Host "same: reinstalled $built"

          # installed newer: this file is older than what is installed. Make the installed copy
          # recognisable first, so any change to it shows.
          Set-ItemProperty (Entry).PSPath -Name DisplayVersion -Value "999.0.0"
          $dir = InstallDir
          Set-Content -Encoding Ascii (Join-Path $dir "celerp-ci-sentinel.txt") "installed copy"
          [IO.File]::WriteAllBytes((Join-Path $dir "Celerp.exe"), [Text.Encoding]::ASCII.GetBytes("installed exe"))
          $before = State
          $code = Install @("/S", "/currentuser")
          $after = State
          if ($code -ne 2) { Fail "older installer over 999.0.0 exited $code (want 2)" }
          if ($after -ne $before) { Fail "older installer changed the install:`n before $before`n after  $after" }
          Write-Host "installed newer: stopped with exit 2; exe, sentinel and uninstall entry unchanged"

          # --updated: the in-app updater is never stopped or prompted, even over 999.0.0.
          $code = Install @("--updated", "/S", "/currentuser")
          if ($code -ne 0 -or (Installed) -ne $built) { Fail "in-app update run: exit $code, entry $(Installed) (want exit 0, $built)" }
          Write-Host "--updated: proceeded without a prompt"

          # installed older: this file updates it.
          Set-ItemProperty (Entry).PSPath -Name DisplayVersion -Value "0.0.1"
          $code = Install @("/S", "/currentuser")
          if ($code -ne 0 -or (Installed) -ne $built) { Fail "newer installer over 0.0.1: exit $code, entry $(Installed) (want exit 0, $built)" }
          Write-Host "installed older: updated 0.0.1 to $built"
          Write-Host "installer version check OK on Windows"

      # An administrator on a PC with UAC off has no standard token to relaunch into,
      # so the app must boot in place with its servers started at a restricted token.
      - name: Boot smoke (Windows administrator, UAC off)
        timeout-minutes: 15
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: electron
        run: ./scripts/win-boot-smoke.ps1 -Account admin

      # Installed for all users by an administrator, into a Program Files folder with
      # spaces whose deepest file is as long as a path may be without long-path
      # support, then run by a standard account that did not install it.
      - name: Boot smoke (Windows, per-machine install, second standard account)
        timeout-minutes: 20
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: electron
        run: ./scripts/win-boot-smoke.ps1 -Account standard -UserName celerpci2 -Install machine

      - name: Verify YML artifact names
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: bash
        run: |
          # Confirm electron-builder's generated YML files reference the stable filenames.
          # This catches any regression where artifactName reverts to a versioned name.
          FAIL=0
          check_yml() {
            local yml="$1" expected="$2"
            if [ ! -f "$yml" ]; then
              echo "SKIP: $yml not produced on this platform (expected)"
              return
            fi
            if grep -q "url: $expected" "$yml"; then
              echo "OK: $yml -> $expected"
            else
              echo "FAIL: $yml does not reference '$expected'"
              echo "  Contents:"
              cat "$yml"
              FAIL=1
            fi
          }
          check_yml electron/dist/latest-mac.yml   "Celerp-mac.dmg"
          check_yml electron/dist/latest.yml        "Celerp-Setup.exe"
          check_yml electron/dist/latest-linux.yml  "Celerp.AppImage"
          exit $FAIL

      # A tag build keeps its binaries here too: the upgrade test installs them.
      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: binaries-${{ matrix.os }}
          path: |
            electron/dist/Celerp-Setup.exe
            electron/dist/Celerp-mac.dmg
            electron/dist/Celerp.AppImage
            electron/dist/Celerp.deb
          if-no-files-found: warn

  # ── Attach the OpenAPI schema as a release asset (tag builds only) ────────
  # The website renders a static API reference from this schema, fetching
  # openapi.json from the latest release. Generated without booting a server:
  # app.openapi() builds the same document /openapi.json serves when the schema
  # is exposed. Uploaded to the still-draft release before publish-release flips
  # it live, so every published release carries it alongside the platform
  # binaries; a failure here leaves the release a draft, like any platform build.
  openapi-asset:
    needs: [build]
    if: ${{ success() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Pin package version from tag
        shell: bash
        run: echo "SETUPTOOLS_SCM_PRETEND_VERSION_FOR_CELERP=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Install the package
        run: pip install uv && uv pip install --system -e . -c constraints.txt
      - name: Export the OpenAPI schema
        run: python scripts/export_openapi.py --out openapi.json
      - name: Verify OpenAPI release version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os

          with open("openapi.json", encoding="utf-8") as f:
              schema = json.load(f)

          expected = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          actual = schema["info"]["version"]
          if actual != expected:
              raise SystemExit(
                  f"OpenAPI version mismatch: tag={expected!r}, schema={actual!r}"
              )
          PY
      - name: Attach openapi.json to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          TAG="${GITHUB_REF_NAME}"
          # The release is still a draft (platform builds publish to a draft);
          # get-release-by-tag returns only published releases, so list and match
          # on tag_name, the same way publish-release does.
          RELEASE_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/celerp/celerp/releases?per_page=100" \
            | python3 -c "import sys,json; tag='$TAG'; r=next((r for r in json.load(sys.stdin) if r['tag_name']==tag), None); print('' if r is None else r['id'])" 2>/dev/null || true)
          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: no release found for tag $TAG to attach openapi.json" >&2
            exit 1
          fi
          EXISTING_ASSET_ID=$(curl -fsS -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/celerp/celerp/releases/$RELEASE_ID/assets?per_page=100" \
            | python3 -c "import sys,json; a=next((a for a in json.load(sys.stdin) if a.get('name')=='openapi.json'), None); print('' if a is None else a['id'])")
          if [ -n "$EXISTING_ASSET_ID" ]; then
            echo "Replacing existing openapi.json asset $EXISTING_ASSET_ID"
            curl -fsS -X DELETE -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/celerp/celerp/releases/assets/$EXISTING_ASSET_ID" \
              >/dev/null
          fi
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $GH_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @openapi.json \
            "https://uploads.github.com/repos/celerp/celerp/releases/$RELEASE_ID/assets?name=openapi.json")
          if [ "$STATUS" -ge 300 ]; then
            echo "ERROR: openapi.json upload returned HTTP $STATUS" >&2
            exit 1
          fi
          echo "Attached openapi.json to release $RELEASE_ID ($TAG)."

  # ── Upgrade test of this release's binaries (tag builds only) ─────────────
  # The Linux and Windows binaries this run built, installed over the latest
  # published release, downgraded and upgraded again (packaged-upgrade-smoke.yml).
  # Nothing is published unless it passes: publish-release needs it, and PyPI
  # waits for it (scripts/release_gate.py desktop-builds in publish.yml).
  upgrade-smoke:
    needs: [build]
    if: ${{ success() && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/packaged-upgrade-smoke.yml
    with:
      candidate_run: ${{ github.run_id }}

  # ── Publish the release (tag builds only) ────────────────────────────────
  # Platform builds upload their assets to a DRAFT release (electron-builder
  # publish releaseType=draft). Only once EVERY platform job and the upgrade
  # test have succeeded do we flip the release to published (and latest, unless
  # a higher version is already out) - atomically, with all assets present. If any of them fails (e.g. macOS
  # notarization), this job is skipped, the release stays a draft, and
  # /releases/latest keeps serving the previous complete release: no 404 window
  # during a build, and no partial or untested release.
  publish-release:
    needs: [prepare-release, setup-matrix, build, openapi-asset, upgrade-smoke]
    if: ${{ success() && startsWith(github.ref, 'refs/tags/v') }}
    # Tags build side by side; only this job queues, so GitHub releases are
    # published one at a time, in the order their runs reach this job (not the
    # order the tags were pushed). Every waiting tag stays queued, none is
    # cancelled, and the version check below decides which becomes latest.
    # publish.yml queues nothing, so the PyPI release this job waits for never
    # waits behind it.
    concurrency:
      group: github-release
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7

      # PyPI cannot take a release back, so the GitHub release follows it: it is
      # published only once publish.yml's publish job succeeded for this tag and
      # commit (scripts/release_gate.py). That stays true when a later attempt
      # fails, so re-running only this job after a failure here needs no new PyPI
      # upload. Waits up to 90 minutes; anything else leaves the release a draft.
      - name: Wait for the PyPI release of this commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for _ in $(seq 90); do
            STATUS=0
            python3 scripts/release_gate.py pypi-release || STATUS=$?
            case "$STATUS" in
              0) exit 0 ;;
              3) sleep 60 ;;
              *) exit 1 ;;
            esac
          done
          echo "ERROR: the PyPI release did not finish within 90 minutes" >&2
          exit 1

      # The release becomes latest unless a higher version is already published
      # (scripts/release_gate.py make-latest): a fix to an older line is published,
      # as PyPI has it, and latest stays on the newer version.
      - name: Publish the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          TAG="${GITHUB_REF_NAME}"
          # The release is still a draft; get-release-by-tag only returns published
          # releases, so list releases (drafts included for an authed token) and
          # match on tag_name.
          INFO=$(curl -fsS -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/celerp/celerp/releases?per_page=100" \
            | python3 -c "import sys,json; tag='$TAG'; r=next((r for r in json.load(sys.stdin) if r['tag_name']==tag), None); print('' if r is None else '%s %s' % (r['id'], 1 if (r.get('body') or '').strip() else 0))")
          RELEASE_ID="${INFO%% *}"
          HAS_BODY="${INFO##* }"
          if [ -z "$RELEASE_ID" ]; then
            echo "ERROR: no release found for tag $TAG to publish" >&2
            exit 1
          fi
          LATEST=$(python3 scripts/release_gate.py make-latest)
          # Description: auto-generate from merged PR titles since the previous
          # release (GitHub generate-notes). Only when the body is empty - a
          # hand-written draft body always wins.
          if [ "$HAS_BODY" = "0" ]; then
            PAYLOAD=$(curl -fsS -X POST -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/celerp/celerp/releases/generate-notes" \
              -d "{\"tag_name\":\"$TAG\"}" \
              | python3 -c "import sys,json; notes=json.load(sys.stdin); print(json.dumps({'draft':False,'make_latest':'$LATEST','body':notes.get('body','')}))")
          else
            PAYLOAD="{\"draft\":false,\"make_latest\":\"$LATEST\"}"
          fi
          echo "Publishing release $RELEASE_ID ($TAG), latest: $LATEST"
          curl -fsS -o /dev/null -X PATCH -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/celerp/celerp/releases/$RELEASE_ID" \
            -d "$PAYLOAD"
          echo "Published $TAG."

  # ── Alert on a failed release build ──────────────────────────────────────────
  # When any platform (or prepare, upgrade test or publish) fails on a v* tag, the release is left as
  # a draft and `latest` keeps serving the previous version - correct, but SILENT.
  # GitHub's default failure email only reaches whoever pushed the tag, if their
  # personal notification settings allow it. Open (or comment on) a tracking issue
  # so a stuck/failed release is loud and team-visible regardless of those settings.
  # This is the only signal that e.g. macOS notarization broke (Apple agreement
  # expiry) - after which NO platform ships until it is fixed and the tag re-pushed.
  notify-release-failure:
    needs: [prepare-release, setup-matrix, build, openapi-asset, upgrade-smoke, publish-release]
    if: ${{ failure() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or update the release-failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -eo pipefail
          gh label create release-failure --repo "$REPO" --color B60205 --force \
            --description "A release build failed; the release is stuck as a draft" || true
          cat > /tmp/release_failure.md <<EOF
          The build or upgrade test for **$TAG** failed, so the release was left as a **draft and not published**.

          \`releases/latest\` still serves the previous complete release (no 404 window), but **$TAG will not ship on any platform until the build is fixed and the tag is re-pushed**.

          - Failed run: $RUN_URL
          - Check which platform or upgrade test failed in the logs (e.g. macOS notarization / an expired Apple agreement).

          Re-pushing the tag after a fix re-drafts and re-publishes automatically once every platform succeeds.
          If this version is already on PyPI and only publishing the release failed, re-run just the failed jobs of this run; a version on PyPI is never built again.
          EOF
          TITLE="Release build failed: $TAG"
          EXISTING=$(gh issue list --repo "$REPO" --state open --label release-failure \
            --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "Another failed run: $RUN_URL"
            echo "Commented on existing issue #$EXISTING"
          else
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label release-failure --body-file /tmp/release_failure.md
          fi
