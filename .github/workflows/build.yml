name: Build Binaries

on:
  push:
    tags: ["v*"]
    branches: ["develop"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PBS_TAG: "20260414"
  PBS_PYTHON: "3.12.13"
  # Bundled pg_dump/pg_restore, built from source (macOS). Pin version + SHA256
  # for every tarball. pg_dump 17.x dumps the embedded server (17) and any
  # external server <= 17.
  PG_VERSION: "17.10"
  PG_SHA256: "078a03516dcdbdb705fecaf415ea3d13a956c589e46f09fed68a06fb00598c90"
  OPENSSL_VERSION: "3.5.6"
  OPENSSL_SHA256: "deae7c80cba99c4b4f940ecadb3c3338b13cb77418409238e57d7f31f2a3b736"

jobs:
  # ── Prepare release (tag builds only) ────────────────────────────────────
  # Runs once before all three platform builds. Creates the GitHub release and
  # clears any stale assets from a previous attempt at the same tag. This
  # eliminates the race condition where Mac's electron-builder uploads its first
  # asset before Windows/Linux reach the asset-clearing step.
  prepare-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Clear existing release assets (retag support)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          RELEASE_ID=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/celerp/celerp/releases/tags/$TAG" \
            | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('id',''))" 2>/dev/null || true)
          if [ -z "$RELEASE_ID" ]; then
            echo "No existing release for $TAG - nothing to clear"
            exit 0
          fi
          echo "Release $RELEASE_ID found for $TAG - clearing assets"
          ASSET_IDS=$(curl -s -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/celerp/celerp/releases/$RELEASE_ID/assets" \
            | python3 -c "import sys,json; [print(a['id']) for a in json.load(sys.stdin)]" 2>/dev/null || true)
          if [ -z "$ASSET_IDS" ]; then
            echo "No assets to delete"
            exit 0
          fi
          for ASSET_ID in $ASSET_IDS; do
            echo "Deleting asset $ASSET_ID"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X DELETE \
              -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/celerp/celerp/releases/assets/$ASSET_ID" | tr -d '\r')
            if [ "$STATUS" -ge 500 ]; then
              echo "ERROR: DELETE asset $ASSET_ID returned HTTP $STATUS - aborting"
              exit 1
            fi
            echo "Deleted asset $ASSET_ID (HTTP $STATUS)"
          done
          echo "Assets cleared"

  build:
    needs: [prepare-release]
    # prepare-release is skipped on non-tag builds; treat skipped as success.
    if: always() && (needs.prepare-release.result == 'success' || needs.prepare-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_cmd: pnpm run build:linux
            platform_flag: --linux
            standalone_dir: linux-x64
            pbs_triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            build_cmd: pnpm run build:win
            platform_flag: --win
            standalone_dir: win-x64
            pbs_triple: x86_64-pc-windows-msvc
          - os: macos-latest
            build_cmd: pnpm run build:mac
            platform_flag: --mac
            standalone_dir: mac-arm64
            pbs_triple: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node deps
        working-directory: electron
        run: pnpm install --frozen-lockfile

      - name: Set Electron version from git tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="$VERSION" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('electron/package.json')
          data = json.loads(path.read_text())
          data['version'] = os.environ['VERSION']
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          echo "Electron package version set to $VERSION"

      # Download + SHA256-verify (against the release's SHA256SUMS) before extract.
      - name: Download Python standalone (arm64)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -eo pipefail
          F="cpython-${PBS_PYTHON}+${PBS_TAG}-aarch64-apple-darwin-install_only_stripped.tar.gz"
          BASE="https://github.com/astral-sh/python-build-standalone/releases/download/$PBS_TAG"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o "$F" "$BASE/$F"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o SHA256SUMS "$BASE/SHA256SUMS"
          grep " $F\$" SHA256SUMS | { command -v sha256sum >/dev/null && sha256sum -c - || shasum -a 256 -c -; }
          mkdir -p "electron/python-standalone/mac-arm64"
          tar xz -f "$F" -C "electron/python-standalone/mac-arm64"
          rm -f "$F"

      - name: Download Python standalone (x64)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          set -eo pipefail
          F="cpython-${PBS_PYTHON}+${PBS_TAG}-x86_64-apple-darwin-install_only_stripped.tar.gz"
          BASE="https://github.com/astral-sh/python-build-standalone/releases/download/$PBS_TAG"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o "$F" "$BASE/$F"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o SHA256SUMS "$BASE/SHA256SUMS"
          grep " $F\$" SHA256SUMS | { command -v sha256sum >/dev/null && sha256sum -c - || shasum -a 256 -c -; }
          mkdir -p "electron/python-standalone/mac-x64"
          tar xz -f "$F" -C "electron/python-standalone/mac-x64"
          rm -f "$F"

      - name: Download Python standalone
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          set -eo pipefail
          F="cpython-${PBS_PYTHON}+${PBS_TAG}-${{ matrix.pbs_triple }}-install_only_stripped.tar.gz"
          BASE="https://github.com/astral-sh/python-build-standalone/releases/download/$PBS_TAG"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o "$F" "$BASE/$F"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 3 -o SHA256SUMS "$BASE/SHA256SUMS"
          grep " $F\$" SHA256SUMS | { command -v sha256sum >/dev/null && sha256sum -c - || shasum -a 256 -c -; }
          mkdir -p "electron/python-standalone/${{ matrix.standalone_dir }}"
          tar xz -f "$F" -C "electron/python-standalone/${{ matrix.standalone_dir }}"
          rm -f "$F"

      - name: Install Python deps into standalone (arm64)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          PY="electron/python-standalone/mac-arm64/python/bin/python3"
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install .

      - name: Install Python deps into standalone (x64)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          # x64 Python runs via Rosetta on arm64 runner - safe for pure-Python
          # and wheels with pre-built binaries (numpy, pillow, psycopg2-binary, etc.)
          # numba/llvmlite removed from deps to avoid source build requirement
          PY="electron/python-standalone/mac-x64/python/bin/python3"
          "$PY" -m pip install --upgrade pip --prefer-binary
          "$PY" -m pip install . --prefer-binary

      - name: Install Python deps into standalone
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          DIR="electron/python-standalone/${{ matrix.standalone_dir }}/python"
          if [ -f "$DIR/python.exe" ]; then
            PY="$DIR/python.exe"
          else
            PY="$DIR/bin/python3"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install .

      # ── Bundled pg_dump/pg_restore (macOS) ──────────────────────────────
      # Built from source for both arches in this one arm64 job (x86_64 slice
      # cross-compiled with Rosetta). Cached on version + script hash so normal
      # builds skip the multi-minute compile.
      - name: Cache pg-tools (macOS)
        if: matrix.os == 'macos-latest'
        id: pg-tools-cache
        uses: actions/cache@v4
        with:
          path: electron/pg-tools
          key: pg-tools-${{ runner.os }}-pg${{ env.PG_VERSION }}-ossl${{ env.OPENSSL_VERSION }}-${{ hashFiles('electron/scripts/build-pg-tools.sh') }}

      - name: Build bundled pg_dump/pg_restore (macOS, both arches)
        if: matrix.os == 'macos-latest' && steps.pg-tools-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          bash electron/scripts/build-pg-tools.sh arm64  "$PWD/electron/pg-tools/mac-arm64"
          bash electron/scripts/build-pg-tools.sh x86_64 "$PWD/electron/pg-tools/mac-x64"

      # Note: the StackBuilder GUI DLLs (wxWidgets + libcurl) the Windows
      # embedded-postgres package vendors are pruned in electron/after-pack.js
      # (reliable on the real packaged tree) and verified by the post-build step.

      - name: Collect + verify third-party licenses
        shell: bash
        run: |
          set -eo pipefail
          OS="${{ matrix.os }}"
          PBS_BASE="electron/python-standalone"
          PYVER="python3.$(echo "$PBS_PYTHON" | cut -d. -f2)"
          ARGS=()
          add_tree() {                       # $1 = standalone dir (e.g. mac-arm64)
            ARGS+=(--pbs-root "$PBS_BASE/$1")
            if [ "$OS" = "windows-latest" ]; then
              ARGS+=(--site-packages "$PBS_BASE/$1/python/Lib/site-packages")
            else
              ARGS+=(--site-packages "$PBS_BASE/$1/python/lib/$PYVER/site-packages")
            fi
          }
          # The embedded PostgreSQL server is bundled on every platform (the
          # @embedded-postgres/<platform> package installs via the wrapper's
          # optional deps), so each passes its own curated native-lib license set.
          EP="electron/licenses-extra"
          if [ "$OS" = "macos-latest" ]; then
            add_tree mac-arm64               # universal app bundles BOTH Python trees,
            add_tree mac-x64                 # so collect/check both (audit-quality)
            # PG/OpenSSL license texts are arch-independent; one tree suffices.
            ARGS+=(--pg-licenses electron/pg-tools/mac-arm64/licenses)
            ARGS+=(--extra-embedded-postgres "$EP/embedded-postgres-darwin")
            PY="$PBS_BASE/mac-arm64/python/bin/python3"
          elif [ "$OS" = "windows-latest" ]; then
            add_tree "${{ matrix.standalone_dir }}"
            ARGS+=(--extra-embedded-postgres "$EP/embedded-postgres-win")
            PY="$PBS_BASE/${{ matrix.standalone_dir }}/python/python.exe"
          else
            add_tree "${{ matrix.standalone_dir }}"
            ARGS+=(--extra-embedded-postgres "$EP/embedded-postgres-linux")
            PY="$PBS_BASE/${{ matrix.standalone_dir }}/python/bin/python3"
          fi
          "$PY" electron/scripts/collect_licenses.py --out licenses \
            --node-modules electron/node_modules "${ARGS[@]}"
          "$PY" electron/scripts/collect_licenses.py --check --out licenses \
            --node-modules electron/node_modules "${ARGS[@]}"

      - name: Build macOS (production - signed + notarized)
        if: matrix.os == 'macos-latest' && startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 130
        working-directory: electron
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run build:mac -- --publish always

      - name: Build macOS (dev - signed only, no notarization)
        if: matrix.os == 'macos-latest' && !startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 60
        working-directory: electron
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: pnpm exec electron-builder ${{ matrix.platform_flag }} --publish never

      - name: Build (Windows / Linux - release tag)
        if: matrix.os != 'macos-latest' && startsWith(github.ref, 'refs/tags/v')
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.build_cmd }} -- --publish always

      - name: Build (Windows / Linux - dev build)
        if: matrix.os != 'macos-latest' && !startsWith(github.ref, 'refs/tags/v')
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm exec electron-builder ${{ matrix.platform_flag }} --publish never

      # Prove the licenses/ folder actually made it into the packaged artifact —
      # the pre-build check only proves licenses/ existed before electron-builder
      # ran, not that extraResources put it in the .app/.exe/.AppImage resources.
      - name: Verify licenses landed in the packaged artifact
        shell: bash
        run: |
          set -eo pipefail
          OS="${{ matrix.os }}"
          case "$OS" in
            macos-latest)
              RES="$(ls -d electron/dist/mac*/Celerp.app/Contents/Resources 2>/dev/null | head -1)" ;;
            windows-latest)
              RES="electron/dist/win-unpacked/resources" ;;
            *)
              RES="electron/dist/linux-unpacked/resources" ;;
          esac
          echo "Inspecting: $RES/licenses"
          test -n "$RES" && test -d "$RES/licenses"
          test -f "$RES/licenses/THIRD-PARTY-NOTICES.txt"
          test -d "$RES/licenses/python"
          test -d "$RES/licenses/electron"
          test -d "$RES/licenses/chromium"
          # embedded PostgreSQL server is bundled on every platform -> its
          # curated native-lib attribution must be present.
          test -d "$RES/licenses/embedded-postgres"
          test -f "$RES/licenses/embedded-postgres/NOTICE.txt"
          if [ "$OS" = "macos-latest" ]; then
            test -d "$RES/licenses/postgresql"   # from the bundled pg_dump tools
            test -d "$RES/licenses/openssl"
          fi
          # Windows: the StackBuilder DLLs (wxWidgets + libcurl) must have been
          # pruned by afterPack — fail loudly if any leaked into the package
          # (otherwise we'd ship the wxWindows-licensed DLLs without attribution).
          if [ "$OS" = "windows-latest" ]; then
            BIN="$RES/app.asar.unpacked/node_modules/@embedded-postgres/windows-x64/native/bin"
            if ls "$BIN"/wx*.dll "$BIN"/libcurl.dll >/dev/null 2>&1; then
              echo "ERROR: StackBuilder DLLs leaked into the Windows package" >&2
              ls "$BIN"/wx*.dll "$BIN"/libcurl.dll 2>/dev/null >&2
              exit 1
            fi
          fi
          echo "OK: third-party licenses present in packaged artifact"

      - name: Verify YML artifact names
        if: "!startsWith(github.ref, 'refs/tags/v')"
        shell: bash
        run: |
          # Confirm electron-builder's generated YML files reference the stable filenames.
          # This catches any regression where artifactName reverts to a versioned name.
          FAIL=0
          check_yml() {
            local yml="$1" expected="$2"
            if [ ! -f "$yml" ]; then
              echo "SKIP: $yml not produced on this platform (expected)"
              return
            fi
            if grep -q "url: $expected" "$yml"; then
              echo "OK: $yml -> $expected"
            else
              echo "FAIL: $yml does not reference '$expected'"
              echo "  Contents:"
              cat "$yml"
              FAIL=1
            fi
          }
          check_yml electron/dist/latest-mac.yml   "Celerp-mac.dmg"
          check_yml electron/dist/latest.yml        "Celerp-Setup.exe"
          check_yml electron/dist/latest-linux.yml  "Celerp.AppImage"
          exit $FAIL

      - name: Upload artifacts (dev builds only)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            electron/dist/Celerp-Setup.exe
            electron/dist/Celerp-mac.dmg
            electron/dist/Celerp.AppImage
          if-no-files-found: warn

      - name: Release (dev build)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev-latest
          name: "Dev Build (latest)"
          files: |
            electron/dist/Celerp-Setup.exe
            electron/dist/Celerp-mac.dmg
            electron/dist/Celerp.AppImage
          draft: false
          prerelease: true
