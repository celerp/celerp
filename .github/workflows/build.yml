name: Build Binaries

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  PBS_TAG: "20260414"
  PBS_PYTHON: "3.12.13"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build_cmd: pnpm run build:linux
            standalone_dir: linux-x64
            pbs_triple: x86_64-unknown-linux-gnu
          - os: windows-latest
            build_cmd: pnpm run build:win
            standalone_dir: win-x64
            pbs_triple: x86_64-pc-windows-msvc
          - os: macos-latest
            build_cmd: pnpm run build:mac
            standalone_dir: mac-arm64
            pbs_triple: aarch64-apple-darwin

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node deps
        working-directory: electron
        run: pnpm install --frozen-lockfile

      - name: Set Electron version from git tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          VERSION="$VERSION" python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path('electron/package.json')
          data = json.loads(path.read_text())
          data['version'] = os.environ['VERSION']
          path.write_text(json.dumps(data, indent=2) + '\n')
          PY
          echo "Electron package version set to $VERSION"

      - name: Download Python standalone
        shell: bash
        run: |
          URL="https://github.com/astral-sh/python-build-standalone/releases/download/$PBS_TAG/cpython-${PBS_PYTHON}+${PBS_TAG}-${{ matrix.pbs_triple }}-install_only_stripped.tar.gz"
          echo "Downloading: $URL"
          mkdir -p "electron/python-standalone/${{ matrix.standalone_dir }}"
          curl -fsSL "$URL" | tar xz -C "electron/python-standalone/${{ matrix.standalone_dir }}"

      - name: Install Python deps into standalone
        shell: bash
        run: |
          DIR="electron/python-standalone/${{ matrix.standalone_dir }}/python"
          if [ -f "$DIR/python.exe" ]; then
            PY="$DIR/python.exe"
          else
            PY="$DIR/bin/python3"
          fi
          "$PY" -m pip install --upgrade pip
          "$PY" -m pip install .

      - name: Pre-sign Python and PostgreSQL binaries (macOS)
        if: matrix.os == 'macos-latest'
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Sign all Mach-O binaries in the Python standalone and embedded-postgres
          # node_modules BEFORE electron-builder runs. electron-builder will skip
          # these directories via signIgnore, so their signatures are preserved.
          #
          # We use a dedicated short-lived keychain to avoid interfering with the
          # electron-builder keychain that is created in the Build step.
          IDENTITY="EEC6C15E6827071A403257986E6379A650C62AFB"
          CERT_PATH="$RUNNER_TEMP/presign.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/presign.keychain-db"

          echo "$CSC_LINK" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "presign" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "presign" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CSC_KEY_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH" $(security list-keychain -d user | tr -d '"')
          security set-key-partition-list -S apple-tool:,apple: -s -k "presign" "$KEYCHAIN_PATH"
          rm -f "$CERT_PATH"

          sign_macho_in_dir() {
            local dir="$1"
            echo "Pre-signing Mach-O binaries in: $dir"
            find "$dir" -type f -print0 | \
              xargs -0 -P 8 sh -c '
                for f do
                  if file "$f" | grep -q "Mach-O"; then
                    codesign --force --sign "'"$IDENTITY"'" \
                      --timestamp --options runtime \
                      --keychain "'"$KEYCHAIN_PATH"'" "$f" 2>&1
                  fi
                done
              ' _
            echo "Done signing: $dir"
          }

          sign_macho_in_dir "electron/python-standalone/mac-arm64/python"
          sign_macho_in_dir "electron/node_modules/@embedded-postgres"

          # Remove presign keychain from the search list so electron-builder's
          # own keychain setup is not confused by a second keychain containing
          # the same certificate.
          security list-keychain -d user -s $(security list-keychain -d user | tr -d '"' | grep -v presign)

      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        working-directory: electron
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: pnpm run build:mac

      - name: Build (Windows / Linux - no signing)
        if: matrix.os != 'macos-latest'
        working-directory: electron
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: ${{ matrix.build_cmd }}

      - name: Normalize artifact names
        shell: bash
        run: |
          cd electron/dist
          # Static names so website download links never need updating.
          for f in *.exe; do [ -f "$f" ] && mv "$f" Celerp-Setup.exe; done
          for f in *.dmg; do [ -f "$f" ] && mv "$f" Celerp-mac.dmg; done
          for f in *.AppImage; do [ -f "$f" ] && mv "$f" Celerp.AppImage; done
          ls -la Celerp-* 2>/dev/null || echo "No matching artifacts"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: |
            electron/dist/Celerp-Setup.exe
            electron/dist/Celerp-mac.dmg
            electron/dist/Celerp.AppImage
          if-no-files-found: warn

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            electron/dist/Celerp-Setup.exe
            electron/dist/Celerp-mac.dmg
            electron/dist/Celerp.AppImage
          draft: false
