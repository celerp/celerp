name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  shard:
    name: Test shard ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4, 5, 6]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: celerp
          POSTGRES_PASSWORD: celerp
          POSTGRES_DB: celerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install deps
        run: pip install uv && uv pip install --system -e ".[dev]" pytest-xdist pytest-split

      - name: Run tests (shard ${{ matrix.group }}/6)
        env:
          ALLOW_INSECURE_JWT: "true"
          # Run on the Postgres service (each xdist worker gets its own database).
          DATABASE_URL: postgresql+asyncpg://celerp:celerp@localhost:5432/celerp_test
        # The suite is ~3.5k small tests (no slow outliers), so wall time is bound by
        # core count. ubuntu-latest has 2 vCPUs, so a single `-n auto` run can't keep up.
        # pytest-split fans the suite across 6 parallel runners; each still uses -n auto
        # within its 2 cores. 4 shards left one shard ~340s (it hit the old 300s cap); 6
        # shards drop each to ~1/6 of the suite and the 600s cap is a generous backstop.
        run: >
          timeout 600 pytest tests/ default_modules/*/tests/ -n auto -q --tb=short --no-cov
          --timeout=30
          --splits 6 --group ${{ matrix.group }}
          --ignore=tests/test_visual.py
          --ignore=tests/test_browser

  browser:
    name: Browser shard ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: celerp
          POSTGRES_PASSWORD: celerp
          POSTGRES_DB: celerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install deps
        run: pip install uv && uv pip install --system -e ".[dev]" pytest-xdist pytest-split

      - name: Install Chromium for Playwright
        run: python -m playwright install --with-deps chromium

      - name: Run browser tests (shard ${{ matrix.group }}/3)
        env:
          ALLOW_INSECURE_JWT: "true"
          # Each xdist worker gets its own database AND its own server ports (see
          # tests/test_browser/conftest.py), so -n parallelism is safe.
          DATABASE_URL: postgresql+asyncpg://celerp:celerp@localhost:5432/celerp_test
        # Clear the default `-m 'not browser'` addopts, select browser tests, and shard them across
        # 3 runners with pytest-split. Each runner runs its group SERIALLY (no -n): a browser test
        # is CPU-heavy (Chromium + an API + a UI server), so intra-runner parallelism on a 2-vCPU
        # box causes contention timeouts. The thread-based timeout is required for Playwright tests.
        run: >
          timeout 600 pytest tests/test_browser -m browser -o addopts=""
          --timeout=120 --timeout-method=thread --no-cov --tb=short -p no:cacheprovider
          --splits 3 --group ${{ matrix.group }}

      # On failure, upload the Playwright traces + screenshots so CI-only browser flakes
      # (which never reproduce locally) can be diagnosed: `playwright show-trace <name>.trace.zip`.
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-shard-${{ matrix.group }}
          path: /tmp/playwright_failures
          if-no-files-found: ignore
          retention-days: 7

  # Bundled-PostgreSQL tests: mode resolution + manager units + a real cluster
  # from the celerp-postgres wheels (integration). --noconftest and no Postgres
  # service: these boot their own cluster, which also lets them run on the
  # macOS/Windows runners (no Docker). macOS: the celerp dependency marker
  # excludes darwin (wheels need macOS 26+, which markers can't express), so the
  # mac job installs celerp-postgres explicitly — proving the documented manual
  # opt-in path on the macOS 26 runner.
  embedded:
    name: Embedded PG (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-24.04-arm, python: "3.12" }
          # Pinned to macos-26: the celerp-postgres mac wheels are (honestly)
          # tagged macosx_26_0, and the macos-latest pool still hands out
          # macOS 15 machines mid-migration, where pip finds no wheel.
          - { os: macos-26, python: "3.12", extra: celerp-postgres }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install deps
        shell: bash
        run: pip install -e ".[dev]" ${{ matrix.extra }}
      - name: Run embedded-PG unit + integration tests
        env:
          ALLOW_INSECURE_JWT: "true"
        run: >
          pytest tests/test_embedded_pg_modes.py tests/test_embedded_pg_manager.py
          tests/test_embedded_pg_integration.py tests/test_default_modules_boot.py
          --noconftest -o addopts="" -p no:cacheprovider --timeout=300 -q

  # Electron unit tests (incl. the L0 packaged-requires gate). Nothing ran these in
  # CI before; they catch the "require added, build.files not updated" class (v1.2.6)
  # statically, on every PR, with no build.
  electron:
    name: Electron unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: Install electron deps (skip the electron binary; tests are pure JS)
        working-directory: electron
        run: ELECTRON_SKIP_BINARY_DOWNLOAD=1 pnpm install --frozen-lockfile
      - name: Run electron unit tests
        working-directory: electron
        run: pnpm test

  # First-party lock is derived, not hand-edited: regenerate it from the tracked
  # tree and fail if the committed file differs. Keeps default_modules/ and the
  # loader's trust check in lockstep so a shipped module change without a matching
  # lock update (which would fail-close that module at runtime) is caught on the PR.
  lockfile:
    name: First-party lock is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install deps
        run: pip install uv && uv pip install --system -e ".[dev]"
      - name: Regenerate the lock
        run: python scripts/gen_first_party_lock.py
      - name: Fail if the committed lock is stale
        run: git diff --exit-code default_modules/first_party.lock.json

  # Aggregator: the single required status check. Branch protection should require "Test"
  # (this job), which passes only when every unit, browser, electron, AND lockfile job passed.
  test:
    name: Test
    needs: [shard, browser, embedded, electron, lockfile]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all shards passed
        run: |
          if [ "${{ needs.shard.result }}" != "success" ]; then
            echo "One or more unit-test shards failed (result: ${{ needs.shard.result }})"
            exit 1
          fi
          if [ "${{ needs.browser.result }}" != "success" ]; then
            echo "One or more browser-test shards failed (result: ${{ needs.browser.result }})"
            exit 1
          fi
          if [ "${{ needs.embedded.result }}" != "success" ]; then
            echo "One or more embedded-PostgreSQL jobs failed (result: ${{ needs.embedded.result }})"
            exit 1
          fi
          if [ "${{ needs.electron.result }}" != "success" ]; then
            echo "Electron unit tests failed (result: ${{ needs.electron.result }})"
            exit 1
          fi
          if [ "${{ needs.lockfile.result }}" != "success" ]; then
            echo "First-party lock is stale (result: ${{ needs.lockfile.result }})"
            exit 1
          fi
          echo "All unit, browser, embedded, electron, and lockfile checks passed."
