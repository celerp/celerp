name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: celerp
          POSTGRES_PASSWORD: celerp
          POSTGRES_DB: celerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install deps
        run: pip install uv && uv pip install --system -e ".[dev]" pytest-xdist

      - name: Run tests
        env:
          ALLOW_INSECURE_JWT: "true"
          # Run on the Postgres service (each xdist worker gets its own database).
          DATABASE_URL: postgresql+asyncpg://celerp:celerp@localhost:5432/celerp_test
        run: >
          timeout 540 pytest tests/ -n auto -x -q --tb=short --no-cov
          --timeout=30
          --ignore=tests/test_visual.py
          --ignore=tests/test_browser
