# CLA gate VERIFIER (REVIEW DRAFT) — a manual harness that proves the CLA gate is wired correctly.
# It is NOT the gate; it gates nothing and changes nothing. Run it by hand during activation against a
# throwaway EXTERNAL (non-allowlisted) test PR, before and after that account signs.
#
# Why it exists: the contributor-assistant action posts a commit STATUS (e.g. license/cla) and exits 0 —
# it never fails the job. So a green workflow job proves nothing. The required branch-protection check
# MUST be the status context, not the workflow/job, or the gate fails open. This verifier reads the live
# commit status + branch protection and flags the fail-open misconfiguration.
#
# It is read-only: no checkout of PR code, no writes. Limitation: it can prove the emitted context, its
# state, and the branch-protection config; it CANNOT by itself prove legal clickwrap acceptance — that
# requires a real, non-allowlisted account performing the acceptance. Keep the first activation semi-manual.

name: Verify CLA gate

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number of the throwaway EXTERNAL test PR'
        required: true
      expected_context:
        description: 'The commit-status context the CLA action posts'
        required: true
        default: 'license/cla'
      expected_state:
        description: 'Optional: assert the context state is exactly this (success | failure | pending | error). Empty = report only.'
        required: false
        default: ''

permissions:
  contents: read
  statuses: read
  pull-requests: read
  administration: read     # read branch protection (may need a PAT if GITHUB_TOKEN cannot — see below)

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
      PR: ${{ inputs.pr_number }}
      CTX: ${{ inputs.expected_context }}
      WANT_STATE: ${{ inputs.expected_state }}
      # Optional: a read token for the private signatures repo to confirm the record landed (point 8).
      SIG_TOKEN: ${{ secrets.CLA_SIGNATURES_READ_TOKEN }}
      SIG_REPO: 'celerp/cla-signatures'
      SIG_PATH: 'v1/cla.json'
      # Keep this in sync with the CLA workflow allowlist (licensor + bots).
      EXEMPT: 'ngsevers dependabot[bot] github-actions[bot]'
    steps:
      - name: Verify status context, state, branch protection, and (optionally) the record
        run: |
          set -euo pipefail
          fail=0
          echo "Repo: $OWNER/$REPO   PR: #$PR   Expected context: $CTX"

          PR_JSON=$(gh api "repos/$OWNER/$REPO/pulls/$PR")
          SHA=$(echo "$PR_JSON" | jq -r '.head.sha')
          ACTOR=$(echo "$PR_JSON" | jq -r '.user.login')
          echo "Head SHA: $SHA   PR author: $ACTOR"

          # 1) The test actor must NOT be exempt/allowlisted, or you tested the bypass path, not signing.
          for e in $EXEMPT; do
            if [ "$ACTOR" = "$e" ]; then
              echo "::error::PR author '$ACTOR' is exempt/allowlisted — this exercises the bypass path, not the contributor path. Use a non-exempt external account."
              fail=1
            fi
          done

          # 2) The expected status context must exist on the PR head SHA.
          STATUSES=$(gh api "repos/$OWNER/$REPO/commits/$SHA/status")
          echo "Commit statuses on $SHA:"
          echo "$STATUSES" | jq -r '.statuses[] | "  \(.context)\t\(.state)\t\(.description // "")"'
          COUNT=$(echo "$STATUSES" | jq --arg ctx "$CTX" '[.statuses[] | select(.context == $ctx)] | length')
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::No commit status with context '$CTX' on $SHA. The action likely posts a different context — set expected_context to the real one (read it from the list above)."
            fail=1
          else
            STATE=$(echo "$STATUSES" | jq -r --arg ctx "$CTX" 'first(.statuses[] | select(.context == $ctx)) | .state')
            echo "Context '$CTX' state: $STATE   (expect non-success BEFORE signing, success AFTER)"
            if [ -n "$WANT_STATE" ] && [ "$STATE" != "$WANT_STATE" ]; then
              echo "::error::Context '$CTX' state is '$STATE', expected '$WANT_STATE'."
              fail=1
            fi
          fi

          # 3) Branch protection on main must REQUIRE that exact context (read-only check; may need a PAT).
          if PROT=$(gh api "repos/$OWNER/$REPO/branches/main/protection/required_status_checks" 2>/dev/null); then
            echo "Required status checks on main: $(echo "$PROT" | jq -c '.contexts // (.checks // [] | map(.context))')"
            REQ=$(echo "$PROT" | jq --arg ctx "$CTX" '[ (.contexts // []) + ((.checks // []) | map(.context)) | .[] | select(. == $ctx) ] | length')
            if [ "$REQ" -lt 1 ]; then
              echo "::warning::Branch protection does not require context '$CTX' yet. Add it (NOT the 'CLA' workflow/job) once you have observed the context name."
            else
              echo "OK: branch protection requires '$CTX'."
            fi
            # 4) Fail-open guard: the workflow/job must not be the gate (it is green regardless of signing).
            if echo "$PROT" | jq -e '[ (.contexts // []) + ((.checks // []) | map(.context)) | .[] | select(. == "CLA" or . == "CLA / cla" or . == "cla") ] | length > 0' >/dev/null; then
              echo "::error::Branch protection requires the CLA workflow/job — that check is green whether or not the contributor signed (FAIL OPEN). Require the status context '$CTX' instead."
              fail=1
            fi
          else
            echo "::warning::Could not read branch protection with GITHUB_TOKEN (needs admin read). Re-run with a PAT in GH_TOKEN, or verify the required check name manually in Settings > Branches."
          fi

          # 5) Optional: confirm the signature record for this actor landed in the private signatures repo.
          if [ -n "${SIG_TOKEN:-}" ]; then
            if REC=$(GH_TOKEN="$SIG_TOKEN" gh api "repos/$SIG_REPO/contents/$SIG_PATH" --jq '.content' 2>/dev/null | base64 -d 2>/dev/null); then
              if echo "$REC" | jq -e --arg u "$ACTOR" '.. | objects | select((.name? // .user? // .login?) == $u)' >/dev/null 2>&1; then
                echo "OK: a signature record for '$ACTOR' exists in $SIG_REPO/$SIG_PATH."
              else
                echo "::warning::No signature record for '$ACTOR' found in $SIG_REPO/$SIG_PATH yet (expected only AFTER they sign)."
              fi
            else
              echo "::warning::Could not read $SIG_REPO/$SIG_PATH with CLA_SIGNATURES_READ_TOKEN (check the token scope / path)."
            fi
          else
            echo "Signature-record check skipped (set secret CLA_SIGNATURES_READ_TOKEN to enable)."
          fi

          if [ "$fail" -ne 0 ]; then
            echo "::error::CLA gate verification FAILED — see errors above."
            exit 1
          fi
          echo "CLA gate verification passed for the checks that could run."
