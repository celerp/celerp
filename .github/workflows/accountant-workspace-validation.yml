name: Accountant foundation validation
on:
  push:
    branches: [accountant-channel-foundation-20261011]
permissions:
  contents: read
jobs:
  migration-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: celerp
          POSTGRES_PASSWORD: celerp
          POSTGRES_DB: celerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install dependencies
        run: pip install uv && uv pip install --system -e ".[dev]" pytest-xdist -c constraints.txt
      - name: Compile affected modules
        run: python -m compileall -q celerp/services/migrations.py celerp/routers/migrations.py ui/routes/migrations.py
      - name: Focused migration lifecycle and end-to-end tests
        env:
          ALLOW_INSECURE_JWT: "true"
          DATABASE_URL: postgresql+asyncpg://celerp:celerp@localhost:5432/celerp_test
        run: pytest tests/test_migration_lifecycle.py tests/test_migration_e2e.py tests/test_supplier_return_settles_bill.py -q --tb=short --no-cov --timeout=45
