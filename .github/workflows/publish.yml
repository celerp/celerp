name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  # Builds and verifies a candidate without a tag. Publishing runs only on a tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, for example 2.5.4"
        required: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # setuptools-scm needs full history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Verify version matches tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          pip install build setuptools-scm
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
            TAG=$VERSION
          else
            TAG=${GITHUB_REF#refs/tags/v}
            PKG=$(python -c "from setuptools_scm import get_version; print(get_version())")
            echo "Tag: $TAG, Package: $PKG"
            [ "$TAG" = "$PKG" ] || { echo "Version mismatch!"; exit 1; }
          fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # The release requires exactly the dependency set CI tested, so an install
      # made months later gets the same packages. Pinning edits pyproject.toml,
      # which would make setuptools-scm read the tree as a dev build; the version
      # was verified against the tag above, so it is passed in explicitly.
      - name: Pin dependencies and build
        run: |
          python scripts/pin_release_deps.py
          SETUPTOOLS_SCM_PRETEND_VERSION=$TAG python -m build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # The built wheel, installed fresh and as an update from the current PyPI
  # release, on every OS the bundled PostgreSQL ships for. Nothing is published
  # unless every one passes.
  verify:
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-26, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Fresh install and update from the current release
        shell: bash
        run: python -u scripts/e2e_update.py --release-wheel dist/*.whl --work "${{ runner.temp }}/e2e" --keep
      - name: Keep the logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-e2e-${{ matrix.os }}
          path: ${{ runner.temp }}/e2e/runs/*/*.log
          if-no-files-found: ignore

  # Some dependencies resolve to a different version per Python. On each
  # supported Python, a fresh install of the wheel must get exactly the version
  # the release pins for that Python.
  pins:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Fresh install gets the pinned versions
        run: |
          python -m venv /tmp/pins
          /tmp/pins/bin/pip install dist/*.whl
          /tmp/pins/bin/python - <<'PY'
          from importlib.metadata import distributions, requires, version
          from packaging.requirements import Requirement
          from packaging.utils import canonicalize_name
          wrong, pinned_names = [], {"celerp", "pip", "setuptools"}
          for req in map(Requirement, requires("celerp")):
              if req.marker and not req.marker.evaluate({"extra": ""}):
                  continue
              pinned_names.add(canonicalize_name(req.name))
              pinned = [s for s in req.specifier if s.operator == "=="]
              if not pinned or version(req.name) != pinned[0].version:
                  wrong.append(f"{req}: installed {version(req.name)}")
          for dist in distributions():
              if canonicalize_name(dist.metadata["Name"]) not in pinned_names:
                  wrong.append(f"{dist.metadata['Name']} {dist.version}: installed without a pin")
          if wrong:
              raise SystemExit("\n".join(wrong))
          print("all pinned versions installed")
          PY

  publish:
    needs: [verify, pins]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      id-token: write  # Required for PyPI trusted publishing
    steps:
      # PyPI cannot take a release back, so it follows the desktop builds of this
      # commit: it is published only once every one of them succeeded. build.yml's
      # release job waits for this workflow, so this waits for its build jobs, never
      # its whole run. Waits up to 4 hours; anything else publishes nothing.
      - name: Wait for the desktop builds of this commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eo pipefail
          API=https://api.github.com/repos/celerp/celerp/actions
          for _ in $(seq 240); do
            RUN=$(curl -fsS -H "Authorization: token $GH_TOKEN" \
              "$API/workflows/build.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=$GITHUB_REF_NAME&per_page=1" \
              | python3 -c "import sys,json; r=json.load(sys.stdin)['workflow_runs']; print(r[0]['id'] if r else '')")
            BUILDS="not started"
            if [ -n "$RUN" ]; then
              BUILDS=$(curl -fsS -H "Authorization: token $GH_TOKEN" "$API/runs/$RUN/jobs?per_page=100" \
                | python3 -c "import sys,json; b=[j['conclusion'] for j in json.load(sys.stdin)['jobs'] if j['name'] == 'build' or j['name'].startswith('build (')]; print('failed' if set(b) - {None, 'success'} else 'succeeded' if b and set(b) == {'success'} else 'running')")
            fi
            echo "desktop builds: $BUILDS"
            case "$BUILDS" in
              succeeded) exit 0 ;;
              failed) echo "ERROR: a desktop build of this commit did not succeed" >&2; exit 1 ;;
            esac
            sleep 60
          done
          echo "ERROR: the desktop builds did not finish within 4 hours" >&2
          exit 1

      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
