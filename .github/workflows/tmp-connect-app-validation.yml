name: Temporary Connect App Validation

on:
  push:
    branches: [fix/connect-claim-timeout]
    paths:
      - "scripts/tmp_connect_app_patch*.py"
      - ".github/workflows/tmp-connect-app-validation.yml"

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: celerp
          POSTGRES_PASSWORD: celerp
          POSTGRES_DB: celerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ALLOW_INSECURE_JWT: "true"
      DATABASE_URL: postgresql+asyncpg://celerp:celerp@localhost:5432/celerp_test
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply correction set to clean PR head
        env:
          CLEAN_HEAD: 48216d2c0e63edfb62f0704be286e5946ab44905
        run: |
          set -euo pipefail
          cp scripts/tmp_connect_app_patch*.py /tmp/
          git reset --hard "$CLEAN_HEAD"
          python /tmp/tmp_connect_app_patch0.py
          python /tmp/tmp_connect_app_patch1.py
          python /tmp/tmp_connect_app_patch2.py
          python /tmp/tmp_connect_app_patch3.py
          python /tmp/tmp_connect_app_patch4.py
          python /tmp/tmp_connect_app_patch5.py
          python /tmp/tmp_connect_app_patch6.py
          git status --short
          python -m compileall -q celerp ui tests
          git diff --check

      - name: Install dependencies
        run: pip install -q uv && uv pip install --quiet --system -e ".[dev]" pytest-xdist pytest-split

      - name: Focused Connect contract
        run: |
          pytest -q --tb=short --no-cov -x \
            tests/test_routers/test_cloud_relay.py \
            tests/test_instance_identity.py \
            tests/test_relay_account_proxy.py
          pytest -q --tb=short --no-cov -x tests/test_ui.py -k "cloud or account"

      - name: Full app suite
        run: timeout 1200 pytest tests/ default_modules/*/tests/ -n auto -q --tb=short --no-cov --timeout=30 --ignore=tests/test_visual.py

      - name: Publish clean source commit
        env:
          STAGED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name "Noah Severs"
          git config user.email "118095044+ngsevers@users.noreply.github.com"
          git add celerp ui tests
          git diff --cached --check
          git commit -m "Harden Connect activation recovery"
          git push --force-with-lease=refs/heads/fix/connect-claim-timeout:"$STAGED_HEAD" \
            origin HEAD:refs/heads/fix/connect-claim-timeout