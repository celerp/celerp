name: PR415 audit validation
on:
  push:
    branches: [fix/pr415-audit-validation]
permissions:
  contents: read
jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: celerp
          POSTGRES_PASSWORD: celerp
          POSTGRES_DB: celerp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ALLOW_INSECURE_JWT: "true"
      DATABASE_URL: postgresql+asyncpg://celerp:celerp@localhost:5432/celerp_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install dependencies
        run: pip install uv && uv pip install --system -e ".[dev]" pytest-xdist pytest-split -c constraints.txt
      - name: Migration head and canonical module lock
        run: |
          python -m alembic heads
          python scripts/gen_first_party_lock.py
          python - <<'PY'
          import json
          lock = json.load(open("default_modules/first_party.lock.json"))
          print("CANONICAL_LOCK_DIGESTS", json.dumps({
              key: lock[key] for key in ("celerp-docs","celerp-accounting")
          }))
          PY
      - name: Focused tests and measured durations
        run: |
          cp tests/.test_durations /tmp/pr415-before.json
          set +e
          timeout 1200 pytest -n 2 -q --tb=short --no-cov --store-durations \
            --durations-path tests/.test_durations \
            tests/test_nav_overrides.py \
            tests/test_doc_gl_impact_ui.py \
            tests/test_services/test_sequences.py \
            tests/test_picker_starting_list_per_type.py \
            default_modules/celerp-accounting/tests/test_journal_gl_soa.py
          CODE=$?
          set -e
          python - <<'PY'
          import json
          before=json.load(open("/tmp/pr415-before.json"))
          after=json.load(open("tests/.test_durations"))
          fresh={k:round(v,4) for k,v in after.items() if k not in before}
          print("NEW_MEASUREMENTS",json.dumps(fresh,sort_keys=True))
          PY
          exit "$CODE"
      - name: Shard inventory
        run: pytest tests/test_ci_shard_split.py -q --tb=short --no-cov
      - name: Source checks
        run: |
          ruff check celerp/services/ledger_rows.py default_modules/celerp-accounting/celerp_accounting/routes.py default_modules/celerp-docs/celerp_docs/sequences.py
          git diff --exit-code -- default_modules/first_party.lock.json
