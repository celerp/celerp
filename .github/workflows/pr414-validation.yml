name: PR414 scan regression validation

on:
  push:
    branches: [validation/pr414-activation]

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: celerp
          POSTGRES_PASSWORD: celerp
          POSTGRES_DB: celerp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install deps
        run: pip install uv && uv pip install --system -e ".[dev]" pytest-xdist pytest-split -c constraints.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Repeat draft scan serialization regression
        env:
          ALLOW_INSECURE_JWT: "true"
          DATABASE_URL: postgresql+asyncpg://celerp:celerp@localhost:5432/celerp_test
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            echo "Scan regression pass $i"
            pytest tests/test_browser/test_list_mutation_serialization.py -m browser -o addopts="" -q --timeout=120 --timeout-method=thread --no-cov --tb=short -p no:cacheprovider
          done
