name: Country pack golden

# Fetches the real country packs, validates them and runs the tests marked real_packs.
# It runs on a manual run and when ci.yml (push to main), build.yml or publish.yml (a tag or a
# manual run) calls it; never on a pull request or a push to any other branch. The job runs in
# the country-packs environment and is the only job that fetches the packs: it uploads them as
# the country-packs artifact, which the build jobs download and check against the lock.
on:
  workflow_dispatch:
  workflow_call:

jobs:
  golden:
    name: Real-pack golden
    if: github.repository == 'celerp/celerp'
    environment: country-packs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: celerp
          POSTGRES_PASSWORD: celerp
          POSTGRES_DB: celerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt

      - name: Install deps
        run: pip install uv && uv pip install --system -e ".[dev]" -c constraints.txt

      - name: Tune the throwaway Postgres
        run: bash scripts/ci_tune_postgres.sh postgresql://celerp:celerp@localhost:5432/celerp_test

      - name: Fetch country packs
        env:
          CELERP_L10N_TOKEN: ${{ secrets.CELERP_L10N_TOKEN }}
        run: python scripts/l10n_packs.py fetch

      - name: Validate country packs
        env:
          ALLOW_INSECURE_JWT: "true"
        run: python scripts/l10n_packs.py validate celerp/localization

      - name: Run the real-pack golden
        env:
          ALLOW_INSECURE_JWT: "true"
          CELERP_TEST_DATABASE_URL: postgresql+asyncpg://celerp:celerp@localhost:5432/celerp_test
        # The golden compares, never rewrites: a runner that sets the write switch gets it unset here.
        run: env -u CELERP_L10N_GOLDEN_WRITE pytest tests/ default_modules/*/tests/ -m real_packs -o addopts="" -q --no-cov

      - name: Share the checked packs with the build jobs
        uses: actions/upload-artifact@v7
        with:
          name: country-packs
          path: celerp/localization/packs
          if-no-files-found: error
          retention-days: 1
