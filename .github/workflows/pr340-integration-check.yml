name: PR340 Integration Check

on:
  push:
    branches: [pr340-integration-check]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: celerp
          POSTGRES_PASSWORD: celerp
          POSTGRES_DB: celerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ALLOW_INSECURE_JWT: "true"
      DATABASE_URL: postgresql+asyncpg://celerp:celerp@localhost:5432/celerp_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebase exact PR head onto exact main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Noah Severs"
          git config user.email "118095044+ngsevers@users.noreply.github.com"
          git fetch --no-tags origin main woocommerce-sync-integrity
          test "$(git rev-parse origin/main)" = "0024c5ffa3b01a9e93514b3e99938f0dc8749ebb"
          test "$(git rev-parse origin/woocommerce-sync-integrity)" = "6356077a6174e46d17f1b29ee996192355ddca3d"
          git checkout --detach 6356077a6174e46d17f1b29ee996192355ddca3d
          set +e
          git rebase 0024c5ffa3b01a9e93514b3e99938f0dc8749ebb
          rc=$?
          set -e
          while [ "$rc" -ne 0 ]; do
            conflicts="$(git diff --name-only --diff-filter=U)"
            test "$conflicts" = "default_modules/first_party.lock.json"
            git checkout --ours default_modules/first_party.lock.json
            git add default_modules/first_party.lock.json
            set +e
            GIT_EDITOR=true git rebase --continue
            rc=$?
            set -e
          done

      - name: Apply connector hardening
        shell: bash
        run: |
          cat > /tmp/pr340_harden.py <<'PY'
          from pathlib import Path
          import re

          ROOT = Path(".")

          def read(path):
              return (ROOT / path).read_text()

          def write(path, text):
              (ROOT / path).write_text(text)

          def rep(path, old, new, count=1):
              text = read(path)
              if text.count(old) < count:
                  raise SystemExit(f"{path}: expected replacement not found: {old[:100]!r}")
              write(path, text.replace(old, new, count))

          def between(path, start, end, new):
              text = read(path)
              i = text.index(start)
              j = text.index(end, i)
              write(path, text[:i] + new + text[j:])

          # ------------------------------------------------------------------
          # Persistent connector ownership lifecycle.
          # ------------------------------------------------------------------
          rep(
              "celerp/models/connector_config.py",
              '    last_daily_sync_at: Mapped[datetime | None] = mapped_column(sa.DateTime(timezone=True), nullable=True)\n',
              '    last_daily_sync_at: Mapped[datetime | None] = mapped_column(sa.DateTime(timezone=True), nullable=True)\n'
              '    claimed_at: Mapped[datetime] = mapped_column(\n'
              '        sa.DateTime(timezone=True), nullable=False, server_default=sa.func.now()\n'
              '    )\n'
              '    activated_at: Mapped[datetime | None] = mapped_column(sa.DateTime(timezone=True), nullable=True)\n',
          )

          write("celerp/connectors/ownership.py", r'''# Copyright (c) 2026 Noah Severs
          # SPDX-License-Identifier: BUSL-1.1
          """Local ownership of installation-scoped connector credentials."""
          from __future__ import annotations

          import json
          import logging
          from dataclasses import dataclass
          from datetime import datetime, timezone

          import sqlalchemy as sa

          from celerp.config import ensure_instance_id
          from celerp.db import get_session_ctx
          from celerp.models.company import Company
          from celerp.models.connector_config import ConnectorConfig

          log = logging.getLogger(__name__)


          class ConnectorOwnershipError(RuntimeError):
              pass


          @dataclass(frozen=True)
          class ClaimResult:
              config_id: int
              created: bool


          async def _lock(session, connector: str) -> None:
              await session.execute(
                  sa.text("SELECT pg_advisory_xact_lock(hashtextextended(:k, 0))"),
                  {"k": f"connector-owner:{connector}"},
              )


          def _default_frequency(connector: str) -> str:
              try:
                  from celerp.connectors.registry import get
                  category = getattr(get(connector).category, "value", str(get(connector).category))
              except Exception:
                  category = ""
              return "realtime" if category == "website" else "manual"


          def _merge_compatible(current: ConnectorConfig, legacy: ConnectorConfig) -> None:
              if current.webhook_secret and legacy.webhook_secret and current.webhook_secret != legacy.webhook_secret:
                  raise ConnectorOwnershipError(
                      f"{current.connector} has conflicting legacy webhook secrets; reconnect explicitly"
                  )
              current.webhook_secret = current.webhook_secret or legacy.webhook_secret
              current.webhook_ids = list(dict.fromkeys(current.webhook_ids + legacy.webhook_ids))
              if not current.claimed_at:
                  current.claimed_at = legacy.claimed_at
              if current.activated_at is None:
                  current.activated_at = legacy.activated_at


          async def get_company_config(
              company_id: str, connector: str, *, active_only: bool = False
          ) -> ConnectorConfig | None:
              async with get_session_ctx() as session:
                  stmt = sa.select(ConnectorConfig).where(
                      ConnectorConfig.company_id == str(company_id),
                      ConnectorConfig.connector == connector,
                  )
                  if active_only:
                      stmt = stmt.where(ConnectorConfig.activated_at.is_not(None))
                  return await session.scalar(stmt.limit(1))


          async def claim_connector(company_id: str, connector: str) -> ClaimResult:
              """Atomically claim one installation/platform credential for one ERP company."""
              company_id = str(company_id)
              legacy_id = ensure_instance_id()
              now = datetime.now(timezone.utc)
              async with get_session_ctx() as session:
                  await _lock(session, connector)
                  rows = (await session.execute(
                      sa.select(ConnectorConfig).where(ConnectorConfig.connector == connector)
                  )).scalars().all()

                  others = [
                      row for row in rows
                      if str(row.company_id) not in {company_id, legacy_id}
                  ]
                  if others:
                      raise ConnectorOwnershipError(
                          f"{connector} is already owned by another company on this installation"
                      )

                  current = next((r for r in rows if str(r.company_id) == company_id), None)
                  legacy = next((r for r in rows if str(r.company_id) == legacy_id), None)

                  if current is not None and legacy is not None and current is not legacy:
                      _merge_compatible(current, legacy)
                      await session.delete(legacy)

                  if current is not None:
                      if current.claimed_at is None:
                          current.claimed_at = now
                      await session.commit()
                      return ClaimResult(current.id, False)

                  if legacy is not None:
                      # Explicit reassignment is a new operational cutover. Until activation
                      # completes, autonomous sync/webhook/outbound paths ignore this config.
                      legacy.company_id = company_id
                      legacy.claimed_at = now
                      legacy.activated_at = None
                      await session.commit()
                      await session.refresh(legacy)
                      return ClaimResult(legacy.id, False)

                  row = ConnectorConfig(
                      company_id=company_id,
                      connector=connector,
                      sync_frequency=_default_frequency(connector),
                      claimed_at=now,
                      activated_at=None,
                  )
                  session.add(row)
                  await session.commit()
                  await session.refresh(row)
                  return ClaimResult(row.id, True)


          async def activate_connector(company_id: str, connector: str) -> None:
              async with get_session_ctx() as session:
                  await _lock(session, connector)
                  row = await session.scalar(sa.select(ConnectorConfig).where(
                      ConnectorConfig.company_id == str(company_id),
                      ConnectorConfig.connector == connector,
                  ).limit(1))
                  if row is None:
                      raise ConnectorOwnershipError(f"{connector} is not owned by this company")
                  if row.activated_at is None:
                      row.activated_at = datetime.now(timezone.utc)
                      await session.commit()


          async def release_pending_claim(company_id: str, connector: str) -> None:
              async with get_session_ctx() as session:
                  await _lock(session, connector)
                  row = await session.scalar(sa.select(ConnectorConfig).where(
                      ConnectorConfig.company_id == str(company_id),
                      ConnectorConfig.connector == connector,
                  ).limit(1))
                  if row is not None and row.activated_at is None:
                      await session.delete(row)
                      await session.commit()


          async def delete_connector_config(company_id: str, connector: str) -> None:
              async with get_session_ctx() as session:
                  await _lock(session, connector)
                  await session.execute(sa.delete(ConnectorConfig).where(
                      ConnectorConfig.company_id == str(company_id),
                      ConnectorConfig.connector == connector,
                  ))
                  await session.commit()


          async def adopt_single_company_legacy_configs() -> None:
              """Adopt installation-scoped rows only when the database has one company."""
              legacy_id = ensure_instance_id()
              async with get_session_ctx() as session:
                  companies = (await session.execute(sa.select(Company.id).limit(2))).scalars().all()
              if len(companies) != 1:
                  return
              company_id = str(companies[0])
              if company_id == legacy_id:
                  return

              async with get_session_ctx() as session:
                  connectors = (await session.execute(
                      sa.select(ConnectorConfig.connector)
                      .where(ConnectorConfig.company_id == legacy_id)
                      .distinct()
                  )).scalars().all()

              for connector in connectors:
                  try:
                      async with get_session_ctx() as session:
                          await _lock(session, connector)
                          legacy = await session.scalar(sa.select(ConnectorConfig).where(
                              ConnectorConfig.company_id == legacy_id,
                              ConnectorConfig.connector == connector,
                          ).limit(1))
                          if legacy is None:
                              continue
                          current = await session.scalar(sa.select(ConnectorConfig).where(
                              ConnectorConfig.company_id == company_id,
                              ConnectorConfig.connector == connector,
                          ).limit(1))
                          if current is None:
                              legacy.company_id = company_id
                          else:
                              _merge_compatible(current, legacy)
                              await session.delete(legacy)
                          await session.commit()
                  except ConnectorOwnershipError:
                      log.error(
                          "connector ownership adoption refused for %s: conflicting legacy state",
                          connector,
                          exc_info=True,
                      )
          '''.replace("          ", ""))

          write("celerp/connectors/operation_lock.py", r'''# Copyright (c) 2026 Noah Severs
          # SPDX-License-Identifier: BUSL-1.1
          """Cross-process serialization for one company's remote connector operations."""
          from __future__ import annotations

          from contextlib import asynccontextmanager

          from sqlalchemy import text

          from celerp.db import lifecycle_engine


          @asynccontextmanager
          async def connector_operation(company_id: str, connector: str, *, wait: bool = True):
              if lifecycle_engine.dialect.name != "postgresql":
                  yield True
                  return

              key = f"connector-op:{company_id}:{connector}"
              async with lifecycle_engine.connect() as conn:
                  if wait:
                      await conn.execute(
                          text("SELECT pg_advisory_lock(hashtextextended(:k, 0))"), {"k": key}
                      )
                      acquired = True
                  else:
                      acquired = bool(await conn.scalar(
                          text("SELECT pg_try_advisory_lock(hashtextextended(:k, 0))"), {"k": key}
                      ))
                  await conn.commit()
                  try:
                      yield acquired
                  finally:
                      if acquired:
                          await conn.execute(
                              text("SELECT pg_advisory_unlock(hashtextextended(:k, 0))"), {"k": key}
                          )
                          await conn.commit()
          '''.replace("          ", ""))

          write("celerp/services/inventory_allocation.py", r'''# Copyright (c) 2026 Noah Severs
          # SPDX-License-Identifier: BUSL-1.1
          """Serialization for customer-stock allocation decisions."""
          from __future__ import annotations

          from sqlalchemy import text


          async def lock_sales_allocation(session, company_id) -> None:
              """Serialize reserve/fulfill availability checks for one company.

              Cross-lot picks can touch several same-SKU parcels. A single short
              transaction lock avoids AB/BA lot-lock ordering and makes validation
              plus reservation/fulfillment one atomic allocation decision.
              """
              await session.execute(
                  text("SELECT pg_advisory_xact_lock(hashtextextended(:k, 0))"),
                  {"k": f"sales-allocation:{company_id}"},
              )
          '''.replace("          ", ""))

          # Migration follows the rebased branch's actual Alembic head.
          versions = list((ROOT / "celerp/migrations/versions").glob("*.py"))
          revs, downs = {}, set()
          for p in versions:
              s = p.read_text()
              m = re.search(r'^revision\s*=\s*["\']([^"\']+)["\']', s, re.M)
              if not m:
                  continue
              revs[m.group(1)] = p
              d = re.search(r'^down_revision\s*=\s*["\']([^"\']+)["\']', s, re.M)
              if d:
                  downs.add(d.group(1))
          heads = sorted(set(revs) - downs)
          if len(heads) != 1:
              raise SystemExit(f"expected one Alembic head, got {heads}")
          down = heads[0]
          mig = ROOT / "celerp/migrations/versions/c0d1e2f3a4b5_connector_ownership_lifecycle.py"
          mig.write_text(f'''# Copyright (c) 2026 Noah Severs
          # SPDX-License-Identifier: BUSL-1.1
          """Add connector ownership lifecycle timestamps.

          Revision ID: c0d1e2f3a4b5
          Revises: {down}
          Create Date: 2026-09-22
          """
          from __future__ import annotations

          import sqlalchemy as sa
          from alembic import op

          revision = "c0d1e2f3a4b5"
          down_revision = "{down}"
          branch_labels = None
          depends_on = None


          def upgrade() -> None:
              op.add_column(
                  "connector_configs",
                  sa.Column(
                      "claimed_at", sa.DateTime(timezone=True), nullable=False,
                      server_default=sa.func.now(),
                  ),
              )
              op.add_column(
                  "connector_configs",
                  sa.Column("activated_at", sa.DateTime(timezone=True), nullable=True),
              )
              op.execute("UPDATE connector_configs SET activated_at = claimed_at WHERE activated_at IS NULL")


          def downgrade() -> None:
              op.drop_column("connector_configs", "activated_at")
              op.drop_column("connector_configs", "claimed_at")
          '''.replace("          ", ""))

          # ------------------------------------------------------------------
          # Connector runner: one operation lease; SyncRun remains audit only.
          # ------------------------------------------------------------------
          path = "celerp/connectors/sync_runner.py"
          rep(path, "from datetime import datetime, timedelta, timezone", "from datetime import datetime, timezone")
          rep(
              path,
              "from celerp.models.sync_run import SyncRun\n",
              "from celerp.models.sync_run import SyncRun\nfrom celerp.connectors.operation_lock import connector_operation\n",
          )
          between(
              path,
              "async def run_connector_sync(",
              "async def _last_success_watermark",
              '''async def run_connector_sync(
              connector: ConnectorBase,
              ctx: ConnectorContext,
              direction: SyncDirection,
          ) -> list[SyncResult]:
              """Execute one complete connector plan under a cross-process operation lease."""
              async with connector_operation(ctx.company_id, connector.name):
                  return [
                      await run_sync(
                          connector, ctx, entity, direction=direction, _operation_locked=True
                      )
                      for entity in sync_plan(connector, direction)
                  ]


          async def run_activation_sync(
              connector: ConnectorBase,
              ctx: ConnectorContext,
          ) -> list[SyncResult]:
              """Pull-only activation, then expose autonomous operation and close the order gap."""
              from celerp.connectors.ownership import activate_connector, get_company_config

              async with connector_operation(ctx.company_id, connector.name):
                  config = await get_company_config(ctx.company_id, connector.name)
                  if config is None:
                      raise RuntimeError(f"{connector.name} is not owned by this company")
                  results = [
                      await run_sync(
                          connector, ctx, entity, direction=SyncDirection.INBOUND,
                          _operation_locked=True,
                      )
                      for entity in sync_plan(connector, SyncDirection.INBOUND)
                  ]
                  healthy = any(
                      (not result.errors) or result.created or result.updated
                      for result in results
                  )
                  if not healthy and results:
                      return results

                  # Mark active before the final order catch-up. A webhook that arrives
                  # after this point sees an active owner and blocks on this same lease,
                  # so it cannot disappear into the activation handoff gap.
                  await activate_connector(ctx.company_id, connector.name)
                  if SyncEntity.ORDERS in connector.supported_entities:
                      results.append(await run_sync(
                          connector, ctx, SyncEntity.ORDERS.value,
                          direction=SyncDirection.INBOUND, _operation_locked=True,
                      ))
                  return results


          async def _last_success_watermark''',
          )
          between(
              path,
              "# Concurrency guard:",
              "async def _finish_run",
              '''async def _begin_run(company_id: str, connector: str, entity: str, direction_str: str, started_at):
              """Start an audited run, closing any row left unfinished by a dead process."""
              import sqlalchemy as sa

              from celerp.db import get_session_ctx

              try:
                  async with get_session_ctx() as session:
                      await session.execute(
                          sa.text("SELECT pg_advisory_xact_lock(hashtextextended(:k, 0))"),
                          {"k": f"sync-run:{company_id}:{connector}:{entity}"},
                      )
                      await session.execute(
                          sa.update(SyncRun)
                          .where(
                              SyncRun.company_id == company_id,
                              SyncRun.connector == connector,
                              SyncRun.entity == entity,
                              SyncRun.finished_at.is_(None),
                          )
                          .values(
                              finished_at=started_at,
                              status="failed",
                              errors_json=json.dumps(["Interrupted before completion"]),
                          )
                      )
                      run = SyncRun(
                          company_id=company_id, connector=connector, entity=entity,
                          direction=direction_str, started_at=started_at, finished_at=None,
                          created_count=0, updated_count=0, skipped_count=0,
                          errors_json=None, status="running",
                      )
                      session.add(run)
                      await session.commit()
                      await session.refresh(run)
                      return run.id
              except Exception as exc:
                  log.warning("Failed to record in-progress SyncRun: %s", exc)
                  return None


          async def _finish_run''',
          )
          rep(
              path,
              "    direction: SyncDirection | None = None,\n) -> SyncResult:",
              "    direction: SyncDirection | None = None,\n    _operation_locked: bool = False,\n) -> SyncResult:",
          )
          rep(
              path,
              '    # Direction gate\n',
              '    if not _operation_locked:\n'
              '        async with connector_operation(ctx.company_id, connector.name):\n'
              '            return await run_sync(\n'
              '                connector, ctx, entity, since=since, direction=direction,\n'
              '                _operation_locked=True,\n'
              '            )\n\n'
              '    # Direction gate\n',
          )
          # Any old per-entity busy branch is obsolete under the connector operation lease.
          text = read(path)
          text = re.sub(
              r'\n    if run_id == _BUSY:\n        return SyncResult\([\s\S]*?\n        \)\n',
              "\n",
              text,
              count=1,
          )
          write(path, text)

          # ------------------------------------------------------------------
          # Queue: only Woo inventory work, active owner only, shared operation lease.
          # ------------------------------------------------------------------
          path = "celerp/connectors/outbound_queue.py"
          text = read(path)
          text = text.replace("from celerp.models.company import Company\n", "")
          start = text.index("async def adopt_single_company_legacy_configs()")
          end = text.index("async def enqueue_item_change", start)
          text = text[:start] + text[end:]
          text = text.replace(
              "            ConnectorConfig.direction.in_([\n"
              "                SyncDirection.OUTBOUND.value, SyncDirection.BOTH.value\n"
              "            ]),\n",
              "            ConnectorConfig.direction.in_([\n"
              "                SyncDirection.OUTBOUND.value, SyncDirection.BOTH.value\n"
              "            ]),\n"
              "            ConnectorConfig.activated_at.is_not(None),\n",
              1,
          )
          pstart = text.index("async def process_outbound_queue_once")
          pend = text.index("async def outbound_queue_loop", pstart)
          new_process = '''async def process_outbound_queue_once(limit: int = 100) -> int:
              """Drain Woo inventory work without allowing stale remote writes to overtake fresh ones."""
              from celerp.connectors.operation_lock import connector_operation

              now = datetime.now(timezone.utc)
              async with get_session_ctx() as session:
                  rows = (await session.execute(
                      sa.select(OutboundQueue)
                      .where(
                          OutboundQueue.connector == "woocommerce",
                          OutboundQueue.entity_type == "inventory",
                          OutboundQueue.status == "pending",
                          sa.or_(
                              OutboundQueue.next_retry_at.is_(None),
                              OutboundQueue.next_retry_at <= now,
                          ),
                      )
                      .order_by(OutboundQueue.id)
                      .limit(limit)
                  )).scalars().all()

              identities = list(dict.fromkeys(
                  (row.company_id, row.connector, row.entity_id) for row in rows
              ))
              processed = 0

              for company_id, connector_name, identity in identities:
                  async with connector_operation(company_id, connector_name, wait=False) as acquired:
                      if not acquired:
                          continue

                      async with get_session_ctx() as session:
                          locked_rows = (await session.execute(
                              sa.select(OutboundQueue)
                              .where(
                                  OutboundQueue.company_id == company_id,
                                  OutboundQueue.connector == "woocommerce",
                                  OutboundQueue.entity_type == "inventory",
                                  OutboundQueue.entity_id == identity,
                                  OutboundQueue.status == "pending",
                                  sa.or_(
                                      OutboundQueue.next_retry_at.is_(None),
                                      OutboundQueue.next_retry_at <= datetime.now(timezone.utc),
                                  ),
                              )
                              .order_by(OutboundQueue.id)
                          )).scalars().all()
                          if not locked_rows:
                              continue
                          ids = [row.id for row in locked_rows]
                          config = await session.scalar(
                              sa.select(ConnectorConfig).where(
                                  ConnectorConfig.company_id == company_id,
                                  ConnectorConfig.connector == connector_name,
                                  ConnectorConfig.activated_at.is_not(None),
                              ).limit(1)
                          )
                          if config is None or config.direction == SyncDirection.INBOUND.value:
                              await session.execute(sa.delete(OutboundQueue).where(OutboundQueue.id.in_(ids)))
                              await session.commit()
                              processed += len(ids)
                              continue

                      try:
                          from celerp.connectors.registry import get as get_connector
                          from celerp.connectors.relay_token import fetch_context

                          ctx = await fetch_context(company_id, connector_name)
                          if ctx is None:
                              raise RuntimeError("connector credentials are temporarily unavailable")
                          connector = get_connector(connector_name)
                          result = await connector.sync_inventory_identity_out(ctx, identity)
                          if result.errors:
                              raise RuntimeError("; ".join(result.errors))
                          async with get_session_ctx() as session:
                              await session.execute(sa.delete(OutboundQueue).where(OutboundQueue.id.in_(ids)))
                              await session.commit()
                      except Exception as exc:
                          retry_now = datetime.now(timezone.utc)
                          async with get_session_ctx() as session:
                              retry_rows = (await session.execute(
                                  sa.select(OutboundQueue).where(OutboundQueue.id.in_(ids))
                              )).scalars().all()
                              for row in retry_rows:
                                  row.retry_count += 1
                                  delay = min(3600, 5 * (2 ** min(row.retry_count, 9)))
                                  row.next_retry_at = retry_now + timedelta(seconds=delay)
                                  row.error_message = str(exc)[:2000]
                                  row.status = "pending"
                              await session.commit()

                      processed += len(ids)
              return processed


          '''
          text = text[:pstart] + new_process.replace("          ", "") + text[pend:]
          write(path, text)

          # Scheduler sees only activated connector owners.
          path = "celerp/connectors/daily_scheduler.py"
          rep(
              path,
              "                ConnectorConfig.company_id == company_id,\n            )",
              "                ConnectorConfig.company_id == company_id,\n"
              "                ConnectorConfig.activated_at.is_not(None),\n"
              "            )",
          )
          rep(
              path,
              "rows = await session.execute(sa.select(ConnectorConfig.company_id).distinct())",
              "rows = await session.execute(\n"
              "            sa.select(ConnectorConfig.company_id)\n"
              "            .where(ConnectorConfig.activated_at.is_not(None))\n"
              "            .distinct()\n"
              "        )",
          )

          # ------------------------------------------------------------------
          # API credential boundary owns claim/revoke semantics.
          # ------------------------------------------------------------------
          path = "default_modules/celerp-connectors/celerp_connectors/routes.py"
          rep(
              path,
