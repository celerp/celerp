name: PR340 Integration Check

on:
  push:
    branches: [pr340-integration-check]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: celerp
          POSTGRES_PASSWORD: celerp
          POSTGRES_DB: celerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ALLOW_INSECURE_JWT: "true"
      DATABASE_URL: postgresql+asyncpg://celerp:celerp@localhost:5432/celerp_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout exact PR head
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Noah Severs"
          git config user.email "118095044+ngsevers@users.noreply.github.com"
          git fetch --no-tags origin woocommerce-sync-integrity
          test "$(git rev-parse origin/woocommerce-sync-integrity)" = "206bb807d325a848cd6542d4965d0366eefcc845"
          cp scripts/pr340_harden.py /tmp/pr340_harden.py
          git checkout --detach 206bb807d325a848cd6542d4965d0366eefcc845

      - name: Apply connector hardening
        shell: bash
        env:
          DOWN_REVISION: z9a0b1c2d3e4
        run: |
          set -euo pipefail
          python /tmp/pr340_harden.py
          python -m compileall -q celerp default_modules/celerp-connectors default_modules/celerp-docs default_modules/celerp-inventory ui
          python scripts/gen_first_party_lock.py

      - name: Install test dependencies
        run: pip install uv && uv pip install --system -e ".[dev]" pytest-xdist pytest-split

      - name: Focused hardening tests
        run: >
          pytest -q --tb=short --no-cov --timeout=30
          tests/test_connector_hardening_contract.py
          tests/test_services/test_sync_runner_lifecycle.py
          tests/test_services/test_outbound_queue.py
          tests/test_woocommerce_sync_guards.py
          tests/test_connectors_status.py
          default_modules/celerp-connectors/tests/test_connectors.py
          tests/test_routers/test_doc_workflows.py

      - name: Full non-browser suite
        run: >
          timeout 1200 pytest tests/ default_modules/*/tests/ -n auto -q --tb=short --no-cov
          --timeout=30
          --ignore=tests/test_visual.py
          --ignore=tests/test_browser

      - name: Commit and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git add -A
          git commit -m "Harden connector ownership and synchronization boundaries"
          git push --force-with-lease=refs/heads/pr340-safety-candidate-v2: origin HEAD:refs/heads/pr340-safety-candidate-v2
          git rev-parse HEAD
