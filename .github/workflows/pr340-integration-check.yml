          rep(path, old, new, 1)

          # Basic compile-time contract tests for the new owning boundaries.
          write("tests/test_connector_hardening_contract.py", r'''from pathlib import Path


          ROOT = Path(__file__).resolve().parents[1]


          def _text(path: str) -> str:
              return (ROOT / path).read_text()


          def test_connector_config_has_claim_and_activation_lifecycle():
              source = _text("celerp/models/connector_config.py")
              assert "claimed_at" in source
              assert "activated_at" in source


          def test_woo_product_pull_does_not_seed_operational_stock():
              source = _text("celerp/connectors/woocommerce.py")
              assert "seed_quantity=False" in source
              assert "params[\"after\"] = cutoff_at.isoformat()" in source


          def test_remote_connector_work_uses_one_operation_lease():
              runner = _text("celerp/connectors/sync_runner.py")
              queue = _text("celerp/connectors/outbound_queue.py")
              assert "connector_operation(ctx.company_id, connector.name)" in runner
              assert "connector_operation(company_id, connector_name, wait=False)" in queue


          def test_sales_reserve_and_fulfill_share_allocation_lock():
              routes = _text("default_modules/celerp-docs/celerp_docs/routes.py")
              assert routes.count("await lock_sales_allocation(") >= 2
          '''.replace("          ", ""))

          PY
          python /tmp/pr340_harden.py
          python -m compileall -q celerp default_modules/celerp-connectors default_modules/celerp-docs default_modules/celerp-inventory ui
          python scripts/gen_first_party_lock.py

      - name: Install test dependencies
        run: pip install uv && uv pip install --system -e ".[dev]" pytest-xdist pytest-split

      - name: Focused hardening tests
        run: >
          pytest -q --tb=short --no-cov --timeout=30
          tests/test_connector_hardening_contract.py
          tests/test_services/test_sync_runner_lifecycle.py
          tests/test_services/test_outbound_queue.py
          tests/test_woocommerce_sync_guards.py
          tests/test_connectors_status.py
          default_modules/celerp-connectors/tests/test_connectors.py
          tests/test_routers/test_doc_workflows.py

      - name: Full non-browser suite
        run: >
          timeout 1200 pytest tests/ default_modules/*/tests/ -n auto -q --tb=short --no-cov
          --timeout=30
          --ignore=tests/test_visual.py
          --ignore=tests/test_browser

      - name: Commit and publish candidate
        shell: bash
        run: |
          set -euo pipefail
          git status --short
          git add -A
          git commit -m "Harden connector ownership and synchronization boundaries"
          git push origin HEAD:refs/heads/pr340-hardened-candidate
          git rev-parse HEAD
