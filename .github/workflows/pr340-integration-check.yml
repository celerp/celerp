              "    async def _ensure_product_link_locked(self, ctx: ConnectorContext, entity_id: str, actor_id=None) -> str:\n",
              1,
          )
          # Permanent creation-time cutover layered with incremental modified watermark.
          marker = "        params: dict = {}\n        if since:\n"
          cutoff = '''        params: dict = {}
                  from celerp.connectors.ownership import get_company_config
                  config = await get_company_config(ctx.company_id, self.name)
                  if config is None:
                      result.errors = ["WooCommerce connector ownership is not configured"]
                      return result
                  cutoff_at = config.claimed_at
                  if cutoff_at:
                      params["after"] = cutoff_at.isoformat()
                      params["dates_are_gmt"] = "true"
                  if since:
          '''.replace("          ", "")
          if marker not in text[text.index("async def sync_orders"):]:
              raise SystemExit("woocommerce.py: sync_orders params marker not found")
          oi = text.index("async def sync_orders")
          mi = text.index(marker, oi)
          text = text[:mi] + cutoff + text[mi + len(marker):]
          # Defensive local check in case the remote API ignores/changes date filtering.
          order_loop = "        for order in orders:\n            try:\n"
          defensive = '''        for order in orders:
                  try:
                      if cutoff_at:
                          raw_created = order.get("date_created_gmt") or order.get("date_created")
                          if not raw_created:
                              raise ValueError("WooCommerce order is missing its creation timestamp")
                          created_at = datetime.fromisoformat(str(raw_created).replace("Z", "+00:00"))
                          if created_at.tzinfo is None:
                              created_at = created_at.replace(tzinfo=timezone.utc)
                          if created_at < cutoff_at:
                              result.skipped += 1
                              continue
          '''.replace("          ", "")
          idx = text.index(order_loop, oi)
          text = text[:idx] + defensive + text[idx + len(order_loop):]

          # Webhook registration converges by an installation-specific remote name.
          rs = text.index("    async def register_webhooks(")
          re_ = text.index("    async def deregister_webhooks(", rs)
          de = text.find("\n    async def ", re_ + 10)
          if de < 0:
              de = len(text)
          hooks = '''    async def register_webhooks(
                  self, ctx: ConnectorContext, webhook_url: str, secret: str | None = None
              ) -> list[str]:
                  """Converge this installation's WooCommerce webhook set."""
                  from celerp.config import ensure_instance_id

                  base_url = _base_url(ctx)
                  auth = _auth(ctx)
                  prefix = f"Celerp {ensure_instance_id()} "
                  existing = await self._paginate(ctx, "/webhooks")
                  owned_ids = [
                      str(hook.get("id"))
                      for hook in existing
                      if str(hook.get("name") or "").startswith(prefix)
                      and str(hook.get("delivery_url") or "").rstrip("/") == webhook_url.rstrip("/")
                      and hook.get("id") not in (None, "")
                  ]
                  async with RateLimitedClient() as client:
                      for webhook_id in owned_ids:
                          cleanup = await client.delete(
                              f"{base_url}/webhooks/{webhook_id}", auth=auth, params={"force": "true"}
                          )
                          if cleanup.status_code not in (200, 204, 404):
                              raise RuntimeError(
                                  f"WooCommerce webhook cleanup failed for {webhook_id}: HTTP {cleanup.status_code}"
                              )

                      ids: list[str] = []
                      try:
                          for topic in self._WEBHOOK_TOPICS:
                              body = {
                                  "name": f"{prefix}{topic}",
                                  "topic": topic,
                                  "delivery_url": webhook_url,
                                  "status": "active",
                              }
                              if secret:
                                  body["secret"] = secret
                              resp = await client.post(f"{base_url}/webhooks", auth=auth, json=body)
                              resp.raise_for_status()
                              webhook_id = str(resp.json().get("id") or "")
                              if not webhook_id:
                                  raise RuntimeError(f"WooCommerce did not return a webhook id for {topic}")
                              ids.append(webhook_id)
                      except Exception:
                          for webhook_id in reversed(ids):
                              try:
                                  await client.delete(
                                      f"{base_url}/webhooks/{webhook_id}",
                                      auth=auth, params={"force": "true"},
                                  )
                              except Exception:
                                  log.warning("woocommerce webhook rollback failed id=%s", webhook_id, exc_info=True)
                          raise
                  return ids

              async def deregister_webhooks(
                  self, ctx: ConnectorContext, webhook_ids: list[str],
                  webhook_url: str | None = None,
              ) -> None:
                  """Delete cached IDs plus any discoverable hooks owned by this installation."""
                  from celerp.config import ensure_instance_id

                  base_url = _base_url(ctx)
                  auth = _auth(ctx)
                  ids = {str(x) for x in webhook_ids if x}
                  prefix = f"Celerp {ensure_instance_id()} "
                  try:
                      existing = await self._paginate(ctx, "/webhooks")
                  except Exception as exc:
                      raise RuntimeError(f"WooCommerce webhook discovery failed: {exc}") from exc
                  for hook in existing:
                      if not str(hook.get("name") or "").startswith(prefix):
                          continue
                      if webhook_url and str(hook.get("delivery_url") or "").rstrip("/") != webhook_url.rstrip("/"):
                          continue
                      if hook.get("id") not in (None, ""):
                          ids.add(str(hook["id"]))

                  errors: list[str] = []
                  async with RateLimitedClient() as client:
                      for webhook_id in sorted(ids):
                          try:
                              resp = await client.delete(
                                  f"{base_url}/webhooks/{webhook_id}",
                                  auth=auth, params={"force": "true"},
                              )
                              if resp.status_code not in (200, 204, 404):
                                  errors.append(f"{webhook_id}: HTTP {resp.status_code}")
                          except Exception as exc:
                              errors.append(f"{webhook_id}: {exc}")
                  if errors:
                      raise RuntimeError("WooCommerce webhook cleanup failed: " + "; ".join(errors))
          '''.replace("          ", "")
          text = text[:rs] + hooks + text[de:]
          write(path, text)

          # ------------------------------------------------------------------
          # External identity is unique and live identities cannot be silently rebound by SKU.
          # ------------------------------------------------------------------
          path = "default_modules/celerp-inventory/celerp_inventory/services.py"
          rep(
              path,
              "    if len(candidates) == 1:\n        return candidates[0]\n",
              "    if len(candidates) == 1:\n"
              "        candidate = candidates[0]\n"
              "        current = external_link_for_state(candidate.state or {}, platform)\n"
              "        if current and not deleted_external_link_may_relink(current):\n"
              "            raise ValueError(\n"
              "                f\"SKU {sku!r} is already linked to a different live {platform} identity\"\n"
              "            )\n"
              "        return candidate\n",
              1,
          )
          rep(
              path,
              '    lock_key = f"external-product:{cid}:{identity}"\n',
              '    lock_key = f"external-link:{cid}:{platform}:{product_id}:{variation_id or \'\'}"\n',
              1,
          )
          # Serialize all link writers on the same external identity and reject duplicate owners.
          marker = '    cid = uuid.UUID(str(company_id))\n    row = await session.get(Projection, {"company_id": cid, "entity_id": entity_id}, with_for_update=True)\n'
          replacement = '''    cid = uuid.UUID(str(company_id))
              normalized = dict(link)
              normalized["product_id"] = str(normalized["product_id"])
              if normalized.get("variation_id") not in (None, ""):
                  normalized["variation_id"] = str(normalized["variation_id"])
              await session.execute(
                  text("SELECT pg_advisory_xact_lock(hashtextextended(:k, 0))"),
                  {"k": f"external-link:{cid}:{platform}:{normalized['product_id']}:{normalized.get('variation_id') or ''}"},
              )
              rows = (await session.execute(select(Projection).where(
                  Projection.company_id == cid, Projection.entity_type == "item"
              ))).scalars().all()
              for owner in rows:
                  if owner.entity_id == entity_id:
                      continue
                  existing = external_link_for_state(owner.state or {}, platform)
                  if (
                      existing
                      and str(existing.get("product_id") or "") == normalized["product_id"]
                      and str(existing.get("variation_id") or "") == str(normalized.get("variation_id") or "")
                      and existing.get("remote_deleted") is not True
                  ):
                      raise ValueError(
                          f"{platform} product identity is already linked to item {owner.entity_id}"
                      )
              row = await session.get(
                  Projection, {"company_id": cid, "entity_id": entity_id}, with_for_update=True
              )
          '''.replace("          ", "")
          if marker not in read(path):
              raise SystemExit("inventory services: set_external_link marker not found")
          rep(path, marker, replacement, 1)
          # Remove the now-duplicated normalization later in set_external_link.
          text = read(path)
          segment_start = text.index("async def set_external_link(")
          segment_end = text.index("async def resolve_catalog_anchor_for_item", segment_start)
          segment = text[segment_start:segment_end]
          dup = '''    normalized = dict(link)
              normalized["product_id"] = str(normalized["product_id"])
              if normalized.get("variation_id") not in (None, ""):
                  normalized["variation_id"] = str(normalized["variation_id"])
          '''.replace("          ", "")
          # Keep only the first normalization block.
          first = segment.find(dup)
          second = segment.find(dup, first + len(dup))
          if second >= 0:
              segment = segment[:second] + segment[second + len(dup):]
              text = text[:segment_start] + segment + text[segment_end:]
          write(path, text)

          # ------------------------------------------------------------------
          # Woo order compatibility + immutable operational snapshot.
          # ------------------------------------------------------------------
          path = "default_modules/celerp-docs/celerp_docs/doc_service.py"
          rep(
              path,
              '    encoded = json.dumps(payload, sort_keys=True, separators=(",", ":"), default=str)\n',
              '    payload["customer_id"] = str(order.get("customer_id") or "")\n'
              '    payload["billing"] = order.get("billing") or {}\n'
              '    payload["shipping_address"] = order.get("shipping") or {}\n'
              '    encoded = json.dumps(payload, sort_keys=True, separators=(",", ":"), default=str)\n',
              1,
          )
          # Legacy informational imports are never auto-promoted into accounting/inventory.
          marker = '''        if existing is not None and existing.entity_type != "doc":
                  raise ValueError(f"WooCommerce order identity collides with {existing.entity_type}")

          '''
          repl = marker + '''        if existing is not None and not (existing.state or {}).get("woocommerce_source_fingerprint"):
                  return "noop"

          '''
          rep(path, marker, repl, 1)
          # Distinct free-text Woo line IDs must not collapse together.
          text = read(path)
          old = '''                key = (
                      str(li.get("product_id") or ""),
                      str(li.get("variation_id") or ""),
                      str(li.get("sku") or "").strip().casefold(),
                  )
          '''.replace("          ", "")
          new = '''                product_key = str(li.get("product_id") or "")
                  sku_key = str(li.get("sku") or "").strip().casefold()
                  key = (
                      product_key,
                      str(li.get("variation_id") or ""),
                      sku_key,
                      str(li.get("id") or "") if not product_key and not sku_key else "",
                  )
          '''.replace("          ", "")
          if old not in text:
              raise SystemExit("doc_service.py: Woo grouping key not found")
          text = text.replace(old, new, 1)
          # Completed issuance may not regress silently to processing.
          needle = '            if wc_status in {"cancelled", "failed", "refunded"}:\n'
          insert = '''            previous_wc_status = str((existing.state or {}).get("woocommerce_status") or "").lower()
                  if previous_wc_status == "completed" and wc_status != "completed":
                      raise ValueError(
                          f"WooCommerce order {order.get('number') or order_id} regressed from "
                          f"completed to {wc_status!r}; manual reconciliation is required"
                      )
          '''.replace("          ", "")
          idx = text.index(needle, text.index("async def upsert_order_from_woocommerce"))
          text = text[:idx] + insert + text[idx:]
          # Preserve old payment guard if PR broadened it.
          text = text.replace(
              'if order.get("date_paid"):',
              'if order.get("date_paid") and not order.get("needs_payment", False):',
              1,
          )
          # Reuse the document payment owner resolver rather than another owner query.
          pattern = re.compile(
              r'\s*owner_id = await session\.scalar\(\s*select\(UserCompany\.user_id\)[\s\S]*?\)\s*\n\s*if owner_id is None:',
              re.M,
          )
          m = pattern.search(text)
          if m:
              replacement = (
                  '\n            from celerp_docs.routes_payments import _company_owner_id\n'
                  '            owner_id = await _company_owner_id(session, cid)\n'
                  '            if owner_id is None:'
              )
              text = text[:m.start()] + replacement + text[m.end():]
          write(path, text)

          # Active owners only for automated document attribution.
          path = "default_modules/celerp-docs/celerp_docs/routes_payments.py"
          rep(
              path,
              '            UserCompany.company_id == company_id, UserCompany.role == "owner")',
              '            UserCompany.company_id == company_id,\n'
              '            UserCompany.role == "owner", UserCompany.is_active.is_(True))',
              1,
          )

          # Canonical customer-stock allocation decision lock.
          path = "default_modules/celerp-docs/celerp_docs/routes.py"
          text = read(path)
          reserve = text.index("async def _reserve_lines_impl")
          marker = '    unit_map = await _get_unit_map(session, row.company_id)\n'
          idx = text.index(marker, reserve)
          text = (
              text[:idx]
              + '    from celerp.services.inventory_allocation import lock_sales_allocation\n'
                '    await lock_sales_allocation(session, row.company_id)\n'
              + text[idx:]
          )
          fulfill = text.index("async def _fulfill_lines_impl")
          marker2 = '    _unit_map = await _get_unit_map(session, company_id)\n'
          idx2 = text.index(marker2, fulfill)
          text = (
              text[:idx2]
              + '    from celerp.services.inventory_allocation import lock_sales_allocation\n'
                '    await lock_sales_allocation(session, company_id)\n'
              + text[idx2:]
          )
          write(path, text)

          # Startup adoption is fail-closed but never a boot killer.
          path = "celerp/main.py"
          old = '''    from celerp.connectors.outbound_queue import (
                  adopt_single_company_legacy_configs,
                  outbound_queue_loop,
              )
              await adopt_single_company_legacy_configs()
              outbound_connector_task = asyncio.create_task(outbound_queue_loop())
          '''.replace("          ", "")
          new = '''    from celerp.connectors.ownership import adopt_single_company_legacy_configs
              from celerp.connectors.outbound_queue import outbound_queue_loop
              try:
                  await adopt_single_company_legacy_configs()
              except Exception:
