name: Validate PR341 hardening
on:
  pull_request:
    branches: [review/recovery-pr341-20260922]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: celerp
          POSTGRES_PASSWORD: celerp
          POSTGRES_DB: celerp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ALLOW_INSECURE_JWT: "true"
      DATABASE_URL: postgresql+asyncpg://celerp:celerp@localhost:5432/celerp_test
      EXPECTED_OLD: ba9353680904bbfa5ce4a51b3e4a2f6ea1ca0388
      TARGET_BRANCH: connect-identity-convergence-20260922
      STAGING_BRANCH: review/validated-pr341-20260922
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Reconstruct exact source change
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d | gzip -d > /tmp/apply.py
          git fetch --no-tags origin "$TARGET_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$EXPECTED_OLD"
          git checkout --detach "$EXPECTED_OLD"
          python /tmp/apply.py
          git diff --check
          python -m compileall -q             celerp/gateway/__init__.py celerp/gateway/client.py celerp/gateway/state.py             celerp/services/cloud_entitlement.py celerp/routers/health.py celerp/main.py             tests/test_connect_state_recovery.py             tests/test_gateway/test_reconnect_rebuild.py             tests/test_gateway/test_proxy_lifecycle.py
      - name: Install dependencies
        run: pip install uv && uv pip install --system -e ".[dev]" pytest-xdist pytest-split
      - name: Focused regressions
        run: >-
          pytest -q --no-cov --tb=short
          tests/test_connect_state_recovery.py
          tests/test_gateway/test_reconnect_rebuild.py
          tests/test_gateway/test_client.py
          tests/test_gateway/test_proxy_lifecycle.py
          tests/test_gateway/test_commercial_context.py
          tests/test_gateway/test_deployment_bootstrap.py
          tests/test_gateway/test_feature_flags_state.py
          tests/test_routers/test_cloud_relay.py
          tests/test_main.py
      - name: Create clean validated commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Noah Severs"
          git config user.email "118095044+ngsevers@users.noreply.github.com"
          git add             celerp/gateway/__init__.py celerp/gateway/client.py celerp/gateway/state.py             celerp/services/cloud_entitlement.py celerp/routers/health.py celerp/main.py             tests/test_connect_state_recovery.py             tests/test_gateway/test_reconnect_rebuild.py             tests/test_gateway/test_client.py             tests/test_gateway/test_proxy_lifecycle.py             tests/test_gateway/test_commercial_context.py             tests/test_gateway/test_deployment_bootstrap.py
          test -n "$(git diff --cached --name-only)"
          git commit -m "Centralize Connect runtime convergence"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_OLD"
          git diff --check "$EXPECTED_OLD"..HEAD
          git push --force origin HEAD:"refs/heads/$STAGING_BRANCH"
