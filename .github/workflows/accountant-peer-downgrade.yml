name: Accountant peer downgrade validation
on:
  push:
    branches: [accountant-peer-downgrade-validation-20261012]
permissions:
  contents: read
jobs:
  upgrade-downgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: celerp
          POSTGRES_PASSWORD: celerp
          POSTGRES_DB: celerp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://celerp:celerp@localhost:5432/celerp_test
      ALLOW_INSECURE_JWT: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install uv
          uv pip install --system -e '.[dev]' -c constraints.txt
      - name: Test migration graph and guarded rollback
        run: pytest -q tests/test_migrations/test_alembic_graph.py --no-cov --tb=short -x
