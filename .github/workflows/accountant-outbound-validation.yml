name: Accountant outbound contact validation
on:
  push:
    branches: [accountant-outbound-validation-20261012]
permissions:
  contents: write
  actions: write
jobs:
  peer:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: celerp
          POSTGRES_PASSWORD: celerp
          POSTGRES_DB: celerp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://celerp:celerp@localhost:5432/celerp_test
      ALLOW_INSECURE_JWT: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact outbound candidate
        run: |
          cp .github/accountant-outbound.patch.b64 /tmp/outbound.patch.b64
          base64 -d /tmp/outbound.patch.b64 > /tmp/outbound.patch.gz
          echo '9c323335952e0d232302e084bab2c20aeeb77c85edb63ef34172471be101da73  /tmp/outbound.patch.gz' | sha256sum -c -
          gzip -dc /tmp/outbound.patch.gz > /tmp/outbound.patch
          git switch --detach 308ed151d61be3a534aefc9d21a3bb51e362ee69
          git apply --check /tmp/outbound.patch
          git apply --index /tmp/outbound.patch
          git diff --cached --check
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -e '.[dev]' -c constraints.txt
      - name: Generate canonical module digest
        run: |
          python scripts/gen_first_party_lock.py
          git add default_modules/first_party.lock.json
          git diff --cached --check
      - name: Validate connector, scope and settings
        run: |
          python -m compileall -q celerp/connectors celerp/routers/company_peers.py ui/routes/settings_connectors.py
          pytest -q tests/test_celerp_peer_connector.py tests/test_company_peer_access.py tests/test_company_peer_identity.py tests/test_services/test_sync_runner_lifecycle.py tests/test_connector_route_writers.py tests/test_i18n_settings_connectors.py --no-cov --tb=short -x
      - name: Publish only validated outbound source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import subprocess
          expected = {
             'celerp/connectors/base.py',
             'celerp/connectors/celerp.py',
             'celerp/connectors/registry.py',
             'celerp/connectors/sync_runner.py',
             'celerp/routers/company_peers.py',
             'default_modules/celerp-connectors/celerp_connectors/routes.py',
             'default_modules/first_party.lock.json',
             'tests/test_celerp_peer_connector.py',
             'ui/routes/settings_connectors.py',
          }
          actual = set(subprocess.check_output(['git','diff','--cached','--name-only'],text=True).splitlines())
          assert actual == expected, (sorted(actual),sorted(expected))
          PY
          git config user.name 'Noah Severs'
          git config user.email '118095044+ngsevers@users.noreply.github.com'
          git commit -m 'Sync scoped accountant contacts through connector runner'
          target=refs/heads/accountant-company-handoff-20261011
          current="$(git ls-remote origin "$target" | cut -f1)"
          test "$current" = "308ed151d61be3a534aefc9d21a3bb51e362ee69" || { echo 'PR head moved; no publication'; exit 1; }
          git push origin "HEAD:$target"
          gh workflow run ci.yml --ref accountant-company-handoff-20261011
