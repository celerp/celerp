name: Accountant main integration validation
on:
  push:
    branches: [accountant-main-integration-20261012]
permissions:
  contents: write
  actions: write
jobs:
  merge-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge exact reviewed heads
        run: |
          git config user.name 'Noah Severs'
          git config user.email '118095044+ngsevers@users.noreply.github.com'
          git switch --detach b3f03c956d304b165ee0e65520a545f82c2c510f
          git merge --no-commit --no-ff 15d387ffbf102dd1640ec99aa5b676cb71052041 || {
            git status --short
            git diff --name-only --diff-filter=U
            exit 1
          }
          git diff --check
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test desktop startup paths
        run: |
          cd electron
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm exec jest --runInBand --forceExit tests/handoff-protocol.test.js tests/compatibility.test.js tests/api-wait.test.js
      - name: Publish verified integration merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git commit -m 'Integrate current startup changes'
          target=refs/heads/accountant-company-handoff-20261011
          actual="$(git ls-remote origin "$target" | cut -f1)"
          test "$actual" = 'b3f03c956d304b165ee0e65520a545f82c2c510f' || { echo 'PR moved'; exit 1; }
          current_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          test "$current_main" = '15d387ffbf102dd1640ec99aa5b676cb71052041' || { echo 'Base moved'; exit 1; }
          git push origin "HEAD:$target"
          gh workflow run ci.yml --ref accountant-company-handoff-20261011
