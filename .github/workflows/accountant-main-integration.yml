name: Validate accountant PR head
on:
  push:
    branches: [accountant-main-integration-20261012]
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Check exact PR head and launch normal validation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          target=accountant-company-handoff-20261011
          expected=eb6881ca6d4fee827bcee6a921e207ed2fe7a19b
          current="$(gh api repos/celerp/celerp/git/ref/heads/$target --jq '.object.sha')"
          test "$current" = "$expected" || { echo 'PR head moved, refusing stale validation'; exit 1; }
          gh workflow run ci.yml -R celerp/celerp --ref "$target"
          gh workflow run build.yml -R celerp/celerp --ref "$target"
