name: Subscription validation

on:
  push:
    branches: [fix/subscription-period-recovery]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: celerp
          POSTGRES_PASSWORD: celerp
          POSTGRES_DB: celerp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install dependencies
        run: pip install uv && uv pip install --system -e ".[dev]" pytest-xdist -c constraints.txt
      - name: Refresh module integrity lock
        run: |
          python scripts/gen_first_party_lock.py
          grep '"celerp-subscriptions"' default_modules/first_party.lock.json
      - name: Targeted regression suite
        env:
          ALLOW_INSECURE_JWT: "true"
          DATABASE_URL: postgresql+asyncpg://celerp:celerp@localhost:5432/celerp_test
        run: >
          pytest -n 2 -q --tb=short --no-cov
          tests/test_openapi_docs.py
          tests/test_migrations/test_alembic_graph.py
          tests/test_default_modules_boot.py
          default_modules/celerp-subscriptions/tests/test_periods.py
          default_modules/celerp-subscriptions/tests/test_subscriptions_ui.py
          tests/test_subscriptions_manual_generation.py
