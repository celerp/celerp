name: Subscription validation

on:
  push:
    branches: [fix/subscription-period-recovery]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: celerp
          POSTGRES_PASSWORD: celerp
          POSTGRES_DB: celerp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install dependencies
        run: pip install uv && uv pip install --system -e ".[dev]" pytest-xdist -c constraints.txt
      - name: Focused regression suite
        env:
          ALLOW_INSECURE_JWT: "true"
          DATABASE_URL: postgresql+asyncpg://celerp:celerp@localhost:5432/celerp_test
        run: >
          pytest -n 2 -q --tb=short --no-cov
          default_modules/celerp-subscriptions/tests/
          tests/test_company_backup_lifecycle.py
          tests/test_company_backup.py
          tests/test_email_service.py
          tests/test_periodic_dispatcher.py
          tests/test_role_permissions.py
          tests/test_subscriptions_manual_generation.py
          tests/test_i18n_subscriptions.py
          tests/test_one_unit.py
          tests/test_migrations/test_models_match_migrations.py
          tests/test_migrations/test_fresh_install_migrate.py
