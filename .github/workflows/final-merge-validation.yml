name: Export staged source

on:
  push:
    branches:
      - review/merge-validation-final

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export exact source
        shell: bash
        run: |
          set -euo pipefail
          git checkout --detach 4e310020efaf5e7d2a2b656940a3d5eb15363f80
          tar --exclude=.git -czf /tmp/app-staged-source.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: app-staged-source
          path: /tmp/app-staged-source.tar.gz
          retention-days: 1
