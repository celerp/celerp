name: Build final app candidate

on:
  push:
    branches:
      - review/merge-validation-final

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact #330 candidate
        shell: bash
        run: |
          set -euo pipefail
          cp .review/final-app330.patch.xz.b64 /tmp/patch.b64
          git checkout --detach c3695c8d6197edaa5a75797a592b3eed34512829
          base64 -d /tmp/patch.b64 | xz -dc | git apply
          git diff --check
          git config user.name "Noah Severs"
          git config user.email "118095044+ngsevers@users.noreply.github.com"
          git add -A
          git commit -m "Fix paid Connect entitlement recovery"
          git push --force origin HEAD:refs/heads/review/final-app330-candidate
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)"
