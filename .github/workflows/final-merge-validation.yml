name: Build final security cleanup

on:
  push:
    branches:
      - review/merge-validation-final

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build cleaned #331 tree
        shell: bash
        run: |
          set -euo pipefail
          cp .review/app331-ci-cleanup.patch.xz.b64 /tmp/p.b64
          git checkout --detach 654759f4016cde2ae1729e7b7bd9c4e870ce5efc
          base64 -d /tmp/p.b64 | xz -dc > /tmp/p.patch
          git apply /tmp/p.patch
          git diff --check
          python -m py_compile tests/test_ui.py
          git add tests/test_ui.py
          tree="$(git write-tree)"
          sha="$(printf '%s\n' 'test: remove obsolete Connect polling regressions' | git commit-tree "$tree" -p 654759f4016cde2ae1729e7b7bd9c4e870ce5efc -p 16b9327f0e083f8d466b8fb6e64bb6ff888dc232)"
          git push origin "$sha":refs/heads/review/final-app331-cleanup
          echo "candidate=$sha"
