name: Build final password-fixture correction

on:
  push:
    branches:
      - review/merge-validation-final

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build exact #331 follow-up
        shell: bash
        run: |
          set -euo pipefail
          cp .review/app331-password-fixture.patch.xz.b64 /tmp/p.b64
          git checkout review/final-app331-password
          base64 -d /tmp/p.b64 | xz -dc > /tmp/p.patch
          git apply /tmp/p.patch
          git diff --check
          python -m py_compile tests/test_routers/test_cloud_relay.py
          git config user.name "Noah Severs"
          git config user.email "118095044+ngsevers@users.noreply.github.com"
          git add tests/test_routers/test_cloud_relay.py
          git commit -m "Test cloud relay with valid password fixtures"
          git push origin HEAD:refs/heads/review/final-app331-password
          echo "candidate=$(git rev-parse HEAD)"
