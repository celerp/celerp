name: Export staged source

on:
  push:
    branches:
      - review/merge-validation-final

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Export exact committed tree
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=/tmp/app-staged-tree.tar.gz 4e310020efaf5e7d2a2b656940a3d5eb15363f80
      - uses: actions/upload-artifact@v4
        with:
          name: app-staged-tree
          path: /tmp/app-staged-tree.tar.gz
          retention-days: 1
