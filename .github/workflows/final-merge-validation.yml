name: Stage timeout regression

on:
  push:
    branches:
      - review/merge-validation-final

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add reviewed timeout test
        shell: bash
        run: |
          set -euo pipefail
          git checkout review/final-app330-timeout-test
          python - <<'PY'
          from pathlib import Path
          import subprocess

          name = "test_claim_timeout_explains_the_link_state"
          dst = Path("tests/test_ui.py")
          current = dst.read_text()
          source = subprocess.check_output(
              ["git", "show", "4e310020efaf5e7d2a2b656940a3d5eb15363f80:tests/test_ui.py"],
              text=True,
          )
          start = source.index("    @pytest.mark.asyncio\n    async def " + name)
          end = source.index("\n    @pytest.mark.asyncio\n    async def ", start + 1)
          block = source[start:end] + "\n"
          marker = "    @pytest.mark.asyncio\n    async def test_poll_reloads_web_access_page_once_relay_connects"
          if name in current or current.count(marker) != 1:
              raise SystemExit("unexpected test layout")
          dst.write_text(current.replace(marker, block + "\n" + marker))
          PY
          git diff --check
          python -m py_compile tests/test_ui.py
          git config user.name "Noah Severs"
          git config user.email "118095044+ngsevers@users.noreply.github.com"
          git add tests/test_ui.py
          git commit -m "Test Connect claim timeout guidance"
          git push origin HEAD:refs/heads/review/final-app330-timeout-test
