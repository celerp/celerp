name: Temporary PR340 base reconciliation

on:
  push:
    branches: [pr340-final-integrity-validation]

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect exact merge conflicts
        run: |
          set +e
          git config user.name "Noah Severs"
          git config user.email "118095044+ngsevers@users.noreply.github.com"
          git reset --hard 4704670a7c63847023f9c1937e7c93ce1aa7ba48
          git merge --no-commit --no-ff 370bd9725a62fea94a05d628fe9e90379dcb2342
          rc=$?
          echo "merge_rc=$rc"
          git status --short
          echo "CONFLICTS"
          git diff --name-only --diff-filter=U
          echo "HEALTH_CONFLICT"
          grep -n -B 25 -A 60 -E '^(<<<<<<<|=======|>>>>>>>)' celerp/routers/health.py || true
          exit $rc
