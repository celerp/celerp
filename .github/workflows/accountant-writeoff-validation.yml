name: Accountant write-off validation
on:
  push:
    branches: [accountant-writeoff-validation-20261012]
permissions:
  contents: write
  actions: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: celerp
          POSTGRES_PASSWORD: celerp
          POSTGRES_DB: celerp_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://celerp:celerp@localhost:5432/celerp_test
      ALLOW_INSECURE_JWT: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply candidate patch
        run: |
          cat .github/writeoff-part-1.b64 .github/writeoff-part-2.b64 | tr -d ' \n' | base64 -d | gzip -dc > /tmp/writeoff.patch
          git switch --detach 814d8f9983698890e4a88ace3fa543781143eeae
          git apply --check /tmp/writeoff.patch
          git apply --index /tmp/writeoff.patch
          git diff --cached --check
      - name: Use durable journal state snapshots in tests
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("tests/test_writeoff_cost_restatement.py")
          s = p.read_text()
          s = s.replace("import uuid\n", "import uuid\nfrom types import SimpleNamespace\n")
          a = "    return list((await session.execute("
          b = "    rows = (await session.execute("
          assert s.count(a) == 1
          s = s.replace(a, b)
          a = "    ).order_by(Projection.entity_id))).scalars())"
          b = ("    ).order_by(Projection.entity_id))).scalars().all()\n"
               "    return [SimpleNamespace(entity_id=row.entity_id, state=dict(row.state)) for row in rows]")
          assert s.count(a) == 1
          p.write_text(s.replace(a, b))
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: |
          pip install uv
          uv pip install --system -e ".[dev]" -c constraints.txt
      - name: Regenerate canonical module lock
        run: |
          python scripts/gen_first_party_lock.py
          git add default_modules/first_party.lock.json
          git diff --cached --check
      - name: Test write-off correction and neighbors
        run: |
          pytest -q tests/test_writeoff_cost_restatement.py tests/test_posting_roles_kept_stock.py tests/test_cost_restatement.py tests/test_writeoff_zero_cost.py --tb=short --no-cov -x
      - name: Publish tested correction at exact target head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git add tests/test_writeoff_cost_restatement.py
          git diff --cached --check
          python - <<'PY'
          import subprocess
          expected = {
              "celerp/services/auto_je.py",
              "default_modules/celerp-docs/celerp_docs/routes.py",
              "default_modules/celerp-inventory/celerp_inventory/services.py",
              "default_modules/first_party.lock.json",
              "tests/test_writeoff_cost_restatement.py",
          }
          actual = set(subprocess.check_output(["git", "diff", "--cached", "--name-only"], text=True).splitlines())
          assert actual == expected, (sorted(actual), sorted(expected))
          PY
          git config user.name "Noah Severs"
          git config user.email "118095044+ngsevers@users.noreply.github.com"
          git commit -m "Correct late write-off cost adjustments"
          target=refs/heads/accounting-migration-improvements-20261011
          actual="$(git ls-remote origin "$target" | cut -f1)"
          test "$actual" = "814d8f9983698890e4a88ace3fa543781143eeae" || { echo "Branch moved; no publication"; exit 1; }
          git push origin "HEAD:$target"
          gh workflow run ci.yml --ref accounting-migration-improvements-20261011
