name: Packaged Upgrade Smoke

# The packaged app through a user's upgrade and downgrade: the latest release,
# then the candidate over it, then the release again over the candidate, then the
# candidate once more. Nightly and on demand, never per pull request.
#
# Linux runs each copy over one data directory. The previous release registers
# an owner, which writes the first ledger events, and creates a location; every
# later copy must serve the same ledger events and records, and the same module
# pages (scripts/smoke_records.py). Windows runs each installer over
# the install the step before left, ending with the installer run the in-app
# updater makes (--updated). The pip updater, its state file and a 2.5.0 data
# directory are covered by scripts/e2e_update.py (E6).
#
# The candidate is the dev-latest build, or the Build Binaries run given as
# candidate_run. Releases before GUARDED_SINCE do not check the version of an
# install or of the data before opening it, so with such a release as "previous"
# the downgrade step reports what happened and asserts nothing.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      previous:
        description: "Release tag to upgrade from (blank: the latest release)"
        type: string
        default: ""
      candidate_run:
        description: "Build Binaries run id to take the candidate from (blank: dev-latest)"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

env:
  GUARDED_SINCE: "2.5.4"

jobs:
  upgrade:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: Celerp.AppImage
            artifact: binaries-ubuntu-latest
          - os: windows-latest
            asset: Celerp-Setup.exe
            artifact: binaries-windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the previous release and the candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/previous" "$RUNNER_TEMP/candidate"
          PREVIOUS="${{ inputs.previous }}"
          [ -n "$PREVIOUS" ] || PREVIOUS=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          gh release download "$PREVIOUS" --repo "$GITHUB_REPOSITORY" --pattern "${{ matrix.asset }}" --dir "$RUNNER_TEMP/previous"
          if [ -n "${{ inputs.candidate_run }}" ]; then
            gh run download "${{ inputs.candidate_run }}" --repo "$GITHUB_REPOSITORY" --name "${{ matrix.artifact }}" --dir "$RUNNER_TEMP/candidate"
          else
            gh release download dev-latest --repo "$GITHUB_REPOSITORY" --pattern "${{ matrix.asset }}" --dir "$RUNNER_TEMP/candidate"
          fi
          PREVIOUS_VERSION="${PREVIOUS#v}"
          GUARDED=false
          [ "$(printf '%s\n%s\n' "$GUARDED_SINCE" "$PREVIOUS_VERSION" | sort -V | head -1)" = "$GUARDED_SINCE" ] && GUARDED=true
          echo "PREVIOUS_VERSION=$PREVIOUS_VERSION" >> "$GITHUB_ENV"
          echo "PREVIOUS_GUARDED=$GUARDED" >> "$GITHUB_ENV"
          echo "previous $PREVIOUS (checks before opening: $GUARDED); candidate ${{ inputs.candidate_run || 'dev-latest' }}"

      # Data: each copy opens the same data directory in turn.
      - name: Previous, candidate, downgrade, reopen (Linux, data)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libfuse2 jq >/dev/null
          chmod +x "$RUNNER_TEMP"/previous/Celerp.AppImage "$RUNNER_TEMP"/candidate/Celerp.AppImage
          # The runner image blocks unprivileged user namespaces, so Chromium's sandbox
          # aborts inside an AppImage. Allow them, as a stock desktop install does.
          sudo sysctl -q -w kernel.apparmor_restrict_unprivileged_userns=0
          export HOME="$RUNNER_TEMP/home"; mkdir -p "$HOME"
          # Opens the data with one copy; prints "ready" or "not-ready" after $2 seconds at most.
          # Once ready, runs each smoke_records.py command in $4.. against it, output in $3.<command>.
          open_data() {
            local app="$1" wait="$2" log="$RUNNER_TEMP/$3.log" name="$3"; shift 3
            export CELERP_API_PORT=$(python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1]);s.close()')
            setsid xvfb-run -a "$app" >"$log" 2>&1 &
            local pid=$! deadline=$(( $(date +%s) + wait )) state=not-ready
            while [ "$(date +%s)" -lt "$deadline" ] && kill -0 "$pid" 2>/dev/null; do
              if curl -fs "http://127.0.0.1:$CELERP_API_PORT/health/ready" | grep -q '"db"[[:space:]]*:[[:space:]]*"ok"'; then state=ready; break; fi
              sleep 1
            done
            if [ "$state" = ready ]; then
              for cmd in "$@"; do
                python3 scripts/smoke_records.py "$cmd" "http://127.0.0.1:$CELERP_API_PORT" >"$RUNNER_TEMP/$name.$cmd" 2>&1 || state="$cmd-failed"
              done
            fi
            # Stop the app with its servers and bundled database, so the next copy
            # finds the data directory free.
            kill -TERM -- "-$pid" 2>/dev/null || true
            for _ in $(seq 60); do pgrep -s "$pid" >/dev/null || break; sleep 1; done
            kill -KILL -- "-$pid" 2>/dev/null || true; wait "$pid" 2>/dev/null || true
            echo "$state"
          }
          # The data a refused copy must leave alone: the config and the modules folder.
          data_state() {
            find "$HOME/.config" \( -name 'celerp-config.json' -o -path '*/modules/*' \) -type f -print0 2>/dev/null |
              sort -z | xargs -0 -r sha256sum
          }
          # A copy's view of the records, without its version.
          records() { jq -S 'del(.version)' "$RUNNER_TEMP/$1.snapshot"; }
          version() { jq -r .version "$RUNNER_TEMP/$1.snapshot"; }
          state=$(open_data "$RUNNER_TEMP/previous/Celerp.AppImage" 180 previous seed snapshot)
          [ "$state" = ready ] || { tail -100 "$RUNNER_TEMP/previous.log"; cat "$RUNNER_TEMP"/previous.seed "$RUNNER_TEMP"/previous.snapshot 2>/dev/null || true; echo "::error::previous release did not open fresh data and keep records in it ($state)"; exit 1; }
          echo "previous: opened fresh data, $(cat "$RUNNER_TEMP/previous.seed")"
          state=$(open_data "$RUNNER_TEMP/candidate/Celerp.AppImage" 240 candidate snapshot)
          [ "$state" = ready ] || { tail -100 "$RUNNER_TEMP/candidate.log"; cat "$RUNNER_TEMP/candidate.snapshot" 2>/dev/null || true; echo "::error::candidate did not open the previous release's data ($state)"; exit 1; }
          [ "$(version candidate)" != "$(version previous)" ] || { echo "::error::candidate reports the previous release's version $(version previous)"; exit 1; }
          diff <(records previous) <(records candidate) || { echo "::error::the candidate does not serve the previous release's ledger and records"; exit 1; }
          echo "candidate $(version candidate): opened and migrated the previous release's data; ledger and records unchanged"
          before=$(data_state)
          state=$(open_data "$RUNNER_TEMP/previous/Celerp.AppImage" 90 downgrade)
          after=$(data_state)
          if [ "$PREVIOUS_GUARDED" = true ]; then
            [ "$state" = not-ready ] || { echo "::error::previous release opened data the candidate had opened"; exit 1; }
            [ "$before" = "$after" ] || { diff <(echo "$before") <(echo "$after") || true; echo "::error::previous release changed data it refused"; exit 1; }
            echo "downgrade: refused, config and modules unchanged"
          else
            echo "::notice::previous release $PREVIOUS_VERSION predates the check (from $GUARDED_SINCE); downgrade result: $state, data changed: $([ "$before" = "$after" ] && echo no || echo yes). Not asserted."
          fi
          state=$(open_data "$RUNNER_TEMP/candidate/Celerp.AppImage" 240 reopen snapshot)
          [ "$state" = ready ] || { tail -100 "$RUNNER_TEMP/reopen.log"; echo "::error::candidate did not reopen the data after the downgrade attempt ($state)"; exit 1; }
          [ "$(version reopen)" = "$(version candidate)" ] || { echo "::error::reopened data reports $(version reopen), not $(version candidate)"; exit 1; }
          if [ "$PREVIOUS_GUARDED" = true ]; then
            diff <(records candidate) <(records reopen) || { echo "::error::the refused downgrade changed the ledger or records"; exit 1; }
            echo "reopen: candidate reopened the data; ledger and records unchanged by the refused downgrade"
          else
            echo "reopen: candidate reopened the data; records changed by the unguarded downgrade: $(diff -q <(records candidate) <(records reopen) >/dev/null && echo no || echo yes). Not asserted."
          fi

      # Install: each installer runs over the install the step before left.
      - name: Previous, candidate, downgrade, in-app update run (Windows, install)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Install([string]$setup, [string[]]$installerArgs) {
            (Start-Process -FilePath $setup -ArgumentList $installerArgs -Wait -PassThru).ExitCode
          }
          function Entry {
            Get-ChildItem "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall" |
              Where-Object { (Get-ItemProperty $_.PSPath).DisplayName -like "Celerp*" } |
              Select-Object -First 1
          }
          function Installed { (Get-ItemProperty (Entry).PSPath).DisplayVersion }
          function InstallDir {
            $u = (Get-ItemProperty (Entry).PSPath).UninstallString
            if ($u -notmatch '^"([^"]+)"') { throw "unexpected UninstallString: $u" }
            Split-Path $Matches[1]
          }
          function Fail([string]$why) { Write-Host "::error::$why"; exit 1 }
          function State {
            $dir = InstallDir
            [ordered]@{
              exe      = (Get-FileHash (Join-Path $dir "Celerp.exe") -Algorithm SHA256).Hash
              sentinel = (Get-FileHash (Join-Path $dir "celerp-ci-sentinel.txt") -Algorithm SHA256 -ErrorAction SilentlyContinue).Hash
              entry    = (Get-ItemProperty (Entry).PSPath | Select-Object * -ExcludeProperty PS* | ConvertTo-Json -Compress)
            } | ConvertTo-Json -Compress
          }
          $previous = "$env:RUNNER_TEMP\previous\Celerp-Setup.exe"
          $candidate = "$env:RUNNER_TEMP\candidate\Celerp-Setup.exe"

          $code = Install $previous @("/S", "/currentuser")
          if ($code -ne 0) { Fail "previous release install exited $code" }
          $old = Installed
          Write-Host "previous: installed $old"

          $code = Install $candidate @("/S", "/currentuser")
          $new = Installed
          if ($code -ne 0 -or $new -eq $old) { Fail "candidate over $old exited $code, entry $new" }
          Write-Host "candidate: updated $old to $new"

          Set-Content -Encoding Ascii (Join-Path (InstallDir) "celerp-ci-sentinel.txt") "candidate install"
          $before = State
          $code = Install $previous @("/S", "/currentuser")
          $after = State
          if ($env:PREVIOUS_GUARDED -eq "true") {
            if ($code -ne 2) { Fail "previous release over $new exited $code (want 2)" }
            if ($after -ne $before) { Fail "previous release changed the install:`n before $before`n after  $after" }
            Write-Host "downgrade: stopped with exit 2; exe, sentinel and uninstall entry unchanged"
          } else {
            $changed = if ($after -eq $before) { "no" } else { "yes" }
            Write-Host "::notice::previous release $env:PREVIOUS_VERSION predates the check (from $env:GUARDED_SINCE); downgrade exit $code, install changed: $changed. Not asserted."
          }

          $code = Install $candidate @("--updated", "/S", "/currentuser")
          if ($code -ne 0 -or (Installed) -ne $new) { Fail "in-app update run: exit $code, entry $(Installed) (want exit 0, $new)" }
          Write-Host "update: the in-app update run installed $new without a prompt"
