name: PR415 clean correction publication
on:
  push:
    branches: [fix/pr415-final-check]
permissions:
  contents: write
jobs:
  publish:
    if: github.event.head_commit.message == 'publish-pr415-remediation'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v7
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - name: Install source dependencies
        run: pip install uv && uv pip install --system -e ".[dev]" -c constraints.txt
      - name: Build and publish guarded clean commit
        shell: bash
        run: |
          set -euo pipefail
          PARENT=530cf7aa60d0dee03d440c809911b6fe8a36a358
          SOURCE_TREE=39d465fbb3b4d9ffd6448afa6671a3745510fd26
          REF=refs/heads/fix/pr415-remediation
          test "$(git ls-remote origin "$REF" | cut -f1)" = "$PARENT"
          git rm -q .github/workflows/pr415-final-validate.yml .github/workflows/pr415-clean-publish.yml
          test "$(git write-tree)" = "$SOURCE_TREE"
          python scripts/gen_first_party_lock.py
          python - <<'PY'
          import json,re
          from pathlib import Path
          p=Path("tests/.test_durations")
          raw=p.read_text()
          data=json.loads(raw)
          measured={
            "default_modules/celerp-accounting/tests/test_journal_gl_soa.py::test_by_doc_includes_real_supplier_credit_note_application":0.5659,
            "default_modules/celerp-accounting/tests/test_journal_gl_soa.py::test_by_doc_lookup_uses_indexable_postgres_metadata_containment":0.0079,
            "default_modules/celerp-accounting/tests/test_journal_gl_soa.py::test_by_doc_rejects_non_document_projection":0.2798,
            "default_modules/celerp-accounting/tests/test_journal_gl_soa.py::test_unclassified_journal_cannot_inherit_invoice_items_by_amount":0.5166,
            "tests/test_auto_stamp.py::test_journal_ref_index_is_recognized_as_schema_ddl_not_data_backfill":0.0076,
            "tests/test_nav_overrides.py::test_simultaneous_menu_writes_cannot_lose_a_committed_choice":0.3331,
            "tests/test_services/test_sequences.py::test_distinct_list_counters_cannot_be_configured_with_same_format":0.0056,
            "tests/test_services/test_sequences.py::test_legacy_split_preserves_old_count_but_uses_new_type_prefix":0.0052,
            "tests/test_services/test_sequences.py::test_split_refuses_same_namespace_as_legacy_counter_without_mutation":0.0055,
          }
          assert set(measured).isdisjoint(data)
          data.update(measured)
          match=re.search(r'(?m)^( +)"',raw)
          indent=len(match.group(1)) if match else None
          ordered=list(json.loads(raw))==sorted(json.loads(raw))
          output=json.dumps(data,indent=indent,sort_keys=ordered,ensure_ascii=True)
          p.write_text(output+("\n" if raw.endswith("\n") else ""))
          assert all(json.loads(p.read_text())[key] == val for key,val in measured.items())
          print("MEASURED_DURATION_ENTRIES_ADDED",len(measured))
          PY
          git add tests/.test_durations default_modules/first_party.lock.json
          python - <<'PY'
          import subprocess
          stat=subprocess.check_output(["git","diff","--cached","--numstat","--","tests/.test_durations"],text=True)
          added,deleted,_=stat.strip().split("\t")
          assert 0 < int(added) <= 35 and int(deleted) <= 10,stat
          print("BOUNDED_DURATION_DIFF",added,deleted)
          PY
          git diff --cached --check
          export GIT_AUTHOR_NAME="Noah Severs"
          export GIT_AUTHOR_EMAIL="118095044+ngsevers@users.noreply.github.com"
          export GIT_COMMITTER_NAME="$GIT_AUTHOR_NAME"
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          TREE=$(git write-tree)
          NEW=$(printf '%s\n' 'fix: preserve list numbering and document journal invariants' | git commit-tree "$TREE" -p "$PARENT")
          test "$(git rev-list --parents -n 1 "$NEW")" = "$NEW $PARENT"
          export PARENT NEW
          python - <<'PY'
          import os,subprocess
          old,new=os.environ["PARENT"],os.environ["NEW"]
          files=set(subprocess.check_output(["git","diff-tree","--no-commit-id","--name-only","-r",old,new],text=True).splitlines())
          expected={
            "celerp/migrations/versions/p9q0r1s2t3u4_ledger_doc_lookup.py",
            "celerp/services/ledger_rows.py",
            "default_modules/celerp-accounting/celerp_accounting/routes.py",
            "default_modules/celerp-accounting/tests/test_journal_gl_soa.py",
            "default_modules/celerp-docs/celerp_docs/sequences.py",
            "default_modules/first_party.lock.json",
            "tests/.test_durations",
            "tests/test_auto_stamp.py",
            "tests/test_nav_overrides.py",
            "tests/test_services/test_sequences.py",
          }
          assert files==expected,sorted(files^expected)
          print("VERIFIED_CORRECTION_FILE_COUNT",len(files))
          PY
          test "$(git ls-remote origin "$REF" | cut -f1)" = "$PARENT"
          git push --force-with-lease="$REF:$PARENT" origin "$NEW:$REF"
          test "$(git ls-remote origin "$REF" | cut -f1)" = "$NEW"
          echo "PUBLISHED_CLEAN_HEAD $NEW"
