name: Refresh Python dependencies

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: python-dependency-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve the production dependency graph
        run: |
          python -m pip install uv
          uv pip compile pyproject.toml \
            --extra prod \
            --universal \
            --python-version 3.10 \
            --upgrade \
            -o constraints.txt \
            -q

      - name: Open dependency refresh PR and run CI
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: maintenance/python-dependency-refresh
        shell: bash
        run: |
          set -euo pipefail

          open_pr="$(gh pr list \
            --state open \
            --head "$BRANCH" \
            --json number \
            --jq '.[0].number // empty')"

          # The job replaces the branch only when it is its own: nothing beyond main, or
          # one "Refresh Python dependencies" commit that touches constraints.txt alone.
          git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main"
          lease=""
          if [[ -n "$(git ls-remote --heads origin "refs/heads/$BRANCH")" ]]; then
            git fetch --quiet origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            lease="$(git rev-parse "origin/$BRANCH")"
            if [[ -n "$(git rev-list "origin/main..$lease")" ]] && {
              [[ "$(git log --format=%s "origin/main..$lease")" != "Refresh Python dependencies" ]] ||
              [[ "$(git diff --name-only "origin/main...$lease")" != constraints.txt ]]; }; then
              echo "$BRANCH carries commits other than the job's own refresh commit; leaving it unchanged"
              exit 0
            fi
          fi

          if [[ -n "$open_pr" ]]; then
            if git diff --quiet "$lease" -- constraints.txt &&
              [[ "$(git merge-base origin/main "$lease")" == "$(git rev-parse origin/main)" ]]; then
              echo "Dependency refresh PR #$open_pr is already current"
              exit 0
            fi
            echo "Dependency refresh PR #$open_pr is open but stale; rebuilding it from current main"
          elif git diff --quiet -- constraints.txt; then
            echo "constraints.txt is already current"
            exit 0
          fi

          git config user.name "Noah Severs"
          git config user.email "118095044+ngsevers@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add constraints.txt
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Python dependencies"
          fi

          if [[ -n "$lease" ]]; then
            git push \
              --force-with-lease="refs/heads/$BRANCH:$lease" \
              origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

          if [[ -z "$open_pr" ]]; then
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "Refresh Python dependencies" \
              --body "Refreshes the resolved production dependency graph from pyproject.toml. constraints.txt remains resolver-generated; normal CI validates the complete set before merge."
          fi

          gh workflow run ci.yml --ref "$BRANCH" -f dependency_refresh=true
