name: Refresh Python dependencies

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: python-dependency-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve the production dependency graph
        run: |
          python -m pip install uv
          uv pip compile pyproject.toml \
            --extra prod \
            --universal \
            --python-version 3.10 \
            --upgrade \
            -o constraints.txt \
            -q

      - name: Open dependency refresh PR and run CI
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: maintenance/python-dependency-refresh
        shell: bash
        run: |
          set -euo pipefail

          # The one decision of this step, from the facts observed below. It prints one of:
          # create, update, leave-open-pr, current-skip, current-dispatch-ci.
          # The job never force-pushes and never reads or writes a branch that has no open refresh
          # PR. With none open it opens a new PR on a new branch from current main. An open refresh
          # PR whose branch, merged with main, would change only constraints.txt is updated on top
          # (main merged in, the new resolve committed, a fast-forward push), so its history is
          # kept. Any other open refresh PR is left unchanged.
          decide() {
            local open=$1 pins_only=$2 current=$3 ci=$4
            if ! ((open)); then
              if ((current)); then echo current-skip; else echo create; fi
            elif ! ((pins_only)); then echo leave-open-pr
            elif ((current)); then
              if ((ci)); then echo current-skip; else echo current-dispatch-ci; fi
            else echo update
            fi
          }

          # The resolve ran on the checked-out commit; publish it only while that is still main.
          # Checked here and again directly before any push.
          resolved_on="$(git rev-parse HEAD)"
          require_unmoved_main() {
            git fetch --quiet origin "+refs/heads/main:refs/remotes/origin/main"
            if [[ "$(git rev-parse origin/main)" != "$resolved_on" ]]; then
              echo "main moved to $(git rev-parse --short origin/main) after this run resolved on $(git rev-parse --short "$resolved_on"); not publishing a resolve built on an older main. Run the workflow again to resolve on the new main."
              exit 1
            fi
          }
          require_unmoved_main

          # The open refresh PR: a same-repository PR into main whose branch name starts with $BRANCH.
          open_pr_line="$(gh pr list \
            --state open \
            --base main \
            --limit 1000 \
            --json number,headRefName,isCrossRepository |
            jq -r --arg prefix "$BRANCH" \
              'map(select((.isCrossRepository | not) and (.headRefName | startswith($prefix)))) | first // empty | "\(.number) \(.headRefName)"')"

          open=0 pins_only=0 current=0 ci=0 open_pr=""
          if [[ -n "$open_pr_line" ]]; then
            open=1
            open_pr="${open_pr_line%% *}"
            push_branch="${open_pr_line#* }"
            git fetch --quiet origin "+refs/heads/$push_branch:refs/remotes/origin/$push_branch"
            lease="$(git rev-parse "origin/$push_branch")"
            # Pins-only: git's own merge of the branch into main (over every merge base) would
            # change or conflict on nothing but constraints.txt. merge-tree prints the merged tree,
            # then the conflicted paths; exit 1 is a conflicted merge. Any other failure, such as
            # no shared history, leaves pins_only at 0.
            merge_status=0
            merged="$(git merge-tree --write-tree --name-only --no-messages origin/main "$lease")" || merge_status=$?
            if ((merge_status <= 1)); then
              touched="$({
                tail -n +2 <<<"$merged"
                git diff --no-renames --name-only origin/main "${merged%%$'\n'*}"
              } | sort -u)"
              if [[ -z "$touched" || "$touched" == constraints.txt ]]; then pins_only=1; fi
            fi
            ci_runs="$(gh run list --workflow ci.yml --commit "$lease" --json databaseId --jq '.[].databaseId')"
            if [[ -n "$ci_runs" ]]; then ci=1; fi
            # Current: the PR's branch holds this resolve and sits on current main.
            if git diff --quiet "$lease" -- constraints.txt &&
              [[ "$(git merge-base origin/main "$lease")" == "$(git rev-parse origin/main)" ]]; then
              current=1
            fi
          else
            push_branch="$BRANCH-$GITHUB_RUN_ID"
            # Current: main already holds this resolve.
            if git diff --quiet -- constraints.txt; then current=1; fi
          fi

          action="$(decide "$open" "$pins_only" "$current" "$ci")"
          case "$action" in
            leave-open-pr)
              echo "$push_branch, merged with main, would change more than constraints.txt or git cannot merge it; leaving it unchanged for PR #$open_pr"
              exit 0
              ;;
            current-skip)
              echo "constraints.txt is already current${open_pr:+ on PR #$open_pr}"
              exit 0
              ;;
            current-dispatch-ci)
              echo "Dependency refresh PR #$open_pr is already current but has no CI run; starting CI"
              ;;
            create | update)
              git config user.name "Noah Severs"
              git config user.email "118095044+ngsevers@users.noreply.github.com"
              if [[ "$action" == update ]]; then
                # Build on the branch itself. Its merge with main changes only constraints.txt, so
                # that is the only file the merge can conflict on, and the new resolve replaces
                # it anyway; -X theirs takes main's side there.
                resolved="$(mktemp)"
                cp constraints.txt "$resolved"
                git checkout -- constraints.txt
                git switch -c "$push_branch" "$lease"
                git merge --no-edit -X theirs origin/main
                cp "$resolved" constraints.txt
              else
                git switch -c "$push_branch"
              fi
              git add constraints.txt
              if ! git diff --cached --quiet; then
                git commit -m "Refresh Python dependencies"
              fi
              require_unmoved_main
              # No force: the remote takes this push only as a fast-forward of the head inspected
              # above (update) or as a new branch (create).
              git push origin "HEAD:refs/heads/$push_branch"
              if ! ((open)); then
                gh pr create \
                  --base main \
                  --head "$push_branch" \
                  --title "Refresh Python dependencies" \
                  --body "Refreshes the resolved production dependency graph from pyproject.toml. constraints.txt remains resolver-generated; normal CI validates the complete set before merge."
              fi
              ;;
          esac

          gh workflow run ci.yml --ref "$push_branch" -f dependency_refresh=true
