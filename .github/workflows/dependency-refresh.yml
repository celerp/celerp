name: Refresh Python dependencies

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: python-dependency-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve the production dependency graph
        run: |
          python -m pip install uv
          uv pip compile pyproject.toml \
            --extra prod \
            --universal \
            --python-version 3.10 \
            --upgrade \
            -o constraints.txt \
            -q

      - name: Open dependency refresh PR and run CI
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: maintenance/python-dependency-refresh
        shell: bash
        run: |
          set -euo pipefail

          if git diff --quiet -- constraints.txt; then
            echo "constraints.txt is already current"
            exit 0
          fi

          open_pr="$(gh pr list \
            --state open \
            --head "$BRANCH" \
            --json number \
            --jq '.[0].number // empty')"
          if [[ -n "$open_pr" ]]; then
            echo "Dependency refresh PR #$open_pr is already open"
            exit 0
          fi

          git config user.name "Noah Severs"
          git config user.email "118095044+ngsevers@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add constraints.txt
          git commit -m "Refresh Python dependencies"

          remote_sha="$(git ls-remote --heads origin "refs/heads/$BRANCH" | cut -f1)"
          if [[ -n "$remote_sha" ]]; then
            git push \
              --force-with-lease="refs/heads/$BRANCH:$remote_sha" \
              origin "HEAD:refs/heads/$BRANCH"
          else
            git push origin "HEAD:refs/heads/$BRANCH"
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "Refresh Python dependencies" \
            --body "Refreshes the resolved production dependency graph from pyproject.toml. constraints.txt remains resolver-generated; normal CI validates the complete set before merge."

          gh workflow run ci.yml --ref "$BRANCH"
