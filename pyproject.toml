[project]
name = "celerp"
dynamic = ["version"]
description = "Free, self-hosted ERP for small businesses"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = ["erp", "inventory", "accounting", "self-hosted", "fastapi"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3",
    "cryptography>=42",
    "passlib[bcrypt]>=1.7",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "aiofiles>=23.0",
    "httpx>=0.27",
    "slowapi>=0.1.9",
    "reportlab>=4.0",
    # 0.14 is the floor that works with Starlette 1.0, which dropped the
    # on_startup/on_shutdown arguments earlier fasthtml passes. Both dependencies
    # are otherwise unbounded, so a lower floor lets a resolve pair 0.12 with
    # Starlette 1.x and produce an app that cannot be constructed.
    "python-fasthtml>=0.14",
    "psutil>=5.9",
    "websockets>=12.0",
    "aiosmtplib>=3.0",
    "click>=8.0",
    "python-barcode>=0.15",
    "qrcode>=7.0",
    "Pillow>=10.0",
    "pypdf>=4.0",
    "psycopg2-binary>=2.9",
    # IANA timezone database for zoneinfo. Windows ships no system tz database, so
    # zoneinfo.ZoneInfo() fails there without this; also protects minimal Linux.
    "tzdata>=2024.1",
    # celerp/config.py falls back to tomli where the stdlib has no tomllib (3.10).
    "tomli>=2.0; python_version < \"3.11\"",
    # Bundled PostgreSQL 17 for zero-setup pip installs: `celerp init` boots a
    # self-contained cluster when no system Postgres is running (an existing server
    # always wins). Marker-guarded to platforms with wheels — Linux x86_64/aarch64
    # (glibc and musl) and Windows x64, any CPython. macOS wheels exist but require
    # macOS 26+ (which markers can't express), so darwin users on 26+ opt in with
    # `pip install celerp-postgres`; elsewhere init falls back to external-Postgres
    # guidance. See celerp/embedded_pg.py.
    "celerp-postgres>=17.10,<18; (sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')) or (sys_platform == 'win32' and platform_machine == 'AMD64')",
]

[project.urls]
Homepage = "https://celerp.com"
Repository = "https://github.com/celerp/celerp"
Documentation = "https://celerp.com/docs"

[project.scripts]
celerp = "celerp.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "faker>=24.0",
    "respx>=0.21",
    "playwright>=1.43",
    "pytest-playwright>=0.5",
    "pytest-timeout>=2.3",
    "pytest-xdist>=3.5",
    "testcontainers[postgres]>=4.0",
]
prod = [
    "gunicorn>=22.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# --timeout guards against a hung test wedging the run. 30s was under the real
# cost of a page-rendering test on a slow filesystem: fixture setup alone measures
# 8-19s per worker there, and a two-render test lands at 20-25s, so shards failed
# on timing rather than on anything being wrong. 60s keeps the guard meaningful
# (a genuine deadlock still trips it) with headroom for parallel runs.
addopts = "-q --cov=celerp --cov-report=term-missing -m 'not browser and not embedded_pg' --timeout=60"
norecursedirs = [".git", ".claude", ".venv", "__pycache__", "build", "dist", "premium_modules/*/tests"]
pythonpath = [".", ".."]
markers = [
    "browser: Playwright browser UI tests (requires running servers + Chromium). Run separately with: pytest tests/test_browser/ -m browser",
    "embedded_pg: bundled-PostgreSQL integration tests (boot a real pgserver cluster; ~slow). Run separately with: pytest -m embedded_pg",
]

# NOTE: do NOT set [tool.coverage.run] core = "sysmon" here. The sys.monitoring
# core is more accurate for async ASGI handlers, but it breaks the connector
# tests' respx/AsyncMock interception under coverage (the legacy C tracer is
# required for this suite). Async-handler coverage is therefore under-reported
# by the default tracer — verify those paths by functional test review.

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["celerp", "celerp.*", "ui", "ui.*", "default_modules"]

[tool.setuptools.package-data]
"celerp" = [
    "alembic.ini",
    "migrations/*.py",
    "migrations/*.mako",
    "migrations/versions/*.py",
    "migrations/README.md",
    "py.typed",
]
"ui" = [
    "static/*",
    "locales/**/*",
]
"default_modules" = [
    "celerp-accounting/**/*",
    "celerp-admin/**/*",
    "celerp-ai/**/*",
    "celerp-backup/**/*",
    "celerp-connectors/**/*",
    "celerp-contacts/**/*",
    "celerp-dashboard/**/*",
    "celerp-docs/**/*",
    "celerp-fulfillment/**/*",
    "celerp-inventory/**/*",
    "celerp-labels/**/*",
    "celerp-manufacturing/**/*",
    "celerp-reports/**/*",
    "celerp-subscriptions/**/*",
    "celerp-verticals/**/*",
]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/**", "*.pyc", "*.pyo"]

[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
# node-and-date appends the commit hash + build date to non-release builds, e.g.
# 0.1.dev158+ge75c48e.d20260627, so a dev build identifies the exact commit it was
# built from (a clean tagged release emits no local segment and stays e.g. 1.2.6).
local_scheme = "node-and-date"
tag_regex = "^v(?P<version>\\d+\\.\\d+\\.\\d+)$"
