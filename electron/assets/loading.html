<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Celerp</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #111827;
    color: #f9fafb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    user-select: none;
    -webkit-app-region: drag;
  }
  .logo {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #fff;
  }
  .logo span { color: #6366f1; }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading, .refusal {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  [hidden] { display: none !important; }
  .refusal { max-width: 32rem; padding: 0 24px; text-align: center; gap: 16px; -webkit-app-region: no-drag; user-select: text; }
  .refusal p { line-height: 1.5; }
  .refusal .detail { color: #9ca3af; }
  .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 8px; }
  .actions button, .actions a {
    font: inherit;
    font-size: 0.9rem;
    padding: 8px 16px;
    border-radius: 6px;
    border: 1px solid #374151;
    background: transparent;
    color: #f9fafb;
    text-decoration: none;
    cursor: pointer;
  }
  .actions button.primary { background: #6366f1; border-color: #6366f1; }
  .actions button:disabled { opacity: 0.6; cursor: default; }
  .status {
    font-size: 0.85rem;
    color: #9ca3af;
    min-height: 1.2em;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="logo">Celer<span>p</span></div>
  <div class="loading" id="loading"><div class="spinner"></div></div>
  <div class="refusal" id="refusal" hidden>
    <p id="refusal-message"></p>
    <p class="detail" id="refusal-detail"></p>
    <div class="actions">
      <button type="button" class="primary" id="refusal-update"></button>
      <a id="refusal-download"></a>
      <button type="button" id="refusal-quit"></button>
    </div>
  </div>
  <div class="status" id="status">Starting…</div>
  <script src="refusal.js"></script>
  <script>
    function setStatus(msg) {
      var el = document.getElementById('status');
      if (el) el.textContent = msg;
    }
    // Expose globally so executeJavaScript from main process can call it
    window.setLoadingStatus = setStatus;
  </script>
</body>
</html>
