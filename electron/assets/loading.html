<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Celerp</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #111827;
    color: #f9fafb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    user-select: none;
    -webkit-app-region: drag;
  }
  .logo {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    color: #fff;
  }
  .logo span { color: #6366f1; }
  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid rgba(255,255,255,0.15);
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status {
    font-size: 0.85rem;
    color: #9ca3af;
    min-height: 1.2em;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="logo">Celer<span>p</span></div>
  <div class="spinner"></div>
  <div class="status" id="status">Starting…</div>
  <script>
    // Listen for status updates from main process via localStorage polling
    // (simple cross-context comms without needing a preload on this page)
    function setStatus(msg) {
      var el = document.getElementById('status');
      if (el) el.textContent = msg;
    }
    // Expose globally so executeJavaScript from main process can call it
    window.setLoadingStatus = setStatus;
  </script>
</body>
</html>
